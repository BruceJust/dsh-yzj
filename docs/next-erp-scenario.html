<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>恒测加急单：一张图，三本账，一条恒等式，一个新的计划对象</title>
<style>
:root{
  --paper:#eeeee7; --page:#fbfbf7; --ink:#1e1e1c; --muted:#6a6a64;
  --rule:#c3cedf; --rule-strong:#3a5583; --red:#c4463a; --seal:#b4322b;
  --ok:#2d6b4d; --warn:#b3781c; --agent:#3a5583; --lit:#fff1bd; --ext:#8a6d3b;
  --song:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rule-strong);outline-offset:2px}
a{color:inherit}

.masthead{max-width:1360px;margin:0 auto;padding:28px 28px 14px}
.masthead h1{font-family:var(--song);font-weight:600;font-size:34px;line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.masthead .lede{font-family:var(--song);font-size:17px;margin:0 0 16px;color:#3a3a36;max-width:46em}
.concepts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.concepts button{border:1px solid var(--ink);padding:4px 12px;border-radius:999px;font-size:14px;background:var(--page)}
.concepts button.on{background:var(--ink);color:var(--page)}
.concepts .sep{color:var(--muted);font-size:13px;margin-left:6px}

.book{max-width:1360px;margin:0 auto;padding:0 28px 110px;display:grid;grid-template-columns:minmax(380px,7fr) minmax(420px,8fr);gap:22px;align-items:start}
.page{background:var(--page);border:1px solid #d9d9d0;box-shadow:0 1px 0 #d2d2c8;min-height:70vh}
.page-right{position:sticky;top:12px;max-height:calc(100vh - 100px);overflow:auto}
.page-head{font-family:var(--song);font-size:16px;padding:14px 18px 10px;border-bottom:1px solid var(--rule-strong);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.page-head .clock{font-size:14px;color:var(--muted)}

/* left page: ruled ledger with red margin rule */
.page-left{position:relative;background-image:linear-gradient(to right,transparent 74px,var(--red) 74px,var(--red) 75px,transparent 75px);background-size:100% 100%}
.page-left.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--lit)}100%{box-shadow:0 1px 0 #d2d2c8}}
#stream{padding:6px 0 30px}
.day{font-family:var(--song);font-size:13px;color:var(--rule-strong);padding:18px 18px 4px 88px;letter-spacing:.06em}
.scene{padding:8px 18px 6px 88px}
.scene-title{font-family:var(--song);font-weight:600;font-size:16px}
.narr{margin:2px 0 4px;color:#33332f}
.old{margin:0 0 4px;font-size:13px;color:var(--muted);border-left:2px solid #d6d6cc;padding-left:8px}
.old b{font-weight:500;color:#8a8a82}
.ev{display:grid;grid-template-columns:75px 1fr;border-bottom:1px solid var(--rule);cursor:pointer}
.ev:hover{background:#f4f4ee}
.ev.sel{background:var(--lit)}
.ev .gutter{font-family:var(--song);font-size:13px;color:var(--muted);text-align:right;padding:10px 10px 0 0}
.ev .body{padding:9px 18px 9px 13px}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.kind-agent .dot{background:var(--page);border:2px dashed var(--agent)}
.kind-xagent .dot{background:var(--page);border:2px dashed var(--ext)}
.kind-ext .dot{background:var(--page);border:2px solid var(--ext)}
.kind-sys .dot{border-radius:1px;background:var(--rule-strong);width:8px;height:8px;margin:0 1px}
.who .role{color:var(--muted)}
.tag{margin-left:auto;font-size:12px;color:var(--rule-strong);border:1px solid var(--rule);padding:0 6px;border-radius:3px;white-space:nowrap}
.tag.judg{color:var(--seal);border-color:#e3b3ae}
.tag.pledge{color:var(--ok);border-color:#b8d4c5}
.tag.ret{color:var(--warn);border-color:#e6cfa0}
.ev .text{font-family:var(--song);font-size:15.5px;line-height:1.65}
.ev .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.ev .meta b{font-weight:500;color:var(--agent)}
.ev.fresh{animation:ink .5s ease-out}
@keyframes ink{from{background:var(--lit)}to{background:transparent}}

.prompt{margin:10px 18px 14px 88px;border:1.5px solid var(--seal);padding:12px 14px 14px;background:#fffdf8}
.prompt-head{font-family:var(--song);font-weight:600;font-size:15px;color:var(--seal);display:flex;justify-content:space-between;gap:10px}
.prompt-head span{font-weight:400;color:var(--muted);font-size:13px}
.prompt .q{font-family:var(--song);font-size:17px;margin:6px 0 8px}
.prompt .evidence{margin:0 0 12px;padding-left:18px;font-size:13.5px;color:#3a3a36}
.prompt .evidence li{margin:2px 0}
.prompt .evidence-h{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.options{display:grid;gap:8px}
.options button{text-align:left;border:1px solid var(--ink);padding:9px 12px;background:var(--page);display:grid;gap:2px}
.options button:hover{background:var(--lit)}
.options button b{font-weight:600;font-family:var(--song);font-size:15.5px}
.options button span{font-size:13px;color:var(--muted)}
.wait{font-size:13px;color:var(--muted);margin-top:6px}

/* right page */
.tabs{display:flex;border-bottom:1px solid var(--rule-strong);padding:10px 12px 0;gap:4px;flex-wrap:wrap}
.tabs button{font-family:var(--song);font-size:15px;padding:7px 12px 6px;border:1px solid var(--rule);border-bottom:0;background:#f1f1ea;margin-bottom:-1px}
.tabs button.on{background:var(--page);border-color:var(--rule-strong);position:relative}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--page)}
.tabs button .n{font-size:12px;color:var(--muted);margin-left:5px}
.tab-def{padding:12px 18px 6px;font-size:13.5px;color:#3a3a36;border-bottom:1px solid var(--rule)}
.tab-def b{font-family:var(--song);font-weight:600;color:var(--ink)}
#proj{padding:8px 18px 26px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 6px 4px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--song);font-size:14.5px;white-space:nowrap}
td.song{font-family:var(--song);font-size:14.5px}
tr.lit td{background:var(--lit)}
tr.fresh td{animation:ink .6s ease-out}
tr[data-ref]{cursor:pointer}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.sub .ev-link{color:var(--rule-strong);text-decoration:underline dotted;cursor:pointer}
.total td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:600}
.total td.num{font-size:16px}
.empty{padding:26px 6px;color:var(--muted);font-size:14px}

.stamp{display:inline-block;font-family:var(--song);font-weight:700;color:var(--seal);border:1.5px solid var(--seal);border-radius:50%;width:2.5em;height:2.5em;line-height:2.35em;text-align:center;font-size:13px;transform:rotate(-11deg);opacity:.86;box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px var(--seal);letter-spacing:.02em;white-space:nowrap}
.stamp.ink{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px var(--ink)}
.stamp.gray{color:#8a8a82;border-color:#8a8a82;box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px #8a8a82}
.stamp.wide{border-radius:4px;width:auto;padding:0 6px;height:1.7em;line-height:1.6em}
.fresh .stamp{animation:press .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes press{from{transform:rotate(-11deg) scale(1.9);opacity:0}to{transform:rotate(-11deg) scale(1);opacity:.86}}
.st{font-size:13px;white-space:nowrap}
.st.warn{color:var(--warn);font-weight:600}
.st.bad{color:var(--seal);font-weight:600}
.st.wait{color:var(--muted)}
.gates{display:inline-flex;gap:3px;vertical-align:middle}
.gate{width:13px;height:13px;border:1.5px solid var(--ink);display:inline-block;position:relative}
.gate.on{background:var(--ink)}
.gate.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.gates-h{font-size:11.5px;color:var(--muted);margin-left:4px;white-space:nowrap}
td.nw{white-space:nowrap}
tr.has-hist td{border-bottom:0;padding-bottom:2px}
tr.hist td{padding-top:0}
.hsep{color:var(--muted)}

.bands{margin:10px 0 4px;display:grid;gap:6px}
.band{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;font-size:13px}
.band .bar{height:10px;border:1px solid var(--ink);position:relative;background:var(--page)}
.band .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.band .bar i.full{background:var(--seal)}
.band .n{font-family:var(--song);text-align:right}
.h{font-family:var(--song);font-weight:600;font-size:15px;margin:16px 0 4px}
.h:first-child{margin-top:6px}
.note{font-size:13px;color:#3a3a36;margin:4px 0 8px}
.chain{font-family:var(--song);font-size:14.5px;margin:4px 0}
.chain .arrow{color:var(--muted);margin:0 6px}
.check{font-family:var(--song);font-size:16px;margin:6px 0 2px}
.check b{color:var(--ok)}
.file{border:1px solid var(--rule);padding:10px 12px;margin-top:6px}
.file .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.file .row:last-child{border-bottom:0}
.file .row .cnt{font-family:var(--song);white-space:nowrap}

.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(238,238,231,.94);backdrop-filter:blur(4px);border-top:1px solid #cfcfc5;padding:12px 28px;display:flex;align-items:center;gap:16px;z-index:5}
.controls .inner{max-width:1360px;margin:0 auto;width:100%;display:flex;align-items:center;gap:16px}
.controls .status{flex:1;font-size:13.5px;color:#3a3a36}
.controls .status b{font-family:var(--song);font-weight:600}
.controls button{border:1px solid var(--ink);padding:8px 16px;background:var(--page)}
.controls button.primary{background:var(--ink);color:var(--page);padding:8px 22px;font-family:var(--song);font-size:16px}
.controls button:disabled{opacity:.45;cursor:not-allowed}
.settle{margin:14px 18px 8px 88px;border:1px solid var(--ink);padding:12px 14px;background:var(--page)}
.settle .h{margin-top:0}
.settle table{font-size:13.5px}

@media (max-width:980px){
  .book{grid-template-columns:1fr;padding:0 14px 120px}
  .masthead{padding:20px 14px 10px}
  .masthead h1{font-size:26px}
  .page{min-height:0}
  .page-right{position:static;max-height:none;overflow:visible}
  .page-left{background-image:linear-gradient(to right,transparent 56px,var(--red) 56px,var(--red) 57px,transparent 57px)}
  .ev{grid-template-columns:57px 1fr}
  .day,.scene,.prompt,.settle{padding-left:66px}
  .prompt,.settle{margin-left:66px}
  .band{grid-template-columns:auto 1fr 50px}
  .band > span:first-child{white-space:nowrap}
  .controls{padding:10px 14px}
  .controls .status{font-size:12.5px;line-height:1.35}
  .controls .hint{display:none}
  .controls button{padding:8px 12px}
  .controls button.primary{padding:8px 14px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .ev.fresh,tr.fresh td,.fresh .stamp,.page-left.flash{animation:none}
}
</style>
</head>
<body>
<header class="masthead">
  <h1>恒测加急单</h1>
  <p class="lede">旧 ERP 记这四周发生了什么。新 ERP 记这四周谁答应了什么、谁赌了什么、最后谁对。一家做压力传感器的公司，一张提前二十天的订单，你替老周、老陈、小林和小赵做决定，看五本账怎么从同一条事件流里长出来。</p>
  <nav class="concepts" id="concepts"></nav>
</header>

<main class="book">
  <section class="page page-left" id="leftpage">
    <div class="page-head"><span>一张图，企业的事件流</span><span class="clock" id="clock"></span></div>
    <div id="stream"></div>
  </section>
  <section class="page page-right">
    <div class="tabs" id="tabs"></div>
    <div class="tab-def" id="tabdef"></div>
    <div id="proj"></div>
  </section>
</main>

<footer class="controls"><div class="inner">
  <button id="reset">重来</button>
  <div class="status" id="status"></div>
  <button id="next" class="primary">下一步</button>
</div></footer>

<script>
/* ---------- 基础 ---------- */
const F=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('zh-CN');
const H=(name,role)=>({name,role,kind:'human'});
const AG=name=>({name,kind:'agent'});
const XH=(name,role)=>({name,role,kind:'ext'});
const XA=(name,role)=>({name,role,kind:'xagent'});
const SYS={name:'系统',kind:'sys'};
let _id=0; const E=o=>({id:'e'+(++_id),...o});

const LEASES={
  '销售 agent':{by:'老周',scope:'读订单、库存、产能，拟回复',budget:'无支出权',until:'12 月 31 日'},
  '采购 agent':{by:'小林',scope:'询价、下单、催料',budget:'单笔不超过 10 万',until:'10 月 31 日'},
};
const PEOPLE={
  '老周':{role:'销售总监',cap:4,base:2},
  '小林':{role:'采购经理',cap:5,base:5},
  '老陈':{role:'厂长',cap:3,base:1},
};
const PRIOR_FILE={
  '老周':[{cat:'为续签牺牲单笔毛利',n:3,hit:2},{cat:'保毛利放弃增量',n:2,hit:1},{cat:'主动告知延期',n:4,hit:4}],
};
const CAT={J1A:'为续签牺牲单笔毛利',J1B:'为续签牺牲单笔毛利',J1C:'保毛利放弃增量',J4:'主动告知延期'};

const DEFS={
  graph:['一张图','企业的全部活动落成一条事件流。右边每一页都是它的投影，每走一步整体重算。'],
  need:['计划对象','旧 MRP 把订单炸成物料需求。这里把订单炸成判断需求：哪些决定只能由人做，排在谁的判断带宽上。执行不排期。'],
  judg:['判断账','每个判断在做出的那一刻立账：赌什么、预期什么信号、何时回看。到期自己回来对账，形成判断力档案。'],
  pledge:['承诺账','谁欠谁一个交付。承诺时确认义务，回执三门过完才核销。权责发生制用在工作上。'],
  money:['钱账','法定的第一本账，降级为投影。没有人录凭证，每个数字点回证据，证据点回一个人的判断。'],
  law:['恒等式','任何 agent 的行动链，末端必须是一个能担责的人。agent 只在租约下行动；责任不能委派，只能移交并签收。'],
};
const TABS=['need','pledge','judg','money','law'];

/* ---------- 剧本 ---------- */
const SCENES=[
{id:'pre',t:'8/20',title:'此前',narrative:'两张订单已经在账上。钱账里是 22% 的标准毛利，承诺板上是两条对客户的承诺。',old:'',
 events:()=>[
  E({t:'8/20 10:00',actor:H('老周','销售总监'),type:'pledge',text:'A 客户订单立账：8,000 台压力传感器，10 月 30 日交付。',
    pledge:{id:'P0',who:'恒测',to:'A 客户',what:'8,000 台压力传感器',when:'10 月 30 日'},
    money:[{id:'M0',acct:'收入',label:'合同额，8,000 台 × 980 元',amount:7840000},{id:'M1',acct:'标准成本',label:'标准成本率 78%',amount:-6115200}]}),
  E({t:'8/26 14:00',actor:H('老周','销售总监'),type:'pledge',text:'B 客户订单立账：3,000 台，10 月 15 日交付。',
    pledge:{id:'PB',who:'恒测',to:'B 客户',what:'3,000 台压力传感器',when:'10 月 15 日'}}),
 ]},

{id:'s0',t:'9/15 09:12',title:'一句话进图',narrative:'这句话不是录入，是一个事件。它落进事件图，后面的一切都从它推导。',old:'销售在 ERP 里录订单变更单，走信用复核。客户等回复。',
 events:()=>[E({t:'9/15 09:12',actor:XH('王工','A 客户采购'),type:'msg',text:'原定 10 月 30 日交付的 8,000 台，能不能提前到 10 月 10 日？我们产线提前投产。'})]},

{id:'s1',t:'9/15 09:20',title:'系统排的是判断，不是物料',narrative:'旧 MRP 到这里炸出物料需求。新系统炸出判断需求：这张单里哪些决定只能由人做，排在谁的判断带宽上。执行不排期，因为执行不稀缺。',old:'计划员等晚上 MRP 跑完才知道缺什么。缺料生成采购申请，进三级审批。',
 events:()=>[
  E({t:'9/15 09:20',actor:AG('销售 agent'),type:'fact',text:'对应订单 SO-26-0912。成品加在制 3,500 台，缺口 4,500 台。瓶颈是 MCU 芯片：现有 3,000 颗，正常交期六周，加急两周溢价 12%。产线要么加班六天，要么挤占 B 客户 10 月 15 日的 3,000 台。'}),
  E({t:'9/15 09:21',actor:SYS,type:'need',text:'炸出三个判断需求。J1 归老周，J2 归小林，J3 归老陈。J2 和 J3 等 J1 的结果。',need:[
    {id:'J1',who:'老周',q:'接不接？接了，挤不挤 B 客户？',evidence:'A 客户续签节点，B 客户违约条款，两家历史准时率，三个选项的毛利',sched:'今天 15:00，老周有二十分钟空档'},
    {id:'J2',who:'小林',q:'芯片加急溢价，付不付？',evidence:'租约上限，备选供应商交期，不加急的后果',sched:'等 J1。小林在制判断已满，排到明早 09:00',status:'等 J1'},
    {id:'J3',who:'老陈',q:'4,500 台的产能从哪来？',evidence:'上月加班时长，外协厂不良率',sched:'等 J1。今天 16:00',status:'等 J1'}]}),
 ]},

{id:'s2',t:'9/15 15:10',title:'判断账：决定的那一刻立此存照',narrative:'老周在手机上看到取景框。他选的不只是一个方案，还有一条会在 12 月 20 日自己回来的判断。',old:'销售总监在群里拍板。ERP 里只留下一张改过日期的订单，看不出为什么改。',
 prompt:{kind:'judgment',who:'老周',role:'销售总监',nid:'J1',q:'接不接？接了，挤不挤 B 客户？',
  evidence:['A 客户年框 2,000 万，12 月续签。对方产线提前投产，续签额度有翻倍的传闻。','B 客户合同：延期每日 0.5% 违约金，上限 15 万。B 年框 800 万。','历史准时率：A 客户 97%，B 客户 99%。','三个选项的毛利：不挤 B、加急加加班约 15%；挤 B 约 20%，若付违约金约 18%；不接 22%。'],
  options:[{key:'A',label:'接，不挤 B，加班加加急芯片',detail:'毛利约 15%，B 客户不受影响'},{key:'B',label:'接，挤 B 客户，不加急',detail:'毛利约 20%，B 客户的承诺要改签'},{key:'C',label:'不接，维持 10 月 30 日',detail:'毛利 22%，可能错过续签翻倍'}],

/* ---------- 状态与推进 ---------- */
let state;
function init(){
  _id=0;
  state={played:[],events:[],decisions:{},pending:null,cursor:0,sel:null,tab:'need',fresh:new Set(),done:false};
  playScene(SCENES[0]);
  render();
}
function playScene(sc){
  const evs=sc.events?sc.events(state.decisions):[];
  state.fresh=new Set(evs.map(e=>e.id));
  state.events.push(...evs);
  state.played.push({scene:sc,events:evs,resolved:[]});
  if(sc.prompt)state.pending=sc;
}
function advance(){
  if(state.pending||state.done)return;
  let i=state.cursor+1;
  while(i<SCENES.length&&SCENES[i].when&&!SCENES[i].when(state.decisions))i++;
  if(i>=SCENES.length){state.done=true;state.fresh=new Set();render();return;}
  state.cursor=i;playScene(SCENES[i]);render();
  scrollToBottom();
}
function resolve(key){
  const sc=state.pending;if(!sc)return;
  const evs=sc.prompt.resolve(key,state.decisions);
  state.fresh=new Set(evs.map(e=>e.id));
  state.events.push(...evs);
  state.played[state.played.length-1].resolved=evs;
  state.pending=null;render();
  scrollToBottom();
}
function scrollToBottom(){
  const el=document.getElementById('stream');
  const last=el.lastElementChild;
  if(last&&window.innerWidth>980)last.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ---------- 投影：一切从 events 重算 ---------- */
function build(events){
  const pledges=new Map(),needs=new Map(),judg=new Map(),money=[],holders={},agents=[],handoffs=[];
  for(const e of events){
    e.refs=[];
    if(e.actor.kind==='agent'){e.responsible=holders[e.actor.name]||LEASES[e.actor.name].by;agents.push(e);}
    switch(e.type){
      case 'pledge':pledges.set(e.pledge.id,{...e.pledge,status:e.pledge.status||'立账',gates:{done:false,accept:false,clear:false},hist:[],ev:e.id});e.refs.push(e.pledge.id);break;
      case 'pledge_update':{const p=pledges.get(e.pid);if(p){Object.assign(p,e.patch||{});if(e.gates)Object.assign(p.gates,e.gates);if(e.note)p.hist.push({t:e.t,note:e.note,ev:e.id});}e.refs.push(e.pid);break;}
      case 'need':for(const n of e.need){needs.set(n.id,{...n,status:n.status||'待判',ev:e.id});e.refs.push(n.id);}break;
      case 'need_update':for(const u of e.nu){const n=needs.get(u.id);if(n){n.status=u.status;if(u.pick)n.pick=u.pick;}e.refs.push(u.id);}break;
      case 'judgment':judg.set(e.j.id,{...e.j,who:e.actor.name,t:e.t,status:'待回看',ev:e.id});e.refs.push(e.j.id);break;
      case 'judgment_update':{const j=judg.get(e.jid);if(j){j.status=e.status;j.result=e.note;j.rev=e.id;}e.refs.push(e.jid);break;}
      case 'handoff':handoffs.push(e);if(!e.pending&&!e.declined)holders[e.lease]=e.to;break;
    }
    if(e.money)for(const m of e.money){money.push({...m,ev:e.id,t:e.t});e.refs.push(m.id);}
  }
  return {pledges,needs,judg,money,holders,agents,handoffs};
}
function marginPct(events){const {money}=build(events);const rev=money.filter(m=>m.amount>0).reduce((a,m)=>a+m.amount,0);const gp=money.reduce((a,m)=>a+m.amount,0);return (gp/rev*100).toFixed(1)+'%';}

/* ---------- 渲染 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dayOf(t){const m=t.match(/^(\d+)\/(\d+)/);return m?`${m[1]} 月 ${m[2]} 日`:t;}
function hm(t){const m=t.match(/\d+:\d+$/);return m?m[0]:'';}

function render(){
  const P=build(state.events);
  renderConcepts();renderStream(P);renderTabs(P);renderProj(P);renderControls();
}
function renderConcepts(){
  const keys=['graph',...TABS];
  $('#concepts').innerHTML=keys.map(k=>`<button data-k="${k}" class="${k!=='graph'&&state.tab===k?'on':''}">${DEFS[k][0]}</button>`).join('')+'<span class="sep">点一个概念，右页翻到那一账</span>';
  $('#concepts').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='graph'){const lp=$('#leftpage');lp.classList.remove('flash');void lp.offsetWidth;lp.classList.add('flash');lp.scrollIntoView({behavior:'smooth',block:'start'});}else{state.tab=k;render();if(window.innerWidth<=980)$('.page-right').scrollIntoView({behavior:'smooth',block:'start'});}});
}
function tagOf(e){
  const map={msg:['消息',''],fact:['事实',''],need:['判断需求',''],need_update:['判断需求',''],judgment:['判断','judg'],pledge:['承诺立账','pledge'],pledge_update:['承诺变动','pledge'],receipt:['回执','pledge'],return:['回程','ret'],handoff:['移交','ret'],judgment_update:['回看','judg']};
  const [n,c]=map[e.type]||[e.type,''];return `<span class="tag ${c}">${n}</span>`;
}
function metaOf(e){
  if(e.actor.kind==='agent'){const L=LEASES[e.actor.name];return `回程：<b>${e.responsible}</b>。租约由 ${L.by} 签发，${L.scope}，${L.budget}，至 ${L.until}`;}
  if(e.actor.kind==='xagent')return e.actor.role||'';
  return '';
}
function renderStream(P){
  let html='',lastDay='';
  for(const blk of state.played){
    const sc=blk.scene;
    const d=dayOf(sc.t);
    if(d!==lastDay){html+=`<div class="day">${d}</div>`;lastDay=d;}
    html+=`<div class="scene"><div class="scene-title">${esc(sc.title)}</div>${sc.narrative?`<p class="narr">${esc(sc.narrative)}</p>`:''}${sc.old?`<p class="old"><b>旧 ERP 此刻</b> ${esc(sc.old)}</p>`:''}</div>`;
    const evs=[...blk.events,...blk.resolved].filter(e=>!e.silent);
    for(const e of evs){
      html+=`<article class="ev kind-${e.actor.kind} ${state.fresh.has(e.id)?'fresh':''} ${state.sel===e.id?'sel':''}" data-id="${e.id}" tabindex="0">
        <div class="gutter">${hm(e.t)}</div>
        <div class="body">
          <div class="who"><span class="dot"></span><span>${esc(e.actor.name)}</span>${e.actor.role&&e.actor.kind!=='xagent'?`<span class="role">${esc(e.actor.role)}</span>`:''}${tagOf(e)}</div>
          <div class="text">${esc(e.text)}</div>
          ${metaOf(e)?`<div class="meta">${metaOf(e)}</div>`:''}
        </div></article>`;
    }
    if(state.pending===sc){
      const p=sc.prompt;
      html+=`<section class="prompt fresh">
        <div class="prompt-head"><span>${p.kind==='judgment'?'取景框':'待受领'}，等 ${p.who} 的${p.kind==='judgment'?'判断':'动作'}</span><span>${esc(p.role)}${p.nid?'，'+p.nid:''}</span></div>
        <p class="q">${esc(p.q)}</p>
        <div class="evidence-h">系统已取好景的证据</div>
        <ul class="evidence">${p.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <div class="options">${p.options.map(o=>`<button data-key="${o.key}"><b>${esc(o.label)}</b><span>${esc(o.detail)}</span></button>`).join('')}</div>
        <div class="wait">你替${p.who}做这个${p.kind==='judgment'?'判断':'动作'}。下一步在你选完之前不会走。</div>
      </section>`;
    }
  }
  if(state.done)html+=renderSettle(P);
  $('#stream').innerHTML=html;
  $('#stream').querySelectorAll('.ev').forEach(el=>{el.onclick=()=>{state.sel=state.sel===el.dataset.id?null:el.dataset.id;state.fresh=new Set();render();};el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();el.click();}}});
  $('#stream').querySelectorAll('.options button').forEach(b=>b.onclick=()=>resolve(b.dataset.key));
  $('#clock').textContent=state.done?'12 月 20 日之后':(SCENES[state.cursor].t.replace(/^(\d+)\/(\d+)\s*/,(m,a,b)=>`${a} 月 ${b} 日 `));
}
function renderSettle(P){
  const humanJ=state.events.filter(e=>e.type==='judgment').length;
  const signs=state.events.filter(e=>e.type==='handoff'&&!e.pending&&!e.declined).length;
  const agentActs=P.agents.length;
  const {money}=P;const rev=money.filter(m=>m.amount>0).reduce((a,m)=>a+m.amount,0);const gp=money.reduce((a,m)=>a+m.amount,0);
  return `<div class="settle"><div class="h">结算：这四周里人做了什么</div>
    <table><tr><td>人做的判断</td><td class="num">${humanJ} 次</td></tr>
    <tr><td>移交签收</td><td class="num">${signs} 次</td></tr>
    <tr><td>agent 动作，每条末端一个人名</td><td class="num">${agentActs} 条</td></tr>
    <tr><td>打开的 ERP 界面</td><td class="num">0 个</td></tr>
    <tr><td>录入的凭证</td><td class="num">0 张</td></tr>
    <tr class="total"><td>本单毛利率</td><td class="num">${(gp/rev*100).toFixed(1)}%</td></tr></table>
    <p class="note">旧 ERP 走完同一件事，按常规流程估算：屏幕十几个，审批人六位，凭证九张，对"答应了 10 月 10 日"负责的人，零位。点右页的概念标签，回头看每一本账现在的样子；点"重来"，换一条路走。</p></div>`;
}
function renderTabs(P){
  const cnt={need:[...P.needs.values()].filter(n=>n.status==='待判').length,pledge:[...P.pledges.values()].filter(p=>!['已核销'].includes(p.status)).length,judg:[...P.judg.values()].filter(j=>j.status==='待回看').length,money:P.money.length,law:P.agents.length};
  $('#tabs').innerHTML=TABS.map(k=>`<button data-k="${k}" class="${state.tab===k?'on':''}">${DEFS[k][0]}<span class="n">${cnt[k]}</span></button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.k;state.fresh=new Set();render();});
  $('#tabdef').innerHTML=`<b>${DEFS[state.tab][0]}</b> ${DEFS[state.tab][1]}`;
}
function lit(ref){if(!state.sel)return '';const e=state.events.find(x=>x.id===state.sel);return e&&e.refs.includes(ref)?'lit':'';}
function freshRow(ev){return state.fresh.has(ev)?'fresh':'';}
function evLink(id,label){const e=state.events.find(x=>x.id===id);return e?`<span class="ev-link" data-ev="${id}">${label||hm(e.t)?dayOf(e.t)+' '+hm(e.t):e.t}</span>`:'';}
function stamp(status){
  if(status==='已核销')return `<span class="stamp">核销</span>`;
  if(status==='印证')return `<span class="stamp">印证</span>`;
  if(status==='推翻')return `<span class="stamp ink">推翻</span>`;
  if(status==='未推翻')return `<span class="stamp gray">未推翻</span>`;
  if(status==='悬空')return `<span class="st warn">悬空</span>`;
  if(status==='逾期')return `<span class="st bad">逾期</span>`;
  if(status==='待回看'||status==='待签收'||status==='等 J1')return `<span class="st wait">${status}</span>`;
  return `<span class="st">${status}</span>`;
}
function gates(g){
  const box=v=>`<span class="gate ${v===true?'on':v==='half'?'half':''}"></span>`;
  return `<span class="gates">${box(g.done)}${box(g.accept)}${box(g.clear)}</span><span class="gates-h">做了 验收 核销</span>`;
}
function renderProj(P){
  let html='';
  if(state.tab==='need'){
    const rows=[...P.needs.values()];
    html+=`<div class="h">判断带宽</div><div class="bands">`+Object.entries(PEOPLE).map(([n,p])=>{const open=p.base+rows.filter(r=>r.who===n&&r.status==='待判').length;const w=Math.min(100,open/p.cap*100);return `<div class="band"><span>${n}，${p.role}</span><span class="bar"><i class="${open>=p.cap?'full':''}" style="width:${w}%"></i></span><span class="n">${open} / ${p.cap}</span></div>`;}).join('')+`</div><p class="note">在制判断数对上限。满了的人，新判断只能排队，系统不会往桌上堆。执行不占这条带宽。</p>`;
    html+=`<div class="h">判断需求</div>`;
    html+=rows.length?`<table><tr><th></th><th>谁做</th><th>问题</th><th>证据已取景</th><th>排在</th><th>状态</th></tr>`+rows.map(r=>`<tr data-ref="${r.id}" class="${lit(r.id)} ${freshRow(r.ev)}"><td class="song">${r.id}</td><td>${r.who}</td><td class="song">${esc(r.q)}</td><td>${esc(r.evidence)}</td><td>${esc(r.sched)}</td><td>${r.status==='已判'?`<span class="st">已判，${esc(r.pick||'')}</span>`:r.status==='撤销'?`<span class="st wait">撤销</span>`:stamp(r.status)}</td></tr>`).join('')+`</table>`:`<div class="empty">还没有判断需求。订单进图之后，系统会把它炸成判断，而不是物料。</div>`;
  }
  if(state.tab==='pledge'){
    const rows=[...P.pledges.values()];
    html+=`<div class="h">承诺板，也是对账面</div>`;
    html+=`<table><tr><th>谁</th><th>欠谁</th><th>什么</th><th>何时</th><th>三门</th><th>状态</th></tr>`+rows.map(p=>{const cls=`${lit(p.id)} ${freshRow(p.hist.length?p.hist[p.hist.length-1].ev:p.ev)}`;return `<tr data-ref="${p.id}" class="${cls} ${p.hist.length?'has-hist':''}"><td class="song">${esc(p.who)}</td><td class="song">${esc(p.to)}</td><td class="song">${esc(p.what)}</td><td class="song nw">${esc(p.when)}</td><td>${gates(p.gates)}</td><td>${stamp(p.status)}</td></tr>`+(p.hist.length?`<tr data-ref="${p.id}" class="hist ${cls}"><td colspan="6"><div class="sub">${p.hist.map(h=>`${evLink(h.ev)} ${esc(h.note)}`).join('<span class="hsep">；</span>')}</div></td></tr>`:'');}).join('')+`</table>`;
    html+=`<p class="note">旧的任务管理是收付实现制，做完才算。承诺账是权责发生制：承诺那一刻义务就确认，三门过完才核销。悬空和逾期自己浮出来。</p>`;
  }
  if(state.tab==='judg'){
    const rows=[...P.judg.values()];
    html+=`<div class="h">判断账</div>`;
    html+=rows.length?`<table><tr><th>谁，何时</th><th>赌什么</th><th>预期信号</th><th>回看</th><th>代价</th><th>结果</th></tr>`+rows.map(j=>`<tr data-ref="${j.id}" class="${lit(j.id)} ${freshRow(j.rev||j.ev)}"><td>${j.who}<div class="sub">${evLink(j.ev)}</div></td><td class="song">${esc(j.bet)}</td><td>${esc(j.signal)}</td><td>${esc(j.review)}</td><td>${esc(j.cost)}</td><td>${stamp(j.status)}${j.result?`<div class="sub">${esc(j.result)}</div>`:''}</td></tr>`).join('')+`</table>`:`<div class="empty">还没有判断。判断在做出的那一刻立账，不是事后补写。</div>`;
    const cats={};for(const j of rows)if(j.who==='老周'&&j.cat){cats[j.cat]=cats[j.cat]||{n:0,hit:0,miss:0};cats[j.cat].n++;if(j.status==='印证')cats[j.cat].hit++;if(j.status==='推翻')cats[j.cat].miss++;}
    html+=`<div class="h">老周的判断力档案</div><div class="file">`+PRIOR_FILE['老周'].map(f=>{const c=cats[f.cat]||{n:0,hit:0,miss:0};return `<div class="row"><span>${f.cat}</span><span class="cnt">此前 ${f.n} 次，印证 ${f.hit}${c.n?`；本案 ${c.n} 次${c.hit?'，印证 '+c.hit:''}${c.miss?'，推翻 '+c.miss:''}`:''}</span></div>`;}).join('')+`</div><p class="note">档案记的是判断的理由和结果，不是功过。下一次同类判断需求出现，取景框会把这里摆进证据栏。</p>`;
  }
  if(state.tab==='money'){
    const rows=P.money;const rev=rows.filter(m=>m.amount>0).reduce((a,m)=>a+m.amount,0);const gp=rows.reduce((a,m)=>a+m.amount,0);
    html+=`<div class="h">本单钱账，SO-26-0912</div>`;
    html+=`<table><tr><th>科目</th><th>摘要</th><th class="num">金额</th><th>证据</th></tr>`+rows.map(m=>`<tr data-ref="${m.id}" class="${lit(m.id)} ${freshRow(m.ev)}"><td>${esc(m.acct)}</td><td>${esc(m.label)}</td><td class="num">${F(m.amount)}</td><td class="sub">${evLink(m.ev)}</td></tr>`).join('')+`<tr class="total"><td>毛利</td><td>毛利率 ${(gp/rev*100).toFixed(1)}%，标准 22.0%</td><td class="num">${F(gp)}</td><td></td></tr></table>`;
    html+=`<p class="note">每一行都是从事件流投影出来的，没有人录入。点证据一栏，左页会跳到那件事；从那件事，再点回一个人的判断。</p>`;
  }
  if(state.tab==='law'){
    const acts=P.agents;
    html+=`<div class="check">agent 动作 ${acts.length} 条。末端是一个人的：<b>${acts.length} 条</b>。</div><p class="note">这不是统计出来的，是结构保证的。agent 没有租约就不能动，租约一定由人签发，租约上的名字可以移交，但不能为空。</p>`;
    html+=`<div class="h">租约</div>`;
    for(const [name,L] of Object.entries(LEASES)){
      const chain=[L.by];for(const h of P.handoffs)if(h.lease===name&&!h.pending&&!h.declined)chain.push(`${h.to}，${dayOf(h.t)}签收`);
      html+=`<div class="chain">${name}<span class="arrow">租约</span>${chain.join('<span class="arrow">移交</span>')}</div><div class="sub">${L.scope}。${L.budget}。至 ${L.until}。</div>`;
    }
    html+=`<div class="h">agent 做过的每一件事</div>`;
    html+=acts.length?`<table><tr><th>何时</th><th>agent</th><th>做了什么</th><th>回程到谁</th></tr>`+acts.map(e=>`<tr data-ev="${e.id}" class="${state.sel===e.id?'lit':''} ${freshRow(e.id)}"><td class="sub">${dayOf(e.t)} ${hm(e.t)}</td><td>${e.actor.name}</td><td class="song">${esc(e.text)}</td><td class="song">${e.responsible}</td></tr>`).join('')+`</table>`:`<div class="empty">agent 还没有动过。</div>`;
    const x=state.events.filter(e=>e.actor.kind==='xagent');
    if(x.length)html+=`<p class="note">对方的 agent 出现了 ${x.length} 次。它们不在恒测的租约里，但在对方的账本上同样连着一个人。跨企业的承诺要两本账互认，这就是清算所的位置。</p>`;
  }
  $('#proj').innerHTML=html;
  $('#proj').querySelectorAll('tr[data-ref]').forEach(tr=>tr.onclick=ev=>{if(ev.target.closest('.ev-link'))return;const ref=tr.dataset.ref;const e=[...state.events].reverse().find(x=>x.refs.includes(ref)&&!x.silent);if(e)jumpTo(e.id);});
  $('#proj').querySelectorAll('tr[data-ev]').forEach(tr=>tr.onclick=()=>jumpTo(tr.dataset.ev));
  $('#proj').querySelectorAll('.ev-link').forEach(a=>a.onclick=ev=>{ev.stopPropagation();jumpTo(a.dataset.ev);});
}
function jumpTo(id){state.sel=id;state.fresh=new Set();render();const el=document.querySelector(`.ev[data-id="${id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
function renderControls(){
  const n=$('#next');
  if(state.done){n.disabled=true;n.textContent='已到 12 月 20 日';}
  else if(state.pending){n.disabled=true;n.textContent=`等 ${state.pending.prompt.who} 选`;}
  else{n.disabled=false;const i=nextIndex();n.textContent=i<SCENES.length?`下一步，${SCENES[i].t.replace(/^(\d+)\/(\d+)\s*/,(m,a,b)=>`${a} 月 ${b} 日 `)}`:'结算';}
  const d=state.decisions;const path=d.J1?({A:'接，不挤 B',B:'接，挤 B',C:'不接'}[d.J1]):'还没做第一个判断';
  $('#status').innerHTML=`第 <b>${state.played.length-1}</b> 步。路线：${path}${d.J4?('，'+({tell:'分批告知',hide:'不告知',pay:'付违约金',undo:'撤回'}[d.J4])):''}。<span class="hint">左页点任何一件事，右页对应的账会亮起来。</span>`;
}
function nextIndex(){let i=state.cursor+1;while(i<SCENES.length&&SCENES[i].when&&!SCENES[i].when(state.decisions))i++;return i;}

$('#next').onclick=advance;
$('#reset').onclick=()=>{init();window.scrollTo({top:0,behavior:'smooth'});};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key!=='ArrowRight')return;if(e.key==='ArrowRight'){e.preventDefault();advance();}});
init();
</script>
</body>
</html>

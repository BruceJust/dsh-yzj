<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>恒测加急单：一张图，三本账，一条恒等式，一个新的计划对象</title>
<style>
:root{
  --paper:#eeeee7; --page:#fbfbf7; --ink:#1e1e1c; --muted:#6a6a64;
  --rule:#c3cedf; --rule-strong:#3a5583; --red:#c4463a; --seal:#b4322b;
  --ok:#2d6b4d; --warn:#b3781c; --agent:#3a5583; --lit:#fff1bd; --ext:#8a6d3b;
  --oldpage:#f4f4f1; --oldline:#cfcfc8; --ghost:#8c8c85;
  --song:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rule-strong);outline-offset:2px}

.masthead{max-width:1360px;margin:0 auto;padding:26px 28px 0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.masthead h1{font-family:var(--song);font-weight:600;font-size:34px;line-height:1.2;margin:0 0 4px;letter-spacing:.02em}
.modeswitch{display:inline-flex;border:1px solid var(--ink);padding:2px;background:var(--page)}
.modeswitch button{font-family:var(--song);font-size:15px;padding:4px 14px}
.modeswitch button.on{background:var(--ink);color:var(--page)}
.masthead .lede{font-family:var(--song);font-size:17px;margin:0 0 14px;color:#3a3a36;max-width:46em}
.concepts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.concepts button{border:1px solid var(--ink);padding:4px 12px;border-radius:999px;font-size:14px;background:var(--page)}
.concepts button.on{background:var(--ink);color:var(--page)}
.concepts button .was{color:var(--muted);font-size:12.5px;margin-left:4px}
.concepts button.on .was{color:#cfcfc7}
.concepts .sep{color:var(--muted);font-size:13px;margin-left:6px}

.rail{max-width:1360px;margin:14px auto 12px;padding:0 28px;overflow-x:auto}
.rail-in{display:flex;align-items:flex-end;gap:0;min-width:max-content;border-bottom:1px solid var(--ink);padding-bottom:6px}
.tick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 9px;position:relative;cursor:default}
.tick .lbl{font-family:var(--song);font-size:12px;color:var(--muted);height:16px;white-space:nowrap}
.tick .m{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--page)}
.tick.played .m{background:#b9b9b1;border-color:#b9b9b1}
.tick.current .m{background:var(--ink);border-color:var(--ink);transform:scale(1.35)}
.tick.judg .m{box-shadow:0 0 0 2px var(--page),0 0 0 3.5px var(--seal)}
.tick.played,.tick.current{cursor:pointer}
.tick .ttl{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--ink);background:var(--page);border:1px solid var(--rule);padding:2px 8px;margin-top:6px;display:none;z-index:3}
.tick:hover .ttl{display:block}

.book{max-width:1360px;margin:0 auto;padding:0 28px 110px;display:grid;grid-template-columns:minmax(380px,7fr) minmax(420px,8fr);gap:22px;align-items:start}
.page{background:var(--page);border:1px solid #d9d9d0;box-shadow:0 1px 0 #d2d2c8;min-height:70vh}
.page-right{position:sticky;top:12px;max-height:calc(100vh - 100px);overflow:auto}
.page-head{font-family:var(--song);font-size:16px;padding:14px 18px 10px;border-bottom:1px solid var(--rule-strong);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.page-head .clock{font-size:14px;color:var(--muted)}

.page-left{position:relative;background-image:linear-gradient(to right,transparent 74px,var(--red) 74px,var(--red) 75px,transparent 75px)}
.page-left.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--lit)}100%{box-shadow:0 1px 0 #d2d2c8}}
#stream{padding:6px 0 30px}
.day{font-family:var(--song);font-size:13px;color:var(--rule-strong);padding:18px 18px 4px 88px;letter-spacing:.06em}
.scene{padding:8px 18px 6px 88px}
.scene-title{font-family:var(--song);font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bridge{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--rule-strong);text-decoration:underline dotted;white-space:nowrap}
.narr{margin:2px 0 4px;color:#33332f}
.ev{display:grid;grid-template-columns:75px 1fr;border-bottom:1px solid var(--rule);cursor:pointer}
.ev:hover{background:#f4f4ee}
.ev.sel{background:var(--lit)}
.ev .gutter{font-family:var(--song);font-size:13px;color:var(--muted);text-align:right;padding:10px 10px 0 0}
.ev .body{padding:9px 18px 9px 13px}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:2px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.kind-agent .dot{background:var(--page);border:2px dashed var(--agent)}
.kind-xagent .dot{background:var(--page);border:2px dashed var(--ext)}
.kind-ext .dot{background:var(--page);border:2px solid var(--ext)}
.kind-sys .dot{border-radius:1px;background:var(--rule-strong);width:8px;height:8px;margin:0 1px}
.who .role{color:var(--muted)}
.tag{margin-left:auto;font-size:12px;color:var(--rule-strong);border:1px solid var(--rule);padding:0 6px;border-radius:3px;white-space:nowrap}
.tag.judg{color:var(--seal);border-color:#e3b3ae}
.tag.pledge{color:var(--ok);border-color:#b8d4c5}
.tag.ret{color:var(--warn);border-color:#e6cfa0}
.ev .text{font-family:var(--song);font-size:15.5px;line-height:1.65}
.ev .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.ev .meta b{font-weight:500;color:var(--agent)}
.ev.fresh{animation:ink .5s ease-out}
@keyframes ink{from{background:var(--lit)}to{background:transparent}}

.prompt{margin:10px 18px 14px 88px;border:1.5px solid var(--seal);padding:12px 14px 14px;background:#fffdf8}
.prompt-head{font-family:var(--song);font-weight:600;font-size:15px;color:var(--seal);display:flex;justify-content:space-between;gap:10px}
.prompt-head span{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.prompt .q{font-family:var(--song);font-size:17px;margin:6px 0 8px}
.prompt .evidence{margin:0 0 12px;padding-left:18px;font-size:13.5px;color:#3a3a36}
.prompt .evidence li{margin:2px 0}
.prompt .evidence-h{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.options{display:grid;gap:8px}
.options button{text-align:left;border:1px solid var(--ink);padding:9px 12px;background:var(--page);display:grid;gap:2px}
.options button:hover{background:var(--lit)}
.options button b{font-weight:600;font-family:var(--song);font-size:15.5px}
.options button span{font-size:13px;color:var(--muted)}
.wait{font-size:13px;color:var(--muted);margin-top:6px}
.prompt.old-note{border-color:var(--ghost);background:#f7f7f4}
.prompt.old-note .prompt-head{color:var(--ghost)}

/* 旧 ERP 视角 */
.book.mode-old .page-left{background-image:none;background:var(--oldpage)}
.book.mode-old .day{color:var(--muted)}
.doc{display:grid;grid-template-columns:75px 1fr;border-bottom:1px solid var(--oldline);cursor:pointer}
.doc:hover{background:#efefeb}
.doc.sel{background:var(--lit)}
.doc .gutter{font-family:var(--song);font-size:13px;color:var(--muted);text-align:right;padding:10px 10px 0 0}
.doc .body{padding:9px 18px 9px 13px}
.doc .text{font-size:14.5px;line-height:1.6}
.doc .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.doc.fresh{animation:ink .5s ease-out}
.module{font-size:12px;color:var(--page);background:#5c5c56;padding:0 6px;border-radius:2px;white-space:nowrap}
.doc-title{font-family:var(--song);font-size:15px;font-weight:600}
.counts{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.counts b{font-weight:600;color:var(--ink)}
.kind-ghost{border-left:3px dashed var(--ghost);margin-left:75px;grid-template-columns:1fr}
.kind-ghost .body{padding-left:12px}
.kind-ghost .who{color:var(--ghost)}
.ghost-mark{width:10px;height:10px;border-radius:50%;border:1.5px dashed var(--ghost);flex:none}
.kind-ghost .text{color:var(--ghost);font-family:var(--song)}
.kind-ghost .meta{color:#5e5e58}
.kind-lag .doc-title{color:var(--muted)}
.lagnote{font-size:12px;color:var(--warn)}

.tabs{display:flex;border-bottom:1px solid var(--rule-strong);padding:10px 12px 0;gap:4px;flex-wrap:wrap;align-items:flex-end}
.tabs button{font-family:var(--song);font-size:15px;padding:7px 12px 6px;border:1px solid var(--rule);border-bottom:0;background:#f1f1ea;margin-bottom:-1px;position:relative}
.tabs button.on{background:var(--page);border-color:var(--rule-strong)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--page)}
.tabs button .n{font-size:12px;color:var(--muted);margin-left:5px}
.tabs button.changed::before{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--seal)}
.tabs .follow{margin-left:auto;font-family:var(--sans);font-size:12.5px;color:var(--muted);border:0;padding:6px 4px;background:none;margin-bottom:0}
.tabs .follow .box{display:inline-block;width:11px;height:11px;border:1.5px solid var(--muted);vertical-align:-1px;margin-right:4px}
.tabs .follow.on .box{background:var(--ink);border-color:var(--ink)}
.tab-def{padding:12px 18px 6px;font-size:13.5px;color:#3a3a36;border-bottom:1px solid var(--rule)}
.tab-def b{font-family:var(--song);font-weight:600;color:var(--ink)}
#proj{padding:8px 18px 26px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 6px 4px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--song);font-size:14.5px;white-space:nowrap}
td.song{font-family:var(--song);font-size:14.5px}
td.nw{white-space:nowrap}
tr.lit td{background:var(--lit)}
tr.fresh td{animation:ink .6s ease-out}
tr[data-ref],tr[data-ev]{cursor:pointer}
tr.has-hist td{border-bottom:0;padding-bottom:2px}
tr.hist td{padding-top:0}
.hsep{color:var(--muted)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.sub .ev-link{color:var(--rule-strong);text-decoration:underline dotted;cursor:pointer}
.total td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:600}
.total td.num{font-size:16px}
.empty{padding:26px 6px;color:var(--muted);font-size:14px}
.absent{padding:22px 6px;font-family:var(--song);font-size:16px;color:var(--ghost);border:1.5px dashed var(--ghost);margin-top:10px}
.absent .sub{font-family:var(--sans);margin-top:8px;color:#5e5e58}

.stamp{display:inline-block;font-family:var(--song);font-weight:700;color:var(--seal);border:1.5px solid var(--seal);border-radius:50%;width:2.5em;height:2.5em;line-height:2.35em;text-align:center;font-size:13px;transform:rotate(-11deg);opacity:.86;box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px var(--seal);letter-spacing:.02em;white-space:nowrap}
.stamp.ink{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px var(--ink)}
.stamp.gray{color:#8a8a82;border-color:#8a8a82;box-shadow:inset 0 0 0 1.5px var(--page),inset 0 0 0 2.5px #8a8a82}
.fresh .stamp{animation:press .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes press{from{transform:rotate(-11deg) scale(1.9);opacity:0}to{transform:rotate(-11deg) scale(1);opacity:.86}}
.st{font-size:13px;white-space:nowrap}
.st.warn{color:var(--warn);font-weight:600}
.st.bad{color:var(--seal);font-weight:600}
.st.wait{color:var(--muted)}
.gates{display:inline-flex;gap:3px;vertical-align:middle}
.gate{width:13px;height:13px;border:1.5px solid var(--ink);display:inline-block}
.gate.on{background:var(--ink)}
.gate.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.gates-h{font-size:11.5px;color:var(--muted);margin-left:4px;white-space:nowrap}

.bands{margin:10px 0 4px;display:grid;gap:6px}
.band{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;font-size:13px}
.band > span:first-child{white-space:nowrap}
.band .bar{height:10px;border:1px solid var(--ink);position:relative;background:var(--page)}
.band .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.band .bar i.full{background:var(--seal)}
.band .n{font-family:var(--song);text-align:right}
.h{font-family:var(--song);font-weight:600;font-size:15px;margin:16px 0 4px}
.h:first-child{margin-top:6px}
.note{font-size:13px;color:#3a3a36;margin:4px 0 8px}
.chain{font-family:var(--song);font-size:14.5px;margin:4px 0}
.chain .arrow{color:var(--muted);margin:0 6px}
.check{font-family:var(--song);font-size:16px;margin:6px 0 2px}
.check b{color:var(--ok)}
.file{border:1px solid var(--rule);padding:10px 12px;margin-top:6px}
.file .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.file .row:last-child{border-bottom:0}
.file .row .cnt{font-family:var(--song);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:6px 0 10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--song)}

.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(238,238,231,.94);backdrop-filter:blur(4px);border-top:1px solid #cfcfc5;padding:12px 28px;z-index:5}
.controls .inner{max-width:1360px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px}
.controls .status{flex:1;font-size:13.5px;color:#3a3a36}
.controls .status b{font-family:var(--song);font-weight:600}
.controls button{border:1px solid var(--ink);padding:8px 14px;background:var(--page);white-space:nowrap}
.controls button.primary{background:var(--ink);color:var(--page);padding:8px 22px;font-family:var(--song);font-size:16px}
.controls button.primary.go{background:var(--seal);border-color:var(--seal)}
.controls button:disabled{opacity:.45;cursor:not-allowed}
.settle{margin:14px 18px 8px 88px;border:1px solid var(--ink);padding:12px 14px;background:var(--page)}
.settle .h{margin-top:0}
.settle table{font-size:13.5px}
.settle td.num,.settle th.num{font-size:14px;white-space:normal;text-align:left}
.settle td:first-child{white-space:nowrap;color:var(--muted)}
.settle tr.total td:first-child{color:var(--ink)}

@media (max-width:980px){
  .book{grid-template-columns:1fr;padding:0 14px 120px}
  .masthead{padding:20px 14px 0}
  .masthead h1{font-size:26px}
  .rail{padding:0 14px}
  .page{min-height:0}
  .page-right{position:static;max-height:none;overflow:visible}
  .page-left{background-image:linear-gradient(to right,transparent 56px,var(--red) 56px,var(--red) 57px,transparent 57px)}
  .ev,.doc{grid-template-columns:57px 1fr}
  .kind-ghost{margin-left:57px;grid-template-columns:1fr}
  .day,.scene,.prompt,.settle{padding-left:66px}
  .prompt,.settle{margin-left:66px}
  .band{grid-template-columns:auto 1fr 50px}
  .controls{padding:8px 14px}
  .controls .inner{flex-wrap:wrap;gap:8px}
  .controls .status{flex-basis:100%;order:-1;font-size:12.5px;line-height:1.35}
  .controls button{flex:1}
  .controls #reset{flex:0 0 auto}
  .controls .hint{display:none}
  .controls button{padding:8px 10px}
  .controls button.primary{padding:8px 12px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .ev.fresh,.doc.fresh,tr.fresh td,.fresh .stamp,.page-left.flash{animation:none}
}
/* ===== 重构：舞台 ===== */
body{padding-bottom:84px}
.hero{max-width:1400px;margin:0 auto;padding:22px 28px 6px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:baseline}
.hero h1{font-family:var(--song);font-weight:600;font-size:30px;margin:0;letter-spacing:.02em;white-space:nowrap}
.hero .thesis{font-family:var(--song);font-size:21px;line-height:1.45;margin:0;color:var(--ink)}
.hero .sub{grid-column:2;margin:2px 0 0;font-size:14px;color:#4a4a45;max-width:62em}

.tl{max-width:1400px;margin:10px auto 0;padding:0 28px;overflow-x:auto}
.tl-in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;min-width:max-content;padding:4px 0 8px;border-bottom:1px solid var(--ink)}
.tl-t{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 10px;position:relative}
.tl-t .d{font-family:var(--song);font-size:12.5px;color:var(--muted);height:17px;white-space:nowrap}
.tl-t .m{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:var(--page)}
.tl-t.played .m{background:#b3b3aa;border-color:#b3b3aa}
.tl-t.played{cursor:pointer}
.tl-t.judg .m{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--seal)}
.tl-t.here .m{background:var(--ink);border-color:var(--ink);transform:scale(1.4)}
.tl-t.viewing .m{background:var(--rule-strong);border-color:var(--rule-strong);transform:scale(1.4)}
.tl-t .tip{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;white-space:nowrap;font-size:12px;background:var(--page);border:1px solid var(--rule);padding:2px 8px;display:none;z-index:4}
.tl-t:hover .tip,.tl-t:focus-visible .tip{display:block}

.main{max-width:1400px;margin:0 auto;padding:14px 28px 0;display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.scene-card{position:sticky;top:12px;background:var(--page);border:1px solid #d9d9d0;padding:14px 16px 16px;max-height:calc(100vh - 110px);overflow:auto}
.sc-date{font-family:var(--song);font-size:13px;color:var(--rule-strong);letter-spacing:.04em}
.sc-title{font-family:var(--song);font-weight:600;font-size:19px;line-height:1.35;margin:2px 0 8px}
.sc-path{margin-top:12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}
.sc-path b{font-weight:500;color:var(--ink)}
.decide{border:1.5px solid var(--seal);padding:11px 12px 12px;background:#fffdf8;margin-top:4px}
.decide .dh{font-family:var(--song);font-size:14px;color:var(--seal);display:flex;justify-content:space-between;gap:8px}
.decide .dh span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.decide .q{font-family:var(--song);font-size:17px;line-height:1.45;margin:6px 0 8px}
.decide ul{margin:0 0 10px;padding-left:17px;font-size:13px;color:#3a3a36}
.decide ul li{margin:2px 0}
.decide .eh{font-size:12px;color:var(--muted)}
.decide .oldway{font-size:12.5px;color:var(--ghost);border-left:2px dashed var(--ghost);padding-left:8px;margin:0 0 10px}
.decide .opts{display:grid;gap:7px}
.decide .opts button{text-align:left;border:1px solid var(--ink);padding:8px 11px;background:var(--page);display:grid;gap:1px}
.decide .opts button:hover{background:var(--lit)}
.decide .opts button b{font-family:var(--song);font-weight:600;font-size:15px}
.decide .opts button span{font-size:12.5px;color:var(--muted)}
.decide.fresh{animation:ink .6s ease-out}
.viewnote{border:1px solid var(--rule-strong);padding:8px 10px;font-size:13px;color:var(--rule-strong);margin-top:6px}
.viewnote button{text-decoration:underline;color:var(--rule-strong)}

.stage{min-width:0}
.viewing{display:none;margin:0 0 8px;padding:6px 12px;background:#e6ebf3;border:1px solid var(--rule);font-size:13px;color:var(--rule-strong)}
.viewing.on{display:flex;justify-content:space-between;gap:10px}
.viewing button{color:var(--rule-strong);text-decoration:underline}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{margin:0;background:var(--page);border:1px solid #d9d9d0;display:flex;flex-direction:column;min-width:0}
.pane figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--rule)}
.pane figcaption b{font-family:var(--song);font-size:16px;font-weight:600}
.pane figcaption span{font-size:12px;color:var(--muted);text-align:right}
.pane-old{background:var(--oldpage)}
.pane .now{margin-top:auto;padding:9px 14px 11px;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.55;color:#33332f;min-height:64px}
.pane .now i{font-style:normal;color:var(--muted);margin-right:4px}
.pane-old .now{border-top-color:var(--oldline);color:#4d4d48}

/* 旧 ERP 格子 */
.erp{padding:10px 12px 8px;display:grid;gap:8px}
.erp-sys{border:1.5px solid #6d6d66;padding:18px 8px 8px;position:relative}
.erp-tag{position:absolute;top:-9px;left:10px;background:var(--oldpage);padding:0 6px;font-size:12px;color:#5c5c56}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mod{background:#fbfbf9;border:1px solid var(--oldline);padding:6px 8px 7px;min-height:92px}
.mod h4{margin:0 0 4px;font-size:12.5px;font-weight:600;color:var(--page);background:#5c5c56;display:flex;justify-content:space-between;padding:1px 6px;margin:-6px -8px 6px}
.mod h4 span{font-weight:400;opacity:.85}
.fld{font-size:12.5px;border:1px solid #d8d8d2;background:var(--page);padding:2px 6px;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.fld b{font-weight:500;font-family:var(--song)}
.fld.flash{animation:ink .8s ease-out}
.fld .calm{color:var(--ghost);font-size:11.5px;white-space:nowrap}
.mdocs{list-style:none;margin:4px 0 0;padding:0;font-size:12px;color:#5e5e58}
.mdocs li{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdocs li.fresh{color:var(--ink);background:var(--lit)}
.mdocs li.wait{color:var(--warn)}
.mod .empty{padding:6px 0 0;font-size:12.5px;color:var(--ghost)}
.erp-sign{margin-top:7px;font-size:12px;color:#5c5c56;display:flex;justify-content:space-between;gap:8px}
.erp-sign b{color:var(--seal);font-weight:600}
.erp-out{border:1.5px dashed var(--ghost);padding:16px 8px 8px;position:relative;min-height:62px}
.erp-out .erp-tag{color:var(--ghost)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border:1px dashed var(--ghost);color:#5e5e58;padding:1px 7px;background:var(--oldpage);border-radius:10px}
.chip.fresh{border-style:solid;border-color:#5e5e58;color:var(--ink);background:var(--page);animation:ink .6s ease-out}
.chip-n{font-size:12px;color:var(--ghost);align-self:center}

/* 新账图 */
#graph{display:block;width:100%;height:auto;padding:4px 6px 0}
.g-bound{fill:none;stroke:var(--rule);stroke-dasharray:3 4}
.g-blabel{font-size:12px;fill:var(--rule-strong);font-family:var(--song)}
.g-ext rect{fill:var(--page);stroke:var(--ext);stroke-width:1.5}
.g-ext text{font-size:13px;fill:var(--ink);font-family:var(--song);text-anchor:middle;dominant-baseline:middle}
.g-hum circle.body{fill:var(--ink)}
.g-hum.dim circle.body{fill:#b9b9b1}
.g-hum.ghost circle.body{fill:var(--page);stroke:var(--ink);stroke-dasharray:3 3}
.g-name{font-size:13.5px;font-family:var(--song);text-anchor:middle;fill:var(--ink)}
.g-role{font-size:11px;text-anchor:middle;fill:var(--muted)}
.g-hum.dim .g-name{fill:var(--muted)}
.g-agent circle{fill:var(--page);stroke:var(--agent);stroke-width:1.8;stroke-dasharray:3 2.5}
.g-agent text{font-size:11.5px;text-anchor:middle;fill:var(--agent)}
.g-lease{stroke:var(--agent);stroke-width:1.2;stroke-dasharray:1.5 3;fill:none;opacity:.7}
.g-lease.lit{stroke-width:2.6;opacity:1;stroke-dasharray:6 4;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
.g-lease-t{font-size:10.5px;fill:var(--agent)}
.g-edge{fill:none;stroke-width:1.8;stroke:var(--ink)}
.g-edge.pending{stroke-dasharray:6 4}
.g-edge.hang{stroke:var(--warn);stroke-width:3.2}
.g-edge.late{stroke:var(--seal);stroke-width:3.2}
.g-edge.done{stroke:#b9b9b1;stroke-width:1.4}
.g-edge.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.g-edge.pulse{animation:pulse 1.3s ease-out 2}
@keyframes pulse{0%{stroke-width:7;opacity:.4}100%{opacity:1}}
.g-elabel{font-size:12px;font-family:var(--song);fill:var(--ink);paint-order:stroke;stroke:var(--page);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.g-elabel.hang{fill:var(--warn);font-weight:600}
.g-elabel.late{fill:var(--seal);font-weight:600}
.g-elabel.done{fill:#9a9a92}
.g-need{fill:none;stroke:var(--seal);stroke-width:2;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{r:20;opacity:1}100%{r:31;opacity:0}}
.g-needt{font-size:11px;fill:var(--seal);font-weight:600}
.g-seal{stroke-width:1.5}
.g-seal.wait{fill:var(--page);stroke:var(--seal)}
.g-seal.hit{fill:var(--seal);stroke:var(--seal)}
.g-seal.miss{fill:var(--ink);stroke:var(--ink)}
.g-seal.gray{fill:#a3a39b;stroke:#a3a39b}
.g-seal.fresh{animation:seal .55s cubic-bezier(.2,.9,.3,1.3);transform-box:fill-box;transform-origin:center}
@keyframes seal{from{transform:scale(2.6);opacity:0}to{transform:scale(1);opacity:1}}
.g-sealt{font-size:9.5px;fill:var(--muted)}
.g-flow{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:2 5;opacity:.8}
.g-dot{fill:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 14px 8px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.legend i.hang{border-top:3px solid var(--warn)}
.legend i.late{border-top:3px solid var(--seal)}
.legend i.done{border-top-color:#b9b9b1}
.legend i.lease{border-top:2px dotted var(--agent)}
.legend i.pend{border-top-style:dashed}

/* 五问 */
.qboard{margin-top:14px;background:var(--page);border:1px solid #d9d9d0}
.qb-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px 6px;border-bottom:1px solid var(--rule-strong)}
.qb-h b{font-family:var(--song);font-size:16px;font-weight:600}
.qb-h span{font-size:12.5px;color:var(--muted)}
.qb{width:100%;border-collapse:collapse;table-layout:fixed}
.qb th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px 4px;border-bottom:1px solid var(--rule)}
.qb td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:13.5px;line-height:1.5}
.qb tr:last-child td{border-bottom:0}
.qb .qq{font-family:var(--song);font-size:15px}
.qb .qc{display:block;font-family:var(--sans);font-size:11.5px;color:var(--rule-strong)}
.qb td.old{color:#4d4d48;background:#f6f6f2}
.qb td.new{font-family:var(--song);font-size:14.5px}
.qb td.fresh{animation:ink .7s ease-out}
.grade{display:inline-block;margin-top:3px;font-size:11.5px;padding:0 6px;border-radius:2px;white-space:nowrap}
.gr-ok{color:#5e5e58;border:1px solid #cfcfc8}
.gr-none{color:#5e5e58;background:#e3e3dd}
.gr-lag,.gr-off{color:#7a4f0c;background:#f6e3bd}
.gr-wrong{color:var(--page);background:var(--seal)}
td.old.g-wrong{background:#fbeceb}
.hist{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.hc{width:11px;height:11px;border:1px solid transparent}
.hc.ok{background:#dcdcd4}
.hc.none{background:#a9a9a1}
.hc.lag,.hc.off{background:#e3b25a}
.hc.wrong{background:var(--seal)}
.hc.na{border-color:#dcdcd4}
.hc.cur{outline:1.5px solid var(--ink);outline-offset:1px}

/* 结算 */
.final{max-width:1400px;margin:22px auto 0;padding:0 28px}
.final:empty{display:none}
.fin{background:var(--page);border:1px solid var(--ink);padding:18px 22px 22px}
.fin h2{font-family:var(--song);font-weight:600;font-size:22px;margin:0 0 4px}
.fin .lead{font-family:var(--song);font-size:16px;color:#3a3a36;margin:0 0 14px;max-width:52em}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.fin-block h3{font-family:var(--song);font-size:16px;font-weight:600;margin:6px 0 2px}
.fin-block .cap{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.fin-wide{grid-column:1/-1}
.rib{display:grid;grid-template-columns:200px 1fr 180px;gap:6px 12px;align-items:center;font-size:13px}
.rib .bar{position:relative;height:14px;background:#dcdcd4}
.rib .bar i{position:absolute;top:0;bottom:0}
.rib .bar i.none{background:#a9a9a1}.rib .bar i.lag,.rib .bar i.off{background:#e3b25a}.rib .bar i.wrong{background:var(--seal)}
.rib .axis{grid-column:2;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.rib .axis span{white-space:nowrap}
.rib .sum{font-size:12px;color:#4d4d48}
.lagt{width:100%;border-collapse:collapse;font-size:13px}
.lagt td,.lagt th{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.lagt th{font-weight:500;color:var(--muted);font-size:12px}
.lagt td.w{width:42%}
.lbar{position:relative;height:12px}
.lbar i{position:absolute;left:0;top:0;bottom:0;background:#6d6d66}
.lbar i.never{background:repeating-linear-gradient(45deg,var(--seal) 0 4px,#f1c9c5 4px 8px);right:0}
.lticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tbar{display:flex;height:22px;border:1px solid var(--ink);margin:3px 0 2px}
.tbar i{display:block;height:100%;border-right:1px solid var(--page);font-style:normal;font-size:11px;color:var(--page);white-space:nowrap;overflow:hidden;padding-left:4px;line-height:20px}
.tl-row{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.tl-row .v{font-family:var(--song);text-align:right}
.seg-scr{background:#8c8c85}.seg-ent{background:#6d6d66}.seg-app{background:#4d4d48}.seg-out{background:#b0a07a}.seg-jud{background:var(--seal)}.seg-sig{background:var(--agent)}
.keys{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--muted);margin-top:4px}
.keys i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.fin .settle{margin:0;border:0;padding:0;background:none}
.fin .settle .h{display:none}
.coda{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.coda p{font-family:var(--song);font-size:17px;line-height:1.7;margin:0 0 6px;max-width:48em}

/* 账簿原文 */
.ledger{max-width:1400px;margin:22px auto 0;padding:0 28px 30px}
.ledger-toggle{width:100%;text-align:left;border:1px solid var(--ink);background:var(--page);padding:10px 14px;font-family:var(--song);font-size:15px}
.ledger-toggle[aria-expanded="true"]{background:var(--ink);color:var(--page)}
.ledger-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 10px}
.ledger-head p{margin:0;font-size:13px;color:var(--muted)}
.ledger .book{padding:0;max-width:none}
.ledger #stream{max-height:72vh;overflow:auto}
.ledger .page-right{max-height:80vh}

@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .scene-card{position:static;max-height:none}
  .fin-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:16px 14px 4px}
  .hero .sub{grid-column:1}
  .hero .thesis{font-size:18px}
  .tl,.main,.final,.ledger{padding-left:14px;padding-right:14px}
  .panes{grid-template-columns:1fr}
  .qb col.hcol,.qb th.hcol,.qb td.hcol{display:none}
  .rib{grid-template-columns:1fr}
  .rib .axis{grid-column:1}
}

.ev-d summary{cursor:pointer;margin-bottom:4px}
.ev-d[open] summary{margin-bottom:2px}
@media (max-width:1100px) and (min-width:761px){
  .decide .opts{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .hero{padding-top:14px}
}
@media (max-width:760px){
  .pane-new{overflow-x:auto}
  #graph{min-width:470px}
  .pane-new .legend,.pane-new .now{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  .g-edge.draw,.g-edge.pulse,.g-need,.g-seal.fresh,.g-lease.lit,.chip.fresh,.qb td.fresh,.decide.fresh{animation:none}
  .g-edge.draw{stroke-dashoffset:0}
}

.xlink{margin-left:8px;color:var(--rule-strong);text-decoration:underline dotted;white-space:nowrap}
@media (max-width:760px){#play{display:none}}
</style>
</head>
<body>
<header class="hero">
  <h1>恒测加急单</h1>
  <p class="thesis">一个系统是什么，取决于它能回答什么问题，以及什么时候能回答。</p>
  <p class="sub">同一个世界，两台相机。左边是旧 ERP 拍到的，右边是新账拍到的。一家做压力传感器的公司接到一张提前二十天的订单，你替老周、老陈、小林和小赵做决定，下面五个问题会在每一步同时去问两个系统。<a class="xlink" href="next-erp-rnd-scenario.html">研发部的版本：小记的一个赌注</a></p>
</header>
<nav class="tl" id="tl" aria-label="时间轴"><div class="tl-in"></div></nav>
<div class="main">
  <aside class="scene-card" id="scene" aria-live="polite"></aside>
  <section class="stage">
    <div class="viewing" id="viewing"></div>
    <div class="panes">
      <figure class="pane pane-old">
        <figcaption><b>旧 ERP 看见的</b><span>被录进表单的单据。系统外的事，它看不见</span></figcaption>
        <div class="erp" id="erp"></div>
        <div class="now" id="now-old"></div>
      </figure>
      <figure class="pane pane-new">
        <figcaption><b>新账看见的</b><span>一张图：谁欠谁，谁在判断，agent 回程到谁</span></figcaption>
        <svg id="graph" viewBox="0 0 520 356" role="img" aria-label="责任图"></svg>
        <div class="legend"><span><i></i>承诺</span><span><i class="pend"></i>待签收</span><span><i class="hang"></i>悬空</span><span><i class="late"></i>逾期</span><span><i class="done"></i>核销</span><span><i class="lease"></i>租约，agent 回程到人</span></div>
        <div class="now" id="now-new"></div>
      </figure>
    </div>
    <div class="qboard" id="qboard"></div>
  </section>
</div>
<section class="final" id="final"></section>
<section class="ledger">
  <button class="ledger-toggle" id="ledgerToggle" aria-expanded="false">账簿原文：逐条事件、五本账的明细、旧 ERP 的每张单据</button>
  <div id="ledgerBody" hidden>
    <div class="ledger-head"><p>上面的每一个格子，都是从这里的事件流算出来的。</p><div class="modeswitch" id="modeswitch"><button data-mode="new" class="on">新账</button><button data-mode="old">旧 ERP</button></div></div>
    <div class="book" id="book">
      <section class="page page-left" id="leftpage">
        <div class="page-head"><span id="lefthead">一张图，企业的事件流</span><span class="clock" id="clock"></span></div>
        <div id="stream"></div>
      </section>
      <section class="page page-right">
        <div class="tabs" id="tabs"></div>
        <div class="tab-def" id="tabdef"></div>
        <div id="proj"></div>
      </section>
    </div>
  </div>
</section>
<footer class="controls"><div class="inner">
  <button id="reset">重来</button>
  <div class="status" id="status"></div>
  <button id="play">自动播放</button>
  <button id="ff">快进到下一个判断</button>
  <button id="next" class="primary">下一步</button>
</div></footer>
<script>

/* ---------- 基础 ---------- */
const F=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('zh-CN');
const H=(name,role)=>({name,role,kind:'human'});
const AG=name=>({name,kind:'agent'});
const XH=(name,role)=>({name,role,kind:'ext'});
const XA=(name,role)=>({name,role,kind:'xagent'});
const SYS={name:'系统',kind:'sys'};
let _id=0; const E=o=>({id:'e'+(++_id),...o});
const dnum=t=>{const m=t.match(/^(\d+)\/(\d+)/);return m?(+m[1])*100+(+m[2]):0;};

const LEASES={
  '销售 agent':{by:'老周',scope:'读订单、库存、产能，拟回复',budget:'无支出权',until:'12 月 31 日'},
  '采购 agent':{by:'小林',scope:'询价、下单、催料',budget:'单笔不超过 10 万',until:'10 月 31 日'},
};
const PEOPLE={'老周':{role:'销售总监',cap:4,base:2},'小林':{role:'采购经理',cap:5,base:5},'老陈':{role:'厂长',cap:3,base:1}};
const PRIOR_FILE={'老周':[{cat:'为续签牺牲单笔毛利',n:3,hit:2},{cat:'保毛利放弃增量',n:2,hit:1},{cat:'主动告知延期',n:4,hit:4}]};
const CAT={J1A:'为续签牺牲单笔毛利',J1B:'为续签牺牲单笔毛利',J1C:'保毛利放弃增量',J4:'主动告知延期'};

const LEDE={
  new:'旧 ERP 记这四周发生了什么。新 ERP 记这四周谁答应了什么、谁赌了什么、最后谁对。一家做压力传感器的公司，一张提前二十天的订单，你替老周、老陈、小林和小赵做决定，看五本账怎么从同一条事件流里长出来。',
  old:'同一条事件流，投到旧 ERP 上。旧 ERP 只能看见被人录进表单的事，看见得晚，记的是结果不记理由。左页是它能看见的单据，和它看不见的那些；右页是它的五个模块。你做的判断不变，账不一样。',
};
const DEFS={
  graph:['一张图','企业的全部活动落成一条事件流。右边每一页都是它的投影，每走一步整体重算。'],
  need:['计划对象','旧 MRP 把订单炸成物料需求。这里把订单炸成判断需求：哪些决定只能由人做，排在谁的判断带宽上。执行不排期。'],
  judg:['判断账','每个判断在做出的那一刻立账：赌什么、预期什么信号、何时回看。到期自己回来对账，形成判断力档案。'],
  pledge:['承诺账','谁欠谁一个交付。承诺时确认义务，回执三门过完才核销。权责发生制用在工作上。'],
  money:['钱账','法定的第一本账，降级为投影。没有人录凭证，每个数字点回证据，证据点回一个人的判断。'],
  law:['恒等式','任何 agent 的行动链，末端必须是一个能担责的人。agent 只在租约下行动；责任不能委派，只能移交并签收。'],
};
const OLD={
  graph:{title:'五个模块',def:'事件不进系统，单据才进。销售、计划、采购、生产、财务各记各的，模块之间靠人对。',tab:null},
  need:{title:'物料需求',def:'MRP 每晚 02:00 跑一次，把订单炸成缺料清单。它排物料，不排判断。',tab:'mrp'},
  judg:{title:'没有这本账',def:'判断发生在群聊和电话里。系统只留下结果单据，理由靠记忆。',tab:'judg'},

/* ---------- 状态与推进 ---------- */
let state,timer=null;
function init(){
  _id=0;stopPlay();
  state={played:[],events:[],decisions:{},pending:null,cursor:0,sel:null,mode:'new',tab:'need',oldTab:'sales',follow:true,fresh:new Set(),changed:new Set(),done:false,view:null};
  const evs=playScene(SCENES[0]);applyFocus(SCENES[0].focus,evs);
  render();
}
function tabsOf(e){const s=[];if(e.type==='need'||e.type==='need_update')s.push('need');if(['pledge','pledge_update','receipt'].includes(e.type))s.push('pledge');if(e.type==='judgment'||e.type==='judgment_update')s.push('judg');if(e.money)s.push('money');if(e.actor.kind==='agent'||e.type==='handoff'||e.type==='return')s.push('law');return s;}
function markChanged(evs){state.changed=new Set();for(const e of evs)for(const t of tabsOf(e))state.changed.add(t);}
function applyFocus(f,evs){
  if(!state.follow)return;
  if(state.mode==='new'){if(f)state.tab=f;return;}
  const firstDoc=(evs||[]).flatMap(e=>oldOf(e,state.decisions)).find(r=>r.kind!=='ghost');
  const map={need:'mrp',judg:'judg',pledge:'sales',money:'fin',law:'flow'};
  state.oldTab=firstDoc?firstDoc.module:(map[f]||state.oldTab);
}
function playScene(sc){
  const evs=sc.events?sc.events(state.decisions):[];
  state.fresh=new Set(evs.map(e=>e.id));
  state.events.push(...evs);
  state.played.push({scene:sc,events:evs,resolved:[]});
  if(sc.prompt)state.pending=sc;
  markChanged(evs);
  return evs;
}
function nextIndex(){let i=state.cursor+1;while(i<SCENES.length&&SCENES[i].when&&!SCENES[i].when(state.decisions))i++;return i;}
function advance(opts={}){
  if(state.view!=null){state.view=null;if(!opts.silent){render();return true;}}
  if(state.pending||state.done)return false;
  const i=nextIndex();
  if(i>=SCENES.length){state.done=true;state.fresh=new Set();state.changed=new Set();stopPlay();if(!opts.silent){render();revealFinal();}return false;}
  state.cursor=i;const evs=playScene(SCENES[i]);applyFocus(SCENES[i].focus,evs);
  if(state.pending)stopPlay();
  if(!opts.silent){render();bookScroll();}
  return true;
}
function resolve(key){
  const sc=state.pending;if(!sc||state.view!=null)return;
  const evs=sc.prompt.resolve(key,state.decisions);
  state.fresh=new Set(evs.map(e=>e.id));
  state.events.push(...evs);
  state.played[state.played.length-1].resolved=evs;
  state.pending=null;markChanged(evs);applyFocus(sc.prompt.focus,evs);
  render();bookScroll();
}
function fastForward(){
  stopPlay();state.view=null;
  if(state.pending||state.done){render();return;}
  const start=state.events.length;
  while(!state.pending&&!state.done){if(!advance({silent:true}))break;}
  const evs=state.events.slice(start);
  state.fresh=new Set(evs.map(e=>e.id));markChanged(evs);
  render();bookScroll();if(state.done)revealFinal();
}
function startPlay(){
  if(timer||state.done)return;
  state.view=null;
  if(state.pending){render();focusDecision();return;}
  timer=setInterval(()=>{if(state.pending||state.done){stopPlay();render();if(state.pending)focusDecision();return;}advance();},2600);
  advance();renderControls();
}
function stopPlay(){if(timer){clearInterval(timer);timer=null;}}
function bookScroll(){const el=document.getElementById('stream');if(el&&!$('#ledgerBody').hidden)el.scrollTop=el.scrollHeight;}
function clockNum(){return dnum(SCENES[state.cursor].t);}
function viewAt(k){stopPlay();state.view=(k>=state.played.length-1)?null:k;render();}

function build(events){
  const pledges=new Map(),needs=new Map(),judg=new Map(),money=[],holders={},agents=[],handoffs=[];
  for(const e of events){
    e.refs=[];
    if(e.actor.kind==='agent'){e.responsible=holders[e.actor.name]||LEASES[e.actor.name].by;agents.push(e);}
    switch(e.type){
      case 'pledge':pledges.set(e.pledge.id,{...e.pledge,status:e.pledge.status||'立账',gates:{done:false,accept:false,clear:false},hist:[],ev:e.id});e.refs.push(e.pledge.id);break;
      case 'pledge_update':{const p=pledges.get(e.pid);if(p){Object.assign(p,e.patch||{});if(e.gates)Object.assign(p.gates,e.gates);if(e.note)p.hist.push({t:e.t,note:e.note,ev:e.id});}e.refs.push(e.pid);break;}
      case 'need':for(const n of e.need){needs.set(n.id,{...n,status:n.status||'待判',ev:e.id});e.refs.push(n.id);}break;
      case 'need_update':for(const u of e.nu){const n=needs.get(u.id);if(n){n.status=u.status;if(u.pick)n.pick=u.pick;}e.refs.push(u.id);}break;
      case 'judgment':judg.set(e.j.id,{...e.j,who:e.actor.name,t:e.t,status:'待回看',ev:e.id});e.refs.push(e.j.id);break;
      case 'judgment_update':{const j=judg.get(e.jid);if(j){j.status=e.status;j.result=e.note;j.rev=e.id;}e.refs.push(e.jid);break;}
      case 'handoff':handoffs.push(e);if(!e.pending&&!e.declined)holders[e.lease]=e.to;break;
    }
    if(e.money)for(const m of e.money){money.push({...m,ev:e.id,t:e.t});e.refs.push(m.id);}
  }
  return {pledges,needs,judg,money,holders,agents,handoffs};
}
function marginPct(events){const {money}=build(events);return pctOf(money);}
function pctOf(money){const rev=money.filter(m=>m.amount>0).reduce((a,m)=>a+m.amount,0);const gp=money.reduce((a,m)=>a+m.amount,0);return (gp/rev*100).toFixed(1)+'%';}

function renderERP(C){
  const d=state.decisions,O=buildOld(C.evs,d,C.day),P=build(C.evs);
  const docs=O.recs.filter(r=>r.kind!=='ghost');
  const byM=m=>docs.filter(r=>(r.module===m)||(m==='mrp'&&r.module==='flow'&&/采购/.test(r.title))||(m==='prod'&&r.module==='flow'&&/加班|外协/.test(r.title))||(m==='fin'&&r.module==='flow'&&/违约金/.test(r.title)));
  const li=r=>`<li class="${C.fresh.has(r.ev.id)?'fresh':''} ${r.kind==='lag'&&!r.visible?'wait':''}" title="${esc(r.detail||'')}">${esc(r.title)}${r.kind==='lag'&&!r.visible?`，要等 ${esc(r.lagLabel||'')}`:''}</li>`;
  const tail=(arr,n)=>arr.slice(-n).map(li).join('');
  const ship=p=>p.gates.clear?'已发货':p.gates.done==='half'?'部分发货':'未发货';
  const freshP=id=>[...C.fresh].some(fid=>{const e=C.evs.find(x=>x.id===fid);return e&&e.refs&&e.refs.includes(id);});
  const fld=(label,val,id,note)=>`<div class="fld ${id&&freshP(id)?'flash':''}"><span>${label} <b>${esc(val)}</b></span>${note?`<span class="calm">${note}</span>`:''}</div>`;
  const hangs=new Set([...P.pledges.values()].filter(p=>['悬空','待签收'].includes(p.status)).map(p=>p.id));
  let sales='';
  if(P.pledges.has('P0')){const p=P.pledges.get('P0');sales+=fld('A 单交期',`${shortWhen(p.when)}，${ship(p)}`,'P0',hangs.has('P0')?'无提醒':'');}
  if(P.pledges.has('PB')){const p=P.pledges.get('PB');sales+=fld('B 单交期',`${shortWhen(p.when)}，${ship(p)}`,'PB',hangs.has('PB')?'无提醒':'');}
  let mrp='';const runs=O.runs.filter(r=>C.day>=r.day);
  if(P.pledges.has('P1')){const p=P.pledges.get('P1');mrp+=fld('PO 芯片',`4,500，${shortWhen(p.when)}，${p.gates.clear?'已收货':p.gates.done==='half'?'部分收货':'未收货'}`,'P1',hangs.has('P1')?'无提醒':'');}
  if(runs.length)mrp+=fld('MRP',runs[runs.length-1].result.slice(0,14),null,'');
  let prod='';if(P.pledges.has('P3')){const p=P.pledges.get('P3');prod+=fld('工单',`4,500，${shortWhen(p.when)}，${p.gates.clear?'完工':'下达'}`,'P3','');}
  const fin=O.closed?fld('本月凭证',`${O.vouchers.length} 张，毛利 ${pctOf(O.vouchers)}`,null,'月结后'):`<div class="empty">月结之前，这张单的实际成本在这里是空的。</div>`;
  const mod=(name,m,fields,extra='')=>{const ds=byM(m);return `<section class="mod"><h4>${name}<span>${ds.length} 张</span></h4>${fields}${extra}<ul class="mdocs">${tail(ds,fields?2:3)}</ul></section>`;};
  const ghosts=O.recs.filter(r=>r.kind==='ghost');const freshG=ghosts.filter(r=>C.fresh.has(r.ev.id));
  const shortWhy=r=>r.why.split('。')[0];

  $('#erp').innerHTML=`<div class="erp-sys"><span class="erp-tag">系统内</span><div class="mods">${mod('销售','sales',sales)}${mod('计划采购','mrp',mrp)}${mod('生产','prod',prod)}${mod('财务','fin','',fin)}</div>
    <div class="erp-sign"><span>审批签字 ${approvals} 人次</span><span>对结果负责的人 <b>0</b></span></div></div>
    <div class="erp-out"><span class="erp-tag">系统外：微信、电话、邮件、群聊、人脑</span><div class="chips">${freshG.map(r=>`<span class="chip fresh">${esc(shortWhy(r))}</span>`).join('')}${ghosts.length-freshG.length>0?`<span class="chip-n">${freshG.length?'此前还有':'累计'} ${ghosts.length-freshG.length} 件发生在系统外</span>`:freshG.length?'':'<span class="chip-n">还没有</span>'}</div></div>`;
}

/* 新账：责任图 */
const GN={A:{x:52,y:78,label:'A 客户'},B:{x:52,y:262,label:'B 客户'},sup:{x:484,y:262,label:'供应商'},
  zhou:{x:190,y:150,name:'老周',role:'销售总监'},chen:{x:340,y:78,name:'老陈',role:'厂长'},lin:{x:345,y:238,name:'小林',role:'采购经理'},succ:{x:262,y:296,role:'接手人'},
  sa:{x:190,y:258,label:'销售 agent'},pa:{x:420,y:160,label:'采购 agent'}};
const GR={A:26,B:26,sup:26,zhou:17,chen:17,lin:17,succ:17,sa:13,pa:13};
const EDGES={P0:['zhou','A'],PB:['zhou','B'],P3:['chen','zhou'],P1:['pa','chen'],P2:['sup','pa']};
const ECLS={'立账':'ok','已改签':'ok','待签收':'pending','悬空':'hang','逾期':'late','已核销':'done'};
function seg(a,b){const A=GN[a],B=GN[b];const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);const ra=GR[a]+2,rb=GR[b]+7;return {x1:A.x+dx/L*ra,y1:A.y+dy/L*ra,x2:B.x-dx/L*rb,y2:B.y-dy/L*rb,mx:(A.x+B.x)/2,my:(A.y+B.y)/2,nx:-dy/L,ny:dx/L};}
function renderGraph(C){
  const P=build(C.evs);const fresh=C.fresh;
  const freshEvs=C.evs.filter(e=>fresh.has(e.id));
  const holder=P.holders['采购 agent']||'小林';const ph=pendingHandoff(C.evs);
  const succName=holder!=='小林'?holder:(ph?ph.to:null);
  let s=`<defs>${['ink','warn','seal','done'].map(c=>`<marker id="ar-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c==='ink'?'#1e1e1c':c==='warn'?'#b3781c':c==='seal'?'#b4322b':'#b9b9b1'}"/></marker>`).join('')}</defs>`;
  s+=`<rect class="g-bound" x="128" y="30" width="330" height="318" rx="10"/><text class="g-blabel" x="140" y="48">恒测</text>`;
  /* 租约线 */
  const leaseTo={sa:'zhou',pa:holder==='小林'?'lin':'succ'};
  const acted=n=>freshEvs.some(e=>e.actor.kind==='agent'&&e.actor.name===GN[n].label);
  for(const a of ['sa','pa']){const g=seg(a,leaseTo[a]);s+=`<line class="g-lease ${acted(a)?'lit':''}" x1="${g.x1}" y1="${g.y1}" x2="${g.x2+(GN[leaseTo[a]].x-GN[a].x)/Math.hypot(GN[leaseTo[a]].x-GN[a].x,GN[leaseTo[a]].y-GN[a].y)*5}" y2="${g.y2+(GN[leaseTo[a]].y-GN[a].y)/Math.hypot(GN[leaseTo[a]].x-GN[a].x,GN[leaseTo[a]].y-GN[a].y)*5}"><title>${GN[a].label}的租约归${a==='sa'?'老周':holder}。它做的每件事都回程到这个人。</title></line>`;}
  if(ph&&holder==='小林'){const g=seg('pa','succ');s+=`<line class="g-lease" style="stroke:var(--warn);opacity:.9" x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}"/><text class="g-lease-t" style="fill:var(--warn)" x="${(GN.pa.x+GN.succ.x)/2+8}" y="${(GN.pa.y+GN.succ.y)/2+14}">移交中</text>`;}
  /* 承诺边 */
  let i=0;
  for(const [id,[a,b]] of Object.entries(EDGES)){
    const p=P.pledges.get(id);if(!p)continue;
    const cls=ECLS[p.status]||'ok';const g=seg(a,b);
    const created=freshEvs.some(e=>e.type==='pledge'&&e.pledge.id===id);
    const changed=!created&&freshEvs.some(e=>e.type==='pledge_update'&&e.pid===id);
    const mk=cls==='hang'?'warn':cls==='late'?'seal':cls==='done'?'done':'ink';
    const delay=(i++)*0.25;
    s+=`<line class="g-edge ${cls} ${created?'draw':''} ${changed&&(cls==='hang'||cls==='late')?'pulse':''}" style="animation-delay:${delay}s" x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}" marker-end="url(#ar-${mk})"><title>${esc(p.who)} 欠 ${esc(p.to)}：${esc(p.what)}，${esc(p.when)}。${esc(p.status)}${p.hist.length?'。'+p.hist.map(h=>h.note).join('；'):''}</title></line>`;
    const tt={PB:.62}[id]||.5;const A0=GN[a],B0=GN[b];const lx=A0.x+(B0.x-A0.x)*tt+g.nx*11,ly=A0.y+(B0.y-A0.y)*tt+g.ny*11+4;
    s+=`<text class="g-elabel ${cls}" x="${lx}" y="${ly}">${esc(shortWhat(p.what))} ${esc(shortWhen(p.when))}${cls==='hang'?' 悬空':cls==='late'?' 逾期':cls==='done'?' 核销':cls==='pending'?' 待签收':''}</text>`;
  }
  /* 传导：上游一晃，客户那条跟着黄 */
  const cascade=freshEvs.some(e=>e.type==='pledge_update'&&e.pid==='P0'&&e.patch&&e.patch.status==='悬空')&&P.pledges.has('P2');
  if(cascade){const pts=['sup','pa','chen','zhou','A'].map(n=>`${GN[n].x},${GN[n].y}`);const dpath='M'+pts.join(' L');
    s+=`<path class="g-flow" d="${dpath}"/><circle class="g-dot" r="6"><animateMotion dur="2.2s" repeatCount="2" path="${dpath}"/></circle>`;}
  /* 外部方 */
  for(const n of ['A','B','sup']){const N=GN[n];const used=Object.entries(EDGES).some(([id,[a,b]])=>(a===n||b===n)&&P.pledges.has(id));
    s+=`<g class="g-ext" opacity="${used?1:.45}"><rect x="${N.x-32}" y="${N.y-15}" width="64" height="30" rx="3"/><text x="${N.x}" y="${N.y+1}">${N.label}</text></g>`;}
  /* agent */
  for(const n of ['sa','pa']){const N=GN[n];s+=`<g class="g-agent"><circle cx="${N.x}" cy="${N.y}" r="${GR[n]}"/><text x="${N.x}" y="${N.y+GR[n]+13}">${N.label}</text></g>`;}
  /* 人 */
  const pendNeeds=[...P.needs.values()].filter(x=>x.status==='待判');
  const people=[['zhou','老周'],['chen','老陈'],['lin','小林']];if(succName)people.push(['succ',succName]);
  for(const [n,name] of people){
    const N=GN[n];const dim=n==='lin'&&(holder!=='小林'||ph);const ghostNode=n==='succ'&&holder==='小林';
    const need=pendNeeds.filter(x=>x.who===name);
    const js=[...P.judg.values()].filter(j=>j.who===name);
    s+=`<g class="g-hum ${dim?'dim':''} ${ghostNode?'ghost':''}">`;
    if(need.length)s+=`<circle class="g-need" cx="${N.x}" cy="${N.y}" r="20"/><text class="g-needt" x="${N.x-GR[n]-9}" y="${N.y+4}" text-anchor="end">待判 ${need.map(x=>x.id).join(' ')}</text>`;
    s+=`<circle class="body" cx="${N.x}" cy="${N.y}" r="${GR[n]}"><title>${name}${need.length?'，待判 '+need.map(x=>x.id).join('、'):''}</title></circle>`;
    const up=n==='chen';const ny=up?N.y-GR[n]-8:N.y+GR[n]+15,ry=up?N.y-GR[n]-27:N.y+GR[n]+30;
    s+=`<text class="g-name" x="${N.x}" y="${ny}">${name}${dim?'（休假）':''}</text><text class="g-role" x="${N.x}" y="${ry}">${n==='succ'?(ghostNode?'等签收':'接手采购租约'):N.role}</text>`;
    js.forEach((j,ix)=>{const cx=N.x+GR[n]+10+ix*15,cy=N.y-GR[n]+2;const c=j.status==='印证'?'hit':j.status==='推翻'?'miss':j.status==='未推翻'?'gray':'wait';
      const isFresh=freshEvs.some(e=>(e.type==='judgment'&&e.j.id===j.id)||(e.type==='judgment_update'&&e.jid===j.id));
      s+=`<circle class="g-seal ${c} ${isFresh?'fresh':''}" cx="${cx}" cy="${cy}" r="6"><title>${j.id}，${name}，${j.t}：赌${j.bet}。${j.status}${j.result?'，'+j.result:''}</title></circle><text class="g-sealt" x="${cx}" y="${cy-9}" text-anchor="middle">${j.id}</text>`;});
    s+=`</g>`;
  }
  $('#graph').innerHTML=s;
}

/* 五问 */
function renderQB(C){
  const d=state.decisions;
  const now=answers(C.evs,d,C.day);
  const prevAns=C.k>0?answers(prefixOf(C.k-1),d,Math.max(dnum(state.played[C.k-1].scene.t),...[...state.played[C.k-1].events,...state.played[C.k-1].resolved].map(e=>dnum(e.t)),0)):null;
  const hist=[];for(let k=0;k<=C.k;k++){const b=state.played[k];const day=Math.max(dnum(b.scene.t),...[...b.events,...b.resolved].map(e=>dnum(e.t)),0);hist.push({t:b.scene.t,a:answers(prefixOf(k),d,day)});}
  const wrongNow=now.filter(a=>a.g==='wrong').length,cant=now.filter(a=>['none','off','lag'].includes(a.g)).length;
  let html=`<div class="qb-h"><b>同一刻，问两个系统五个问题</b><span>此刻旧 ERP：答不了或答偏 ${cant} 个，答错 ${wrongNow} 个。新账每个都答得上，因为它就是按这五个问题记的账。</span></div>
  <table class="qb"><colgroup><col style="width:23%"><col style="width:29%"><col style="width:31%"><col class="hcol" style="width:17%"></colgroup>
  <thead><tr><th>问系统</th><th>旧 ERP 答</th><th>新账答</th><th class="hcol">旧 ERP 一路答得怎样</th></tr></thead><tbody>`;
  now.forEach((a,i)=>{
    const ch=prevAns&&(prevAns[i].nw!==a.nw);const cho=prevAns&&(prevAns[i].old!==a.old||prevAns[i].g!==a.g);
    html+=`<tr><td><span class="qc">${QUESTIONS[i].c}</span><span class="qq">${QUESTIONS[i].q}</span></td>
      <td class="old g-${a.g} ${cho?'fresh':''}">${esc(a.old)}${a.g!=='na'?`<br><span class="grade gr-${a.g}">${GRADE[a.g]}${a.why?'：'+esc(a.why):''}</span>`:''}</td>
      <td class="new ${ch?'fresh':''}">${esc(a.nw)}</td>
      <td class="hcol"><div class="hist">${hist.map((h,k)=>`<span class="hc ${h.a[i].g} ${k===C.k?'cur':''}" title="${dayOf(h.t)}：${GRADE[h.a[i].g]||'还没开始'}"></span>`).join('')}</div></td></tr>`;
  });
  html+=`</tbody></table>`;
  $('#qboard').innerHTML=html;
}


/* ---------- 结算：把整条事件流按真实时间过一遍 ---------- */
const fmtDur=m=>m<60?`${Math.round(m)} 分钟`:m<1440?`${(m/60).toFixed(1).replace(/\.0$/,'')} 小时`:`${(m/1440).toFixed(1).replace(/\.0$/,'')} 天`;
const dnumOfMin=x=>{const dt=new Date(x*60000);return (dt.getMonth()+1)*100+dt.getDate();};
function sortedEvents(){return state.events.map((e,i)=>({e,i})).sort((a,b)=>tmin(a.e.t)-tmin(b.e.t)||a.i-b.i).map(x=>x.e);}
const T0=()=>tmin('8/20 10:00'),T1=()=>tmin('12/20 09:00');
function integrate(){
  const d=state.decisions,evs=sortedEvents(),start=T0(),end=T1();
  const pts=[...new Set(evs.map(e=>tmin(e.t)))].filter(t=>t<end).sort((a,b)=>a-b);
  const segs=QUESTIONS.map(()=>[]),sum=QUESTIONS.map(()=>({ok:0,none:0,lag:0,off:0,wrong:0,na:0}));
  pts.forEach((t,ix)=>{
    const t2=ix+1<pts.length?pts[ix+1]:end;if(t2<=t)return;
    const a=answers(evs.filter(e=>tmin(e.t)<=t),d,dnumOfMin(t));
    a.forEach((x,q)=>{sum[q][x.g]+=t2-t;const s=segs[q];if(s.length&&s[s.length-1].g===x.g&&s[s.length-1].to===t)s[s.length-1].to=t2;else s.push({from:t,to:t2,g:x.g});});
  });
  return {segs,sum,start,end};
}
function lagFacts(){
  const d=state.decisions,evs=sortedEvents();const f=p=>evs.find(p);const T=e=>e?tmin(e.t):null;const rows=[];
  const ask=f(e=>e.type==='msg'&&e.actor.name==='王工'&&/提前/.test(e.text));
  const chg=f(e=>e.type==='pledge_update'&&e.pid==='P0'&&e.patch&&e.patch.when);
  rows.push({k:'客户要把交期提前',w:T(ask),o:T(chg),oh:chg?'订单变更单录入':'这件事从没进系统'});
  const sh=f(e=>e.type==='fact'&&e.actor.name==='销售 agent');
  rows.push({k:'缺 4,500 颗芯片',w:T(sh),o:d.J1==='A'?tmin('9/16 02:00'):null,oh:d.J1==='A'?'夜里 MRP':'订单没照这个改，MRP 不会算'});
  const nd=f(e=>e.type==='need');
  rows.push({k:'有三件事在等人拍板',w:T(nd),o:null,oh:'ERP 不排判断'});
  const risk=f(e=>e.type==='pledge_update'&&['P0','PB'].includes(e.pid)&&e.patch&&e.patch.status==='悬空');
  if(risk){const after=evs.find(e=>e!==risk&&tmin(e.t)>=tmin(risk.t)&&e.pid===risk.pid&&oldOf(e,d).some(r=>r.kind!=='ghost'&&/变更|逾期/.test(r.title)));
    const how=after?(oldOf(after,d).some(r=>/逾期/.test(r.title))?'逾期报表，如果有人去跑':'老周拍板之后录的变更单'):'对方的拒绝在邮件里';
    rows.push({k:risk.pid==='P0'?'A 单 10 月 10 日交不齐':'B 客户不同意改期',w:T(risk),o:T(after),oh:how});}
  const s3=f(e=>e.type==='receipt'&&e.qty===3000&&e.actor.name==='供应商 agent');
  if(s3)rows.push({k:'芯片只到了 3,000 颗',w:T(s3),o:T(s3),oh:'收货单当场录入'});
  const cost=f(e=>e.money&&e.money.some(m=>!['M0','M1','M5'].includes(m.id)&&m.amount<0));
  if(cost)rows.push({k:'这张单的毛利掉下来了',w:T(cost),o:T(f(e=>e.close)),oh:'月结'});
  const sign=f(e=>e.type==='handoff'&&!e.pending&&!e.declined);
  if(sign)rows.push({k:`芯片这条线归了${sign.to}`,w:T(sign),o:null,oh:'交接在微信里'});
  const rev=f(e=>e.type==='judgment_update'&&e.jid==='J1');
  if(rev)rows.push({k:'老周九月那个决定，是对是错',w:T(rev),o:null,oh:'年底复盘靠记忆'});
  return rows;
}
function humanTime(){
  const d=state.decisions,O=buildOld(state.events,d,9999);
  const J=state.events.filter(e=>e.type==='judgment').length;
  const signs=state.events.filter(e=>e.type==='handoff'&&!e.pending).length;
  const out=O.recs.filter(r=>r.kind==='ghost'&&!['judgment','judgment_update','need'].includes(r.ev.type)).length;
  return {old:[['scr','翻屏查询',O.stats.screens*2],['ent','录入',O.stats.entries*5],['app','审批签字',O.stats.approvals*10],['out','系统外沟通',out*15],['jud','判断',J*30]],
          nw:[['jud','判断',J*10],['sig','签收移交',signs*2]],J,signs,out,O};
}
function renderFinal(){
  const C=ctx();
  if(!(state.done&&C.live)){$('#final').innerHTML='';return;}
  const I=integrate(),span=I.end-I.start;
  const pos=t=>((t-I.start)/span*100).toFixed(2);
  const ticks=[['8/20 10:00','8 月 20 日'],['9/15 09:12','9 月 15 日'],['10/10 09:00','10 月 10 日'],['10/31 18:00','10 月 31 日'],['12/20 09:00','12 月 20 日']];
  let rib=`<div class="rib">`;
  QUESTIONS.forEach((q,i)=>{const s=I.sum[i];const bad=s.none+s.lag+s.off;
    rib+=`<span>${q.q}</span><span class="bar">${I.segs[i].filter(x=>!['ok','na'].includes(x.g)).map(x=>`<i class="${x.g}" style="left:${pos(x.from)}%;width:${Math.max(.35,(x.to-x.from)/span*100).toFixed(2)}%" title="${GRADE[x.g]}：${fmtDur(x.to-x.from)}"></i>`).join('')}</span>
      <span class="sum">${bad?`答不上 ${fmtDur(bad)}`:''}${bad&&s.wrong?'；':''}${s.wrong?`<b style="color:var(--seal)">答错 ${fmtDur(s.wrong)}</b>`:''}${!bad&&!s.wrong?'一直相符':''}</span>`;});
  rib+=`<span class="axis" style="position:relative;display:block;height:16px">${ticks.map(([t,l])=>`<span style="position:absolute;left:${pos(tmin(t))}%;transform:translateX(${t.startsWith('8/')?'0':t.startsWith('12/')?'-100%':'-50%'})">${l}</span>`).join('')}</span></div>`;
  rib+=`<div class="keys"><span><i style="background:#dcdcd4"></i>相符</span><span><i style="background:#a9a9a1"></i>答不了</span><span><i style="background:#e3b25a"></i>滞后或答非所问</span><span><i style="background:var(--seal)"></i>与事实不符</span></div>`;
  const L=lagFacts();const lp=l=>l<=0?0:Math.min(1,Math.max(.03,(Math.log10(l)-1)/(Math.log10(86400)-1)));
  let lag=`<table class="lagt"><tr><th>这件事</th><th>新账</th><th>旧 ERP</th><th class="w">旧 ERP 晚了多久，对数刻度</th></tr>`;
  L.forEach(r=>{const l=r.o==null?null:r.o-r.w;
    lag+=`<tr><td>${r.k}</td><td>当场</td><td>${l==null?'<b style="color:var(--seal)">永不</b>':l<=0?'同时':'晚 '+fmtDur(l)}<div class="sub">${r.oh}</div></td><td class="w"><div class="lbar">${l==null?'<i class="never"></i>':l>0?`<i style="width:${(lp(l)*100).toFixed(1)}%"></i>`:''}</div></td></tr>`;});
  lag+=`<tr><td></td><td></td><td></td><td class="w"><div class="lticks"><span>10 分钟</span><span>1 小时</span><span>1 天</span><span>1 周</span><span>2 月</span></div></td></tr></table>`;
  const H=humanTime();const tot=a=>a.reduce((s,x)=>s+x[2],0);const max=Math.max(tot(H.old),tot(H.nw));
  const bar=a=>`<div class="tbar" style="width:${(tot(a)/max*100).toFixed(1)}%">${a.filter(x=>x[2]>0).map(x=>`<i class="seg-${x[0]}" style="width:${(x[2]/tot(a)*100).toFixed(1)}%" title="${x[1]}：${fmtDur(x[2])}">${x[1]}</i>`).join('')}</div>`;
  const time=`<div class="tl-row"><span>旧 ERP</span>${bar(H.old)}<span class="v">约 ${fmtDur(tot(H.old))}</span></div><div class="tl-row"><span>新账</span>${bar(H.nw)}<span class="v">约 ${fmtDur(tot(H.nw))}</span></div>
    <p class="cap" style="margin-top:8px">估算，规则摆在这里，可以不同意：翻一屏 2 分钟，录一张单 5 分钟，签一次字 10 分钟，一件系统外的沟通 15 分钟，一个判断自己翻证据 30 分钟、证据已取景 10 分钟，一次签收 2 分钟。判断的次数两边一样多，都是 ${H.J} 次。</p>`;
  const never=L.filter(r=>r.o==null).length;const wrongQ=I.sum.filter(s=>s.wrong>0).length;
  $('#final').innerHTML=`<div class="fin"><h2>走完了，把两台相机拍到的东西摊开</h2><p class="lead">下面的每个数，都是把左右两边同一条事件流，按真实时间从 8 月 20 日过到 12 月 20 日算出来的。换一条路线重来，数会变。</p>
    <div class="fin-grid">
      <div class="fin-block fin-wide"><h3>五个问题，旧 ERP 在这四个月里答得怎样</h3><p class="cap">一行一个问题，横轴是真实时间。灰的是答不了，黄的是晚了或答偏了，红的是答了但与事实不符。新账这五行从头到尾都答得上，所以不画。</p>${rib}</div>
      <div class="fin-block"><h3>同一件事，两边各自什么时候知道</h3><p class="cap">新账每一行都是当场，因为事件一进图就被记进它该在的那本账。</p>${lag}</div>
      <div class="fin-block"><h3>人的时间花在哪</h3><p class="cap">判断没有变少，变少的是判断之外的东西。</p>${time}<h3 style="margin-top:16px">数字对照</h3>${renderSettle()}</div>
    </div>
    <div class="coda">
      <p>旧 ERP 记的是过去时：发生了什么。新账记的是将来时和虚拟语气：谁欠谁什么，谁赌了什么，最后谁对。</p>
      <p>所以这不是一个更快的旧系统。同一个世界里，有 ${never} 件事旧 ERP 永远不会知道，有 ${wrongQ} 个问题它在某些时刻答错了，而且没有人会发现。</p>
      <p>人的时间从翻屏、录入和签字挪到了判断上。执行交给 agent，每一条执行的末端都写着一个人的名字。这就是把计划对象从物料换成判断的意思。</p>
    </div></div>`;
}
function revealFinal(){renderFinal();const f=$('#final');if(f.firstChild)setTimeout(()=>f.scrollIntoView({behavior:'smooth',block:'start'}),150);}

/* ---------- 控件 ---------- */
function renderControls(){
  const n=$('#next'),ff=$('#ff'),pl=$('#play');n.classList.remove('go');
  const C=ctx();
  pl.textContent=timer?'暂停':'自动播放';pl.disabled=state.done&&C.live;
  if(!C.live){n.disabled=false;n.textContent='往后看一步';ff.disabled=false;ff.textContent='回到此刻';}
  else if(state.done){n.disabled=true;n.textContent='已到 12 月 20 日';ff.disabled=true;ff.textContent='快进到下一个判断';}
  else if(state.pending){n.disabled=false;n.classList.add('go');n.textContent=`去做${state.pending.prompt.who}的${state.pending.prompt.kind==='judgment'?'判断':'动作'}`;ff.disabled=true;ff.textContent='快进到下一个判断';}
  else{n.disabled=false;const i=nextIndex();n.textContent=i<SCENES.length?`下一步，${SCENES[i].t.replace(/^(\d+)\/(\d+)\s*/,(m,a,b)=>`${a} 月 ${b} 日 `)}`:'结算';ff.disabled=false;ff.textContent='快进到下一个判断';}
  $('#status').innerHTML=`第 <b>${C.k}</b> 步${C.live?'':'，回看中'}。<span class="hint">方向键左右逐步前后看，Shift 加右快进到下一个判断。</span>`;
}

/* ---------- 账簿原文：沿用逐条账页 ---------- */
function renderBook(){
  renderFinal();
  if($('#ledgerBody').hidden)return;
  $('#book').classList.toggle('mode-old',state.mode==='old');
  const P=build(state.events);const O=state.mode==='old'?buildOld(state.events,state.decisions,clockNum()):null;
  $('#lefthead').textContent=state.mode==='old'?'单据流，旧 ERP 看得见的和看不见的':'一张图，企业的事件流';
  $('#modeswitch').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.mode===state.mode);b.onclick=()=>switchMode(b.dataset.mode);});
  if(state.mode==='old'){renderOldStream(O);renderOldTabs(O);renderOldProj(O);}else{renderStream(P);renderTabs(P);renderProj(P);}
}
function bookPromptNote(sc){return `<div class="scene"><p class="narr" style="color:var(--seal)">等${sc.prompt.who}拍板。取景框在页面上方的场景卡里。</p></div>`;}
function openLedger(){const b=$('#ledgerBody');if(b.hidden){b.hidden=false;$('#ledgerToggle').setAttribute('aria-expanded','true');}}
function jumpTo(id){openLedger();state.sel=id;state.fresh=new Set();render();const el=document.querySelector(`#stream [data-id="${id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}

$('#ledgerToggle').onclick=()=>{const b=$('#ledgerBody');b.hidden=!b.hidden;$('#ledgerToggle').setAttribute('aria-expanded',String(!b.hidden));render();if(!b.hidden)bookScroll();};
$('#next').onclick=()=>{const C=ctx();if(!C.live){viewAt(C.k+1);return;}if(state.pending){focusDecision();return;}stopPlay();advance();};
$('#ff').onclick=()=>{if(state.view!=null){viewAt(99);return;}fastForward();};
$('#play').onclick=()=>{if(timer){stopPlay();renderControls();}else startPlay();};
$('#reset').onclick=()=>{const m=state.mode;init();state.mode=m;render();window.scrollTo({top:0,behavior:'smooth'});};
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'&&e.shiftKey){e.preventDefault();$('#ff').click();}
  else if(e.key==='ArrowRight'){e.preventDefault();$('#next').click();}
  else if(e.key==='ArrowLeft'){e.preventDefault();const C=ctx();if(C.k>0)viewAt(C.k-1);}
});
init();

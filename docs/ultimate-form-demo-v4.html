      seg = '重点客户移动端诉求访谈 3 场';
      toast(`私下登记：听众 = 你与${ex}——任务内容你来说（选中段是示例）；发送即登记（登记必有呼吸）`);
    } else {
      openSession(placeKey);
      setVoice('pub', { silent: true });
      input.value = `@云小助 登记承诺：重点客户移动端诉求访谈 3 场，${ex}负责，下周五前。`;
      seg = '重点客户移动端诉求访谈 3 场';
      /* v4.24 最小听众不变量：执行者不在所选场所 = 听众集合不完整（demo 事实：张三不在产品讨论群） */
      toast(ex === '张三'
        ? '⚠ 张三不在产品讨论群——登记消息他听不见（最小听众不变量：承诺边听众 ≥ {你, 张三}）。可拉他进群/改选 DM；照发则系统 DM 补递登记指针（修边非越境）'
        : `公开登记：听众 = 全群（施压与透明）——任务内容你来说（选中段是示例），发送即登记并上板`);
    }
    state.delegCtx = { goal: gid, goalTitle, executor: ex, place: placeKey };
    state.chips = [`目标：${goalTitle} · 语境继承`];
    renderChips(); updateVoiceHint();
    focusSelect(input, seg);
    input.dispatchEvent(new Event('input'));
    return;
  }
  /* v4.9 入口A②：拆解提案——确认即代发登记话语（幽灵承诺禁令） */
  const gdc = e.target.closest('[data-goaldecomp]');
  if (gdc) {
    const dgid = gdc.dataset.goaldecomp;
    if (state.decompGoal === dgid) { state.decompGoal = null; state.decompPhase = null; renderTimeline(); return; }
    state.decompGoal = dgid; state.delegGoal = null; state.evalGoal = null;
    /* v4.19+ 交互时序：拆解 = 对目标说「帮我拆」的一次 agent 任务——先备料，提案才有依据 */
    state.decompPhase = 'working';
    renderTimeline();
    toast('拆解开始：agent 备料中（读真身成功标准 · 盘点现有承诺防重复）——CTA 只是话语的按钮形态');
    setTimeout(() => {
      if (state.decompGoal !== dgid) return;
      state.decompPhase = 'ready';
      renderTimeline();
      toast('拆解提案就绪：挂起态即图数据（重启可恢复）· DM 兜底已推送同一对象（先答先赢）——每条过你的手');
    }, 1500);
    return;
  }
  const dc = e.target.closest('[data-dc]');
  if (dc) {
    const [i, act] = dc.dataset.dc.split(':');
    const d = activeDecomp()[+i];
    if (!d || (d.decision && d.decision !== 'hold')) return;
    d.decision = act;
    if (act === 'hold') {
      renderTimeline();
      toast('已挂起——挂起不阻塞但绝不静默丢失：挂在父承诺处亮相，重提时跨轮存续');
      return;
    }
    if (act === 'ok') {
      COMMITS.push({ name: d.desc, exec: d.exec, who: d.who, due: d.due, goal: state.decompGoal || 'g1', linked: '拆解提案 · 人签发', state: '已登记' });
      /* 落库即代发：登记话语落到执行者在场的通道——出生本身就是一次呼吸 */
      const target = d.who === '张三' ? 'zhangsan' : 'prodgroup';
      sessions[target].timeline.push(
        { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: true,
          text: `<span class="at">@云小助</span> 登记承诺：${d.desc}，${d.who} 负责，${d.due}——挂「Q3 产品竞争力提升」目标（拆解提案确认 · 代发）` },
        { type: 'agent-pub', time: nowStr(), kind: 'ack',
          text: `已登记承诺：${d.desc} · 执行者 <b>${d.who}</b> · ${d.due} · 已挂目标（拆解提案 · 人签发）。${d.exec === 'agent' ? '我来执行，完成后回帖验收。' : '我会盯进度——观察与提醒，不代做。'}` });
      toast(`落库即代发：登记话语已发到 ${d.channel}——没有静默登记（幽灵承诺禁令）`);
    } else {
      toast('已驳回——提案止于提案，未落库未代发');
    }
    renderTimeline();
    return;
  }
  /* v4.8 目标出生入口①：AI 速记纪要 → 提案裁决 */
  const gp = e.target.closest('[data-gp]');
  if (gp) {
    const [gpid, act] = gp.dataset.gp.split(':');
    const item = sessions.prodgroup.timeline.find(i => i.type === 'goalprop' && i.id === gpid);
    if (!item || item.state) return;
    item.state = act;
    if (act === 'ok') {
      const gid = 'g' + (++goalSeq);
      GOALS[gid] = { title: item.title, home: '云之家 ·《Q3 目标 · 产品组》表 · 新行',
        born: `生于 8/20 产品晨会 · AI 速记纪要 → 提案裁决 · Bruce 确认落库（人签发）` };
      toast('目标已落库：AI 速记纪要 → 提案 → 人签发 → 真身落云之家（出生主产地 · 入口①）');
    } else {
      toast('提案已驳回：agent 不可作者目标，提案止于提案');
    }
    renderTimeline();
    return;
  }
  /* v4.20 交付推断裁决：确认 = 以执行者名义回流登记场所（回程律）；驳回 = 可纠，图不记错账 */
  const dlv = e.target.closest('[data-dlv]');
  if (dlv) {
    const [dvid, act] = dlv.dataset.dlv.split(':');
    const item = sessions.prodgroup.timeline.find(i => i.type === 'dlvinfer' && i.id === dvid);
    if (!item || item.state) return;
    item.state = act;
    if (act === 'ok') {
      const c = COMMITS.find(x => x.name === item.commit);
      c.nosignal = false; c.overdue = false; c.state = '待验收';
      c.receipt = '行为回执 · 返修数据分析.pdf（交付推断 · 张锐确认 · 刚刚）'; c.prod = [item.file];
      /* v4.21 验收卡家族延伸适用人类交付回执：回执确认即在登记场所生成验收对象——终态自此可达 */
      appendItems('prodgroup', [{ type: 'accept', id: 'ac-fanxiu', state: 'pending', commit: item.commit }]);
      toast('回执已回流登记场所：登记的听众看到出生，也看到交付（回程律）——验收卡已出（就在下方），承诺板/目标页同步「待验收」');
    } else {
      toast('已标注不是交付：保守推断亮出可纠，宁空勿错——承诺保持「无信号」，不记错账');
    }
    renderTimeline(); renderHead(); renderSidebar();
    return;
  }
  const chev = e.target.closest('[data-chev]');
  if (chev) {
    state.collapsed[chev.dataset.chev] = !state.collapsed[chev.dataset.chev];
    if (chev.dataset.chev.startsWith('board:')) renderTimeline(); else renderSidebar();
    return;
  }
  const item = e.target.closest('[data-sess]');
  if (item) {
    const fromSess = sessions[state.current];
    if (fromSess && fromSess.kind === 'groupview' && e.target.closest('.topiccard, .tc-peek')) {
      state.navStack.push({ scroll: timelineEl.scrollTop, from: state.current });
    } else {
      state.navStack = [];
    }
    openSession(item.dataset.sess);
    return;
  }

  const cc = e.target.closest('[data-cc]');
  if (cc) { handleCardAction(cc.dataset.cc, cc.dataset.act); return; }

  const ac = e.target.closest('[data-accept]');
  if (ac) { handleAccept(ac.dataset.accept); return; }

  const goto = e.target.closest('[data-goto]');
  if (goto) {
    const target = Object.keys(sessions).find(k => sessions[k].status === goto.dataset.goto);
    if (target) openSession(target);
    return;
  }

  const ref = e.target.closest('[data-ref]');
  if (ref) {
    if (!state.chips.includes(ref.dataset.ref)) state.chips.push(ref.dataset.ref);
    renderChips();
    toast('已加入引用 chip —— 发送时作为上下文喂给 Agent');
    $('input').focus();
    return;
  }
  const chipX = e.target.closest('[data-chip]');
  if (chipX) { state.chips.splice(+chipX.dataset.chip, 1); renderChips(); return; }

  const pback = e.target.closest('[data-pback]');
  if (pback) { state.preview = null; renderRight(); return; }
  const extopen = e.target.closest('[data-extopen]');
  if (extopen) { toast('真实实现：在云之家中打开该对象'); return; }
  const ressub = e.target.closest('[data-ressub]');
  if (ressub) { state.resSub = ressub.dataset.ressub; state.preview = null; renderRight(); return; }
  const restype = e.target.closest('[data-restype]');
  if (restype) { state.resType = restype.dataset.restype; renderRight(); return; }
  const evp = e.target.closest('[data-evprep]');
  if (evp) {
    const [k, place] = evp.dataset.evprep.split(':');
    state.evPrepChoose = null;
    if (place === 'x') { renderRight(); return; }
    const pev = EVENTS[k];
    openSession(place);
    if (!$('voicePub').disabled) setVoice('pub', { silent: true });
    const pchip = `${pev.title}（日程 · 生成边）`;
    if (!state.chips.includes(pchip)) state.chips.push(pchip);
    renderChips();
    const pin2 = $('input');
    pin2.value = `@云小助 为「${pev.title}」准备：`;
    pin2.dispatchEvent(new Event('input'));
    pin2.focus(); pin2.setSelectionRange(pin2.value.length, pin2.value.length);
    toast('场所已由你选定（听众人选不推导）——首个准备任务落地后，会议转入有关联态、就绪度激活（生成边诞生）');
    return;
  }
  const evd = e.target.closest('[data-evdelegate]');
  if (evd) {
    /* v4.18+ 「为此会准备」= 传送门：跳到关联任务的话题说话（事件语境随行——生成边 + 语境继承挂接）；
       旧实现就地预填，在承诺板等无落点视图点击即死 */
    const ev = EVENTS[evd.dataset.evdelegate];
    /* v4.19 双语义：无关联任务 = 发起准备任务（生成边诞生）——无天然语境，场所人选不推导 */
    if (!ev.linkedSession) {
      state.resTab = 'cur';
      state.preview = evd.dataset.evdelegate;
      state.evPrepChoose = evd.dataset.evdelegate;
      renderRight();
      toast('无关联任务的会议：准备 = 生成边的诞生——落点必须由你选（听众人选不推导）');
      return;
    }
    if (state.current !== ev.linkedSession) openSession(ev.linkedSession);
    if (!$('voicePub').disabled) setVoice('pub', { silent: true });
    const chip = `${ev.title}（日程 · 生成边）`;
    if (!state.chips.includes(chip)) state.chips.push(chip);
    renderChips();
    const input = $('input');
    input.value = `@云小助 为「${ev.title}」准备：`;
    input.dispatchEvent(new Event('input'));
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    toast('传送门：跳到关联任务的话题说话——事件语境随行（生成边：日程→任务 · 语境继承挂接），交付后枢纽就绪度自动翻绿');
    return;
  }
  const evh = e.target.closest('[data-evhub]');
  if (evh) {
    state.resTab = 'cur';
    state.preview = evh.dataset.evhub;
    renderRight();
    toast('日程锚 chip 是门（信号即门）：右栏打开事件枢纽——关联任务 · 材料就绪度 · 为此会准备');
    return;
  }
  const pv = e.target.closest('[data-preview]');
  if (pv) { state.preview = pv.dataset.preview; renderRight(); return; }

  const memDel = e.target.closest('[data-mem]');
  if (memDel) {
    const sess = sessions[state.current];
    MEM[sess.placeKey].filter(m => !m.deleted)[+memDel.dataset.mem].deleted = true;
    renderRight();
    toast('记忆已删除 —— 纠正通道是一等功能：错误记忆比没有记忆更伤信任');
    return;
  }

  const art = e.target.closest('[data-artifact]');
  if (art) {
    const k = art.dataset.pv;
    if (k) {
      state.resTab = 'cur'; state.preview = k;
      document.querySelectorAll('.res-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'cur'));
      renderRight();
      toast('右栏就地预览（只读）—— 验收不出屏');
    } else toast('真实实现：在云之家中打开该对象');
    return;
  }

  const tab = e.target.closest('.res-tab');
  if (tab) {
    state.resTab = tab.dataset.tab;
    state.preview = null;
    document.querySelectorAll('.res-tab').forEach(t => t.classList.toggle('active', t === tab));
    renderRight();
    return;
  }
});

$('voicePri').addEventListener('click', () => !$('voicePri').disabled && setVoice('pri'));
$('voicePub').addEventListener('click', () => !$('voicePub').disabled && setVoice('pub'));
$('input').addEventListener('input', updateVoiceHint);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'goalTitleInput') { e.preventDefault(); document.querySelector('[data-goalconfirm]').click(); }
  if (e.key === 'Escape' && !$('fpvFull').hidden) { $('fpvFull').hidden = true; $('fpvFull').innerHTML = ''; }
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
$('send').addEventListener('click', handleSend);
$('askBtn').addEventListener('click', () => {
  if ($('askBtn').disabled) return;
  state.ask = !state.ask;
  syncAskUI();
  $('input').focus();
});

$('annotateToggle').addEventListener('click', () => {
  const on = document.body.classList.toggle('annotate');
  $('annotateToggle').setAttribute('aria-pressed', on);
  if (!on) $('popover').classList.remove('show');
});
$('hintClose').addEventListener('click', () => {
  $('hintbar').remove();
  document.body.classList.add('no-hint');
});
$('popClose').addEventListener('click', () => $('popover').classList.remove('show'));
$('floatball').addEventListener('click', () => {
  const confirmKey = Object.keys(sessions).find(k => sessions[k].status === 'confirm');
  const reviewKey = Object.keys(sessions).find(k => sessions[k].status === 'review');
  const target = confirmKey || reviewKey;
  if (target) { openSession(target); toast('悬浮球 = 注意力汇总：优先跳到最需要你的会话'); }
});

/* ---------- 启动 ---------- */
renderSidebar(); renderHead(); renderTimeline(); renderRight(); refreshVoiceAvail();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云之家 × DSH · 终极形态 v4.1 —— 图的居民补全</title>
<style>
/* ============================================================
   终极形态 v4 · 桌面端完整价值沙盘（六剧本压测后修订）
   图的四类居民：会话（交互）· 工件（产物）· 承诺（工作）· 流程（复利）
   新增：承诺板取景框、轻问（F-read 一次性投影）、裁决卡、授权租约
   ============================================================ */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --ink: #20242C;
  --ink-2: #5A6272;
  --ink-3: #8B93A3;
  --line: #E2E5EA;

  --pub: #2E63D9;
  --pub-deep: #1E4FBD;
  --pub-tint: #EEF4FF;
  --pub-line: #C9DBFA;
  --pub-rail: #D8E5FB;

  --paper: #FAF6EC;
  --paper-line: #E9DFC8;
  --paper-rail: #EFE6D0;
  --paper-ink: #6B5A36;

  --amber: #B45309;
  --amber-bg: #FDF1E0;
  --amber-line: #F0D9B4;
  --green: #15803D;
  --green-bg: #E8F6EE;
  --green-line: #C4E6D1;
  --red: #B91C1C;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(24,30,42,.05), 0 4px 16px rgba(24,30,42,.06);
  --shadow-pop: 0 6px 32px rgba(24,30,42,.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--bg);
}
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--pub); outline-offset: 2px; border-radius: 4px; }

/* ---------- 顶栏 ---------- */
.topbar {
  height: 46px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px;
  background: #171B22; color: #E8EAEF;
}
.wordmark { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
.wordmark em { font-style: normal; color: #7FA7F5; }
.topbar .crumb { font-size: 12.5px; color: #9AA3B5; }
.topbar .crumb b { color: #D5DAE4; font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar a.xlink {
  font-size: 11.5px; color: #9AA3B5; text-decoration: none;
  padding: 4px 9px; border: 1px solid #333B48; border-radius: 8px;
}
.topbar a.xlink:hover { color: #E8EEFF; border-color: #3E5AA6; }
.annotate-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #C4CAD6;
  padding: 5px 10px; border-radius: 8px;
  border: 1px solid #333B48;
  transition: background .15s, border-color .15s;
}
.annotate-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: #4A5364; transition: background .15s; }
body.annotate .annotate-toggle { background: #24304A; border-color: #3E5AA6; color: #E8EEFF; }
body.annotate .annotate-toggle .dot { background: #7FA7F5; }
.top-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #46536B, #2B3345);
  color: #DFE5F0; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- 引导条 ---------- */
.hintbar {
  height: 34px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  font-size: 12.5px; color: var(--ink-2);
  background: #F7F8FA;
  border-bottom: 1px solid var(--line);
}
.hintbar .k {
  font-size: 11.5px; padding: 2px 8px; border-radius: 20px;
  background: #EDF1F6; border: 1px solid var(--line); color: var(--ink-2);
}
.hintbar .close { margin-left: auto; color: var(--ink-3); font-size: 15px; padding: 2px 6px; }
.hintbar .close:hover { color: var(--ink); }

/* ---------- 三栏布局 ---------- */
.app {
  display: grid;
  grid-template-columns: 272px minmax(520px, 1fr) 296px;
  grid-template-rows: minmax(0, 1fr);
  height: calc(100vh - 80px);
}
body.no-hint .app { height: calc(100vh - 46px); }

/* ---------- 侧栏：统一收件箱 ---------- */
.sidebar {
  background: #F3F4F6;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.side-head {
  padding: 14px 14px 8px;
  display: flex; align-items: baseline; gap: 8px;
  position: relative;
}
.side-head h2 { font-size: 13px; font-weight: 700; }
.side-head .sub { font-size: 11px; color: var(--ink-3); }
.triage { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
.triage-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
  border: 1px solid transparent;
  transition: transform .12s;
}
.triage-chip:hover { transform: translateY(-1px); }
.triage-chip .n { font-weight: 700; }
.triage-chip.t-confirm { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
.triage-chip.t-review  { background: var(--green-bg); color: var(--green); border-color: var(--green-line); }
.triage-chip.t-running { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); }
.triage-chip[data-zero="1"] { opacity: .38; filter: grayscale(.4); }
.tree { padding: 2px 8px 20px; }
.tree-group {
  margin-top: 10px;
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  padding: 0 8px 4px; letter-spacing: .04em;
  display: flex; align-items: center; gap: 6px;
}
.tree-group .gline { flex: 1; height: 1px; background: var(--line); }
/* v4.7 侧栏节点词汇：节点是行，标签是字——场所行=一等行，话题=缩进子行，灰字+线专属纯分组 */
.item.place { margin-top: 10px; }
.item.place .t1 { font-weight: 750; }
.item.sub { margin-left: 26px; width: calc(100% - 26px); position: relative; }
.item.sub::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: #DCE1E9; }
/* 披露列：行首左缘垂直对齐成一列（Finder/VS Code/Notion 同位）——披露列管折叠，行体做本职
   chrome 收敛：SVG 细笔画箭头；场所/标签行 hover 现身、收起态常显（状态不能藏）；分栏头常显 */
.chev {
  flex: none; width: 18px; height: 26px; display: grid; place-items: center;
  margin-left: -3px; border-radius: 5px;
  color: #9AA3B2; cursor: pointer;
  transition: transform .16s cubic-bezier(.2,.7,.3,1), opacity .12s, background .12s, color .12s;
}
.chev svg { display: block; }
.chev:hover { background: rgba(70,83,107,.10); color: var(--ink); }
.chev.closed { transform: rotate(-90deg); }
.item.place .chev, button.tree-group .chev { opacity: 0; }
.item.place:hover .chev, button.tree-group:hover .chev,
.item.place .chev.closed, button.tree-group .chev.closed { opacity: 1; }
/* 收起组内含当前会话：场所行左缘细示位线（不外露子行，位置不丢） */
.item.place.holds { box-shadow: inset 2.5px 0 0 var(--pub); }
/* 顶层大分栏：通道轴一级投影（云之家 vs 本地）——纯排版表达，比组内标签高一档 */
.tree-sec {
  width: 100%; display: flex; align-items: center; gap: 4px;
  margin: 20px 0 4px; padding: 8px 6px 4px;
  border-top: 1px solid var(--line);
  font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--ink-2);
  cursor: pointer; text-align: left;
  transition: color .12s;
}
.tree-sec:hover { color: var(--ink); }
.tree-sec:first-child { border-top: none; margin-top: 6px; }
.tree-sec .hint { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); }
.tree-sec .chev { width: 16px; height: 18px; margin-left: -4px; }
button.tree-group { width: 100%; cursor: pointer; }
button.tree-group:hover { color: var(--ink-2); }
button.tree-group .chev { width: 16px; height: 18px; margin-left: -4px; }
.item {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 9px; border-radius: 8px;
  text-align: left; position: relative;
  transition: background .12s;
}
.item:hover { background: #E9EBEF; }
.item.active { background: #FFFFFF; box-shadow: var(--shadow); }
.item .ic {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
}
.item .tcol { flex: 1; min-width: 0; }
.item .t1 { font-size: 12.8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t2 { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.badge { flex: none; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.badge.b-confirm { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }
.badge.b-review  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.badge.b-running { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); display: inline-flex; align-items: center; gap: 4px; }
.badge.b-unread  { background: #E5E8ED; color: var(--ink-2); }
.badge.b-done    { background: #E5E8ED; color: var(--ink-3); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--pub); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(.75);} }

/* ---------- 中栏：融合时间线 ---------- */
.main { display: flex; flex-direction: column; background: var(--surface); min-width: 0; min-height: 0; }
.sess-head { padding: 12px 20px 10px; border-bottom: 1px solid var(--line); position: relative; }
.sess-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sess-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; padding: 2.5px 8px; border-radius: 6px;
  background: #F1F3F6; color: var(--ink-2); border: 1px solid var(--line);
}
.chip.mono { font-size: 10.5px; }
.chip.agent-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: #1D2432; color: #DCE4F5; border-color: #1D2432;
}
.chip.agent-chip .pulse { background: #7FA7F5; }
.chip.agent-chip.off { background: #F1F3F6; color: var(--ink-3); border-color: var(--line); }
.timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0 18px; scroll-behavior: smooth; position: relative; }
@media (prefers-reduced-motion: reduce) {
  .timeline { scroll-behavior: auto; }
  .pulse { animation: none; }
  .msg.enter { animation: none !important; }
}
.divider { display: flex; align-items: center; gap: 10px; padding: 8px 20px; font-size: 11px; color: var(--ink-3); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider.unread { color: var(--red); font-weight: 600; }
.divider.unread::before, .divider.unread::after { background: #F3CBCB; }
.msg { display: grid; grid-template-columns: 40px 1fr; gap: 0 10px; padding: 5px 20px 5px 14px; position: relative; }
.msg.enter { animation: slidein .28s ease; }
@keyframes slidein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
.rail { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 3px; }
.rail-tag {
  font-size: 10px; font-weight: 700; line-height: 1;
  padding: 3.5px 6px; border-radius: 5px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.msg--pub .rail-tag { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); }
.msg--pri .rail-tag { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); }
.rail .rline { flex: 1; width: 2px; border-radius: 2px; }
.msg--pub .rline { background: var(--pub-rail); }
.msg--pri .rline { background: var(--paper-rail); }
.mbody { min-width: 0; max-width: 720px; position: relative; }
.mhead { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.avatar {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
}
.mhead .name { font-size: 12.5px; font-weight: 650; }
.mhead .name .state { color: var(--pub); font-weight: 600; }
.mhead .meta { font-size: 10.5px; color: var(--ink-3); }
.bubble {
  border-radius: var(--radius);
  padding: 9px 12px; line-height: 1.65;
  border: 1px solid var(--line); background: var(--surface);
  width: fit-content; max-width: 100%;
}
.msg--pub .bubble { border-color: var(--pub-line); background: #FDFEFF; }
.msg--pub.mine .bubble { background: var(--pub-tint); }
.msg--pri .bubble { background: var(--paper); border-color: var(--paper-line); }
.bubble.pause { border-left: 3px solid var(--amber); }
.mfoot { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
.msg--pri .mfoot { color: #A08D5F; }
.at { color: var(--pub); font-weight: 650; background: rgba(46,99,217,.09); padding: 0 3px; border-radius: 4px; }
.sysline { padding: 4px 20px 4px 64px; font-size: 11.5px; color: var(--ink-3); }
.sysline .inner {
  display: inline-flex; align-items: center; gap: 6px;
  background: #F6F7F9; border: 1px dashed var(--line);
  border-radius: 8px; padding: 5px 10px;
}

/* 私有工作块 */
.workblock {
  border-radius: var(--radius); border: 1px solid var(--paper-line); background: var(--paper);
  overflow: hidden; max-width: 100%; width: fit-content; min-width: 320px;
}
.workblock summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; font-size: 12px; color: var(--paper-ink); font-weight: 600;
}
.workblock summary::-webkit-details-marker { display: none; }
.workblock summary .tw { transition: transform .15s; font-size: 10px; }
.workblock[open] summary .tw { transform: rotate(90deg); }
.wsteps { padding: 2px 12px 10px 30px; display: flex; flex-direction: column; gap: 5px; }
.wstep { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 7px; align-items: baseline; }
.wstep .st { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; flex: none; width: 14px; }
.wstep.done .st { color: var(--green); }
.wstep.run .st { color: var(--pub); }
.wstep.wait .st { color: var(--amber); }
.wstep .tool { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--ink-3); background: #F2EDDF; padding: 1px 5px; border-radius: 4px; }
.wstep.mem .tool { background: #E3ECFB; color: var(--pub-deep); }

/* 审批对象卡 */
.confirm-card {
  border-radius: 12px;
  border: 1px solid var(--amber-line); border-top: 3px solid var(--amber);
  background: #FFFDF8;
  box-shadow: var(--shadow);
  max-width: 560px; overflow: hidden;
  transition: border-color .3s;
}
.confirm-card.approved { border-color: var(--green-line); border-top-color: var(--green); background: #FCFFFD; }
.cc-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px 9px; }
.cc-domain {
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
  padding: 2.5px 7px; border-radius: 5px;
  background: var(--amber-bg); color: var(--amber);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.confirm-card.approved .cc-domain { background: var(--green-bg); color: var(--green); }
.cc-title { font-size: 13px; font-weight: 700; flex: 1; }
.cc-risk { font-size: 10.5px; color: var(--amber); background: var(--amber-bg); padding: 2px 7px; border-radius: 20px; border: 1px solid var(--amber-line); }
.cc-fields { padding: 0 14px 10px; display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 12px; }
.cc-fields .k { color: var(--ink-3); }
.cc-fields .v b { font-weight: 650; }
.cc-proj {
  margin: 0 14px 10px; padding: 7px 10px;
  border: 1px dashed var(--line); border-radius: 8px;
  font-size: 11px; color: var(--ink-2); line-height: 1.6;
  background: #FAFBFC;
}
.cc-proj .pj { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--pub-deep); background: #E3ECFB; padding: 1px 5px; border-radius: 4px; }
.cc-actions { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #F4EBDB; }
.confirm-card.approved .cc-actions { border-top-color: #E2F2E8; }
.btn {
  font-size: 12.5px; font-weight: 600;
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff; color: var(--ink-2);
  transition: transform .1s, box-shadow .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.cc-done-note { display: flex; align-items: center; gap: 7px; padding: 10px 14px 12px; font-size: 12.5px; color: var(--green); font-weight: 600; }

/* 工件卡 */
.artifact {
  display: flex; align-items: center; gap: 12px;
  border-radius: 12px;
  border: 1px solid var(--pub-line);
  background: linear-gradient(160deg, #FDFEFF, #F4F8FF);
  padding: 12px 14px; max-width: 480px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .12s, box-shadow .15s;
}
.artifact:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(46,99,217,.15); }
.af-icon {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  background: var(--pub); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.af-body { flex: 1; min-width: 0; }
.af-t { font-size: 13px; font-weight: 700; }
.af-m { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.af-arrow { color: var(--pub); font-size: 15px; }

/* 验收条 */
.acceptbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border: 1px solid var(--green-line); border-radius: 12px;
  background: linear-gradient(160deg, #FDFFFE, #F1FAF4);
  padding: 10px 14px; max-width: 560px;
  box-shadow: var(--shadow);
  position: relative;
}
.acceptbar .lab { font-size: 12.5px; font-weight: 650; color: var(--green); }
.acceptbar .note { font-size: 10.5px; color: var(--ink-3); }
.acceptbar.done-state { border-color: var(--line); background: #F7F8FA; }
.acceptbar.done-state .lab { color: var(--ink-3); }

/* 冷会话空态 */
.coldhint {
  margin: 14px 20px 6px 64px; max-width: 560px;
  border: 1px dashed #C9CFDA; border-radius: 12px;
  background: #FAFBFC; padding: 14px 16px;
  font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
  position: relative;
}
.coldhint b { color: var(--ink); }

/* ---------- 话题卡（群视图内联） ---------- */
.topiccard {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-left: 3px solid #C9D4E8;
  border-radius: 12px; background: #FBFCFE;
  padding: 10px 13px; max-width: 480px;
  cursor: pointer; box-shadow: var(--shadow);
  transition: transform .12s, box-shadow .15s;
  position: relative;
}
.topiccard:hover { transform: translateY(-2px); box-shadow: 0 4px 18px rgba(24,30,42,.12); }
.topiccard.hot { border-left-color: var(--pub); background: linear-gradient(160deg, #FDFEFF, #F6F9FF); }
.tc-ic { font-size: 16px; flex: none; }
.tc-body { flex: 1; min-width: 0; }
.tc-t { font-size: 13px; font-weight: 700; }
.tc-m { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.tc-arrow { color: var(--ink-3); font-size: 15px; flex: none; }
.crumb-btn { color: var(--ink-3); font-weight: 600; font-size: 15px; padding: 0; }
.crumb-btn:hover { color: var(--pub); text-decoration: underline; }
.crumb-sep { color: var(--ink-3); font-weight: 400; }

/* ---------- Agent 场所合同面板 ---------- */
.apanel-mask {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(23,27,34,.35);
  display: none; align-items: center; justify-content: center;
}
.apanel-mask.show { display: flex; }
.apanel {
  width: 580px; max-height: 84vh; overflow-y: auto;
  background: #fff; border-radius: 16px;
  box-shadow: var(--shadow-pop);
  position: relative;
  animation: popin .18s ease;
}
.ap-head {
  display: flex; align-items: center; gap: 11px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.ap-ava {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  background: #171B22; color: #fff; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.ap-title { font-size: 15px; font-weight: 750; }
.ap-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.ap-close { margin-left: auto; font-size: 17px; color: var(--ink-3); padding: 4px 8px; }
.ap-close:hover { color: var(--ink); }
.ap-sec { padding: 12px 18px 2px; }
.ap-sec-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 750; padding-bottom: 7px; }
.ap-badge { font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.ap-badge.hard { background: #FBEAEA; color: #B91C1C; border: 1px solid #F0CACA; }
.ap-badge.soft { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.ap-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 0; font-size: 12.5px;
  border-bottom: 1px dashed #F0F2F5;
}
.ap-row .k { color: var(--ink-3); width: 100px; flex: none; }
.ap-row .v { flex: 1; }
.ap-inherit {
  font-size: 9.5px; color: var(--ink-3);
  background: #F1F3F6; border: 1px solid var(--line);
  padding: 1px 6px; border-radius: 20px; flex: none;
}
.ap-inherit.ovr { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); }
.ap-note { font-size: 10.5px; color: var(--ink-3); padding: 7px 0 10px; line-height: 1.65; }
.ap-actions { padding: 8px 18px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ap-trace { font-size: 12px; color: var(--pub); font-weight: 650; cursor: pointer; }
.ap-trace:hover { text-decoration: underline; }
.trace-link { margin-left: 8px; font-size: 10.5px; color: var(--pub); font-weight: 650; cursor: pointer; flex: none; }
.trace-link:hover { text-decoration: underline; }
.chip.agent-chip[data-apanel] { cursor: pointer; }
.chip.agent-chip[data-apanel]:hover { box-shadow: 0 2px 8px rgba(23,27,34,.35); }
.chip.gfilter { cursor: pointer; transition: background .15s, color .15s; }
.chip.gfilter:hover { color: var(--ink); }
.chip.gfilter.on { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); font-weight: 650; }

/* ---------- Composer：双语态 ---------- */
.composer { border-top: 1px solid var(--line); padding: 10px 20px 14px; background: var(--surface); position: relative; }
.voice-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.voice-seg { display: inline-flex; background: #EFF1F4; border-radius: 9px; padding: 3px; gap: 2px; }
.voice-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;

}
.voice-btn .vdot { width: 7px; height: 7px; border-radius: 50%; }

.voice-btn[data-voice="pub"] .vdot { background: var(--pub); }
.voice-btn[disabled] { opacity: .4; cursor: not-allowed; }
.composer.v-pri .voice-btn[data-voice="pri"],
.composer.v-pub .voice-btn[data-voice="pub"] {
  background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(24,30,42,.12);
}
/* v4.7 锚定条：落点的唯一可见真身（常显，取代散落的 hint/placeholder/toast） */
.composer.v-pri .quote-bar { border-left-color: var(--paper-line); background: #FAF8F2; color: #8A744A; }
.composer.v-ask .quote-bar { border-left-color: var(--amber); background: #FFFBF2; color: var(--amber); }
.quote-bar.delegate { font-weight: 650; color: var(--pub-deep); }
.chips-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.ref-chip {

  background: #F1F4F9; border: 1px solid var(--line); color: var(--ink-2);
}
.ref-chip .x { cursor: pointer; color: var(--ink-3); font-size: 13px; line-height: 1; }
.ref-chip .x:hover { color: var(--red); }
.cbox {
  display: flex; align-items: flex-end; gap: 10px;
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 12px;
  transition: border-color .2s, background .2s;
}
.composer.v-pri .cbox { border-color: var(--paper-line); background: var(--paper); }
.composer.v-pub .cbox { border-color: var(--pub); background: #FBFDFF; }
.cbox textarea {
  flex: 1; border: none; background: transparent; resize: none;
  font: inherit; line-height: 1.6; min-height: 40px; max-height: 120px;
  outline: none; color: var(--ink);
}
.send {
  flex: none; font-size: 12.5px; font-weight: 650;
  padding: 7px 16px; border-radius: 9px; color: #fff;

}
.composer.v-pri .send { background: #8A744A; }
.composer.v-pub .send { background: var(--pub); }
.send:hover { transform: translateY(-1px); }

/* ---------- 右栏：记忆 + 资源 ---------- */
.rightpanel {
  background: #F7F8FA;
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden; min-width: 0; position: relative;
}
.res-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.res-head h3 { font-size: 12.5px; font-weight: 700; }
.res-head .sub { font-size: 10.5px; color: var(--ink-3); }
.res-tabs { display: flex; gap: 4px; padding: 0 12px 10px; position: relative; }
.res-tab {
  font-size: 12px; font-weight: 600; color: var(--ink-3);
  padding: 4px 11px; border-radius: 20px;
  transition: background .15s, color .15s;
}
.res-tab.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.res-body { flex: 1; overflow-y: auto; padding: 2px 10px 16px; }
.res-sec { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); padding: 10px 6px 5px; }
.res-item {
  width: 100%;
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: 8px;
  text-align: left; transition: background .12s;
}
.res-item:hover { background: #EDEFF3; }
.res-item .ri {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  background: #fff; border: 1px solid var(--line);
}
.res-item .rt { flex: 1; min-width: 0; }
.res-item .rt1 { font-size: 12.3px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-item .rt2 { font-size: 10.5px; color: var(--ink-3); }
.res-item .plus { color: var(--ink-3); font-size: 14px; opacity: 0; transition: opacity .12s; }
.res-item:hover .plus { opacity: 1; }
.cal-item { display: flex; gap: 9px; padding: 7px 8px; border-radius: 8px; align-items: flex-start; }
.cal-item .ct { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--pub); padding-top: 2px; flex: none; width: 44px; }
.cal-item .cb { font-size: 12.3px; }
.cal-item .cb .cm { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.mem-scope { font-size: 11px; color: var(--ink-3); padding: 4px 6px 8px; line-height: 1.6; }
.mem-empty {
  margin: 4px 2px;
  border: 1px dashed #CDD3DC; border-radius: 10px;
  padding: 16px 12px; font-size: 11px; color: var(--ink-3);
  line-height: 1.7; text-align: center;
}
.mem-card {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 11px; margin: 0 2px 8px;
  box-shadow: var(--shadow);
  animation: slidein .3s ease; position: relative;
}
.mem-card .mk {
  font-size: 9.5px; font-weight: 700; color: var(--pub-deep);
  background: #E3ECFB; border-radius: 4px; padding: 1.5px 6px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.mem-card .mt { font-size: 12px; line-height: 1.6; margin-top: 6px; }
.mem-card .mm { font-size: 9.5px; color: var(--ink-3); margin-top: 6px; }
.mem-card .del { position: absolute; top: 7px; right: 9px; color: var(--ink-3); font-size: 13px; padding: 1px 4px; }
.mem-card .del:hover { color: var(--red); }

/* 对象面：当前 tab / 资源子导航 / 就地预览 */
.res-sub { display: flex; gap: 4px; padding: 0 4px 8px; }
.res-sub .rs {
  font-size: 11px; font-weight: 650; color: var(--ink-3);
  padding: 3px 10px; border-radius: 14px; cursor: pointer;
  transition: background .12s, color .12s;
}
.res-sub .rs.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.obj-tag { font-size: 9px; font-weight: 700; padding: 1.5px 6px; border-radius: 4px; flex: none; }
.obj-tag.art { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); }
.obj-tag.ref { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); }
.preview { padding: 2px 2px 10px; }
.pv-head { display: flex; align-items: center; gap: 7px; padding: 2px 2px 6px; }
.pv-back { font-size: 12px; color: var(--pub); font-weight: 650; cursor: pointer; padding: 2px 4px; flex: none; }
.pv-back:hover { text-decoration: underline; }
.pv-title { font-size: 12.5px; font-weight: 750; flex: 1; min-width: 0; }
.pv-meta { font-size: 9.5px; color: var(--ink-3); padding: 0 4px 8px; line-height: 1.5; }
.pv-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; box-shadow: var(--shadow); }
.pv-outline { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; line-height: 1.6; color: var(--ink-2); }
.pv-outline b { color: var(--ink); }
.pv-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.pv-table th { text-align: left; color: var(--ink-3); font-weight: 650; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pv-table td { padding: 4px 6px; border-bottom: 1px dashed #F0F2F5; }
.pv-open { margin-top: 9px; font-size: 11px; color: var(--pub); font-weight: 650; cursor: pointer; padding: 0 2px; }
.pv-open:hover { text-decoration: underline; }
.week-strip { display: flex; gap: 4px; padding: 2px 4px 8px; }
.wd {
  flex: 1; text-align: center; font-size: 9.5px; color: var(--ink-3);
  padding: 5px 0 8px; border-radius: 8px; position: relative; line-height: 1.5;
}
.wd.today { background: var(--pub); color: #fff; font-weight: 700; }
.wd .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--pub); position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); }
.wd.today .dot { background: #fff; }
.type-filter { display: flex; gap: 4px; padding: 0 4px 8px; }
.tf { font-size: 10px; font-weight: 650; color: var(--ink-3); padding: 2px 9px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; }
.tf.on { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); }
.hub-ok { color: var(--green); font-weight: 700; font-size: 10px; flex: none; }
.hub-cta {
  display: block; width: 100%; text-align: center;
  margin: 10px 0 2px; font-size: 12px; font-weight: 650;
  color: #fff; background: var(--ink); border-radius: 9px; padding: 8px 0;
  transition: background .15s;
}
.hub-cta:hover { background: #000; }

/* ---------- v4：承诺板 / 轻问 / 裁决卡 / 授权租约 ---------- */
.board-entry {
  margin: 0 12px 8px; width: calc(100% - 24px);
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-radius: 9px;
  background: #1D2432; color: #DCE4F5;
  font-size: 12px; font-weight: 650;
  transition: background .15s;
}
.board-entry:hover { background: #171B22; }
.board-entry .bd { margin-left: auto; font-size: 10px; color: #F0B44A; font-weight: 700; }
.board { padding: 4px 20px 20px; }
.cm-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px;
  background: #fff; margin-bottom: 8px; box-shadow: var(--shadow);
}
.cm-row.overdue { border-left: 3px solid var(--red); }
.ex-tag { font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 5px; flex: none; }
.ex-tag.agent { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); }
.ex-tag.human { background: #F3EFFA; color: #6D4FA3; border: 1px solid #DFD3F0; }
.ex-tag.process { background: #E5E8ED; color: var(--ink-2); border: 1px solid var(--line); }
.cm-due { font-size: 10.5px; color: var(--ink-3); }
.cm-due.overdue { color: var(--red); font-weight: 700; }
.remind-btn { /* v4.21 已废：一键借身提醒违 B4，保留类名防外链样式断裂 */
  font-size: 11px; font-weight: 650; padding: 4px 11px; border-radius: 7px;
  border: 1px solid var(--line); color: var(--ink-2); flex: none;
  transition: box-shadow .15s;
}
.remind-btn:hover { box-shadow: var(--shadow); }
.goal-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px;
  border: 1px dashed #B9C4D6; border-radius: 10px;
  background: #F7F9FC; margin-bottom: 6px; position: relative;
}
.ex-tag.goal { background: #EEF2F9; color: #3D4C66; border: 1px solid #C9D4E6; }
.goal-home { display: block; font-size: 10px; color: var(--pub); cursor: pointer; margin-top: 2px; }
.goal-home:hover { text-decoration: underline; }
.goal-sig { font-size: 10.5px; color: var(--ink-2); flex: none; }
.goal-final { font-size: 9.5px; color: var(--ink-3); flex: none; border: 1px solid var(--line); border-radius: 20px; padding: 1.5px 8px; }
.goal-row { flex-wrap: wrap; }
.goal-children { margin: 0 0 10px 18px; border-left: 2px solid #E4E9F1; padding-left: 10px; }
.ask-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 650; padding: 5px 12px; border-radius: 7px;
  border: 1px solid var(--line); color: var(--ink-2);
  transition: background .15s, color .15s;
}
.ask-btn.on { background: #FFF7E6; border-color: #F0D9B4; color: var(--amber); }
.ask-btn[disabled] { opacity: .4; cursor: not-allowed; }
.composer.v-ask .cbox { border-color: #F0B44A; background: #FFFBF2; }
.composer.v-ask .send { background: var(--amber); }
.askcard {
  border-radius: 12px; border: 1px solid #F0D9B4; border-left: 4px solid #F0B44A;
  background: #FFFDF6; box-shadow: var(--shadow);
  padding: 10px 13px; max-width: 560px;
}
.askcard .q { font-size: 11px; color: var(--ink-3); margin-bottom: 5px; }
.askcard .a { font-size: 13px; font-weight: 650; line-height: 1.6; }
.askcard .src { font-size: 10.5px; color: var(--ink-3); margin-top: 6px; }
.askcard .cross {
  margin-top: 7px; font-size: 10.5px; color: var(--pub-deep);
  background: #EDF3FF; border: 1px dashed var(--pub-line);
  border-radius: 7px; padding: 5px 9px;
}
.verdict-card {
  border-radius: 12px; border: 1px solid var(--amber-line); border-top: 3px solid var(--amber);
  background: #FFFDF8; box-shadow: var(--shadow);
  max-width: 620px; overflow: hidden;
}
.vd-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px 8px; }
.vd-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-top: 1px dashed #F4EBDB;
}
.vd-row .desc { flex: 1; min-width: 0; font-size: 12px; }
.vd-row .desc .ev { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.vd-acts { display: flex; gap: 5px; flex: none; }
.vd-btn { font-size: 11px; font-weight: 650; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink-2); }
.vd-btn:hover { box-shadow: var(--shadow); }
.vd-mark { font-size: 11px; font-weight: 700; flex: none; }
.vd-mark.ok { color: var(--green); }
.vd-mark.no { color: var(--red); }
.vd-mark.hold { color: var(--amber); }
.lease-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 0; font-size: 12px; border-bottom: 1px dashed #F0F2F5;
}
.lease-tag { font-size: 9.5px; font-weight: 700; padding: 1.5px 7px; border-radius: 20px; background: #FFF3E0; color: var(--amber); border: 1px solid var(--amber-line); flex: none; }
.lease-tag.expired { background: #E5E8ED; color: var(--ink-3); border-color: var(--line); }

/* v4.6：回复 / 引用条 / 就地展开 / 返回 */
.reply-btn {
  font-size: 10px; font-weight: 650; color: var(--pub);
  padding: 1px 8px; border-radius: 10px; border: 1px solid var(--pub-line);
  opacity: 0; transition: opacity .12s; flex: none;
}
.msg:hover .reply-btn { opacity: 1; }
.reply-btn.at-agent { color: var(--pub-deep); border-color: var(--pub); background: #F3F7FF; margin-left: 4px; }
.reply-btn.at-agent:hover { background: var(--pub); color: #fff; }
.quote-bar {
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; color: var(--ink-2);
  background: #F4F6F9; border-left: 3px solid var(--pub);
  border-radius: 6px; padding: 5px 10px; margin-bottom: 6px;
}
.quote-bar .x { margin-left: auto; cursor: pointer; color: var(--ink-3); font-size: 13px; }
.quote-bar .x:hover { color: var(--red); }
.qline {
  font-size: 11px; color: var(--ink-3);
  border-left: 2px solid var(--pub-line);
  padding-left: 7px; margin-bottom: 5px;
}
.tc-expand { font-size: 10.5px; color: var(--pub); font-weight: 650; cursor: pointer; flex: none; margin-right: 2px; }

/* v4.11 工件预览三态：流内卡 → 并排（默认态，边看边回）→ 沉浸 */
.app.pv-wide { grid-template-columns: 272px minmax(420px, 0.9fr) minmax(460px, 1.1fr); }
.filepv { position: absolute; inset: 0; z-index: 6; background: #fff; display: flex; flex-direction: column; }
.fpv-head { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
.fpv-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fpv-hint { font-size: 10px; color: var(--ink-3); padding: 6px 14px; border-bottom: 1px dashed var(--line); background: #FAFBFC; flex: none; }
.fpv-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 24px; }
.fpv-doc { font-size: 12.5px; line-height: 1.75; color: var(--ink); }
.fpv-doc h2 { font-size: 16px; margin: 4px 0 2px; }
.fpv-doc h3 { font-size: 13px; margin: 14px 0 4px; }
.fpv-doc p { margin: 4px 0; }
.fpv-dim { color: var(--ink-3); font-size: 10.5px; }
.fpv-page { background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
.fpv-pageno { font-size: 9.5px; color: var(--ink-3); margin-bottom: 6px; }
.fpv-sandbox { font-size: 10.5px; color: var(--amber); background: #FFF7E6; border: 1px solid var(--amber-line); border-radius: 7px; padding: 6px 10px; margin-bottom: 10px; }
.fpv-full { position: fixed; inset: 0; z-index: 70; background: #F7F8FA; display: flex; flex-direction: column; }
/* display:flex 会覆盖 [hidden] 的 UA 规则——必须显式补回 */
.filepv[hidden], .fpv-full[hidden] { display: none; }
/* 预览宽度：可拖分隔线 + 两端护栏 + 记忆——固定宽度=替用户决定主次，而主次是当下意图的属性 */
.fpv-divider { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 8; }
.fpv-divider::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line); transition: background .12s, width .12s; }
.fpv-divider:hover::after, body.pv-dragging .fpv-divider::after { width: 3px; background: var(--pub); }
body.pv-dragging { user-select: none; cursor: col-resize; }
/* v4.12 目标枢纽：承诺板第二缩放级别 */
.hub-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; }
.hub-std { display: inline-block; background: #F4F6F9; border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; margin: 2px 4px 2px 0; font-size: 11px; }

       body: '中栏是<b>流</b>（时间），右栏是<b>物</b>（空间）。流的三种沉淀：<b>记忆</b>（事实）、<b>引用</b>（语境）、<b>工件</b>（劳动）。「当前」tab 跟会话走：本会话的工件、喂过的引用、关联日程（任务的截止维度）。点任何对象<b>就地只读预览</b>——检验标准③在验收动作上闭合；实现 = 中栏富卡片渲染器复用（presentationMeta 已有），几乎免费。资源 tab 补上此前缺席的<b>表格</b>——交付物最常是表格。编辑永远走对话 + 确认门。' },
  13: { title: '群视图与话题卡：冷=索引，热=任务卡',
       body: '群 = 主楼流 + 分叉的话题，故有两级缩放：<b>群视图</b>（主楼 + 内联话题卡）与<b>话题视图</b>（session 时间线 + 面包屑）。话题卡<b>冷热两态</b>：无 agent 的冷卡是纯历史索引；焐热的卡自动升级为<b>任务卡</b>（带状态徽标）——群视图由此成为该群的 mission control，"历史清晰"与"注意力路由"是同一张卡的两面。试试在主楼 composer 裸 @云小助：新话题卡会原地长出来（A0 第③级规则肉眼可见）。再试试 hover 一条主楼消息点 ↩ 回复：不 @ 时<b>冷链平铺</b>——引用回复留在主楼，与云之家原生一致；再对同一条消息回复并 @云小助——<b>点火收纳</b>：session 锚定链根，整条链连同此前闲聊收进根消息原位的热卡（冷链平铺，热链收纳——链是话题的胚胎，受话 agent 是点火，v4.7）。' },
};

/* ============================================================ */
const $ = (id) => document.getElementById(id);
const timelineEl = $('timeline');

function avatarHtml(who) {
  const a = AV[who];
  return `<span class="avatar" style="background:${a.c}">${a.t}</span>`;
}
function pinInline(no) {
  return no ? `<button class="pin inline" data-note="${no}" aria-label="设计注解 ${no}">${no}</button>` : '';
}

/* ---------- 时间线渲染 ---------- */
function renderItem(item, sess) {
  if (item.type === 'divider')
    return `<div class="divider${item.unread ? ' unread' : ''}">${item.text}</div>`;

  if (item.type === 'im') {
    const mine = item.mine ? ' mine' : '';
    const foot = item.delegate
      ? `<div class="mfoot">公开委派 · 经 gateway · ${sess.kind === 'dm' || sess.placeKey === '李婷' ? '对方' : '群内所有人'}可见</div>`
      : `<div class="mfoot">云之家 · ${sess.group}</div>`;
    if (!item._id) item._id = ++MSG_UID;
    const excerpt = item.text.replace(/<[^>]+>/g, '').slice(0, 24);
    const replyBtn = item.mine ? '' : `<button class="reply-btn" data-mid="${item._id}" data-who="person" data-rname="${item.name}" data-rtext="${excerpt}">↩ 回复</button><button class="reply-btn at-agent" data-mid="${item._id}" data-who="person" data-atg="1" data-rname="${item.name}" data-rtext="${excerpt}">⚡ @云小助</button>`;
    const quoteH = item.quote ? `<div class="qline">↩ ${item.quote.name}：${item.quote.text}</div>` : '';
    return `<div class="msg msg--pub${mine} enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml(item.who)}<span class="name">${item.name}</span><span class="meta">${item.time}</span>${replyBtn}${pinInline(item.pin)}</div>
        <div class="bubble">${quoteH}${item.text}</div>${foot}
      </div></div>`;
  }

  if (item.type === 'agent-pub') {
    if (!item._id) item._id = ++MSG_UID;
    const stateName = sess.agentState ? ` <span class="state">[${sess.agentState}]</span>` : '';
    const kindFoot = { ack: '经 gateway 回帖 · 群内可见', progress: 'checkpoint · 群内可见（上限 5 条）', done: '终态回帖 · 群内可见', pause: '等待状态 · 群内可见' }[item.kind];
    const aReply = `<button class="reply-btn" data-mid="${item._id}" data-who="agent" data-rname="云小助" data-rtext="${(item.text || '').replace(/<[^>]+>/g, '').slice(0, 24)}">↩ 回复</button>`;
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('agent')}<span class="name">云小助${stateName}</span><span class="meta">${item.time}</span>${aReply}${pinInline(item.pin)}</div>
        <div class="bubble${item.kind === 'pause' ? ' pause' : ''}">${item.text}</div>
        <div class="mfoot">${kindFoot}</div>
      </div></div>`;
  }

  if (item.type === 'agent-pri') {
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('agent')}<span class="name">云小助</span><span class="meta">${item.time}</span></div>
        <div class="bubble">${item.text}</div>
        <div class="mfoot">仅你可见 · 桌面投影</div>
      </div></div>`;
  }

  if (item.type === 'user-pri') {
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('me')}<span class="name">Bruce（我）</span><span class="meta">${item.time}</span></div>
        <div class="bubble">${item.text}</div>
        <div class="mfoot">本地 followup · 即时 · 群内不可见</div>
      </div></div>`;
  }

  if (item.type === 'work') {
    const steps = item.steps.map(s => {
      const mark = { done: '✓', run: '◐', wait: '⏸' }[s.st];
      return `<div class="wstep ${s.st}${s.mem ? ' mem' : ''}"><span class="st">${mark}</span><span class="tool">${s.tool}</span><span>${s.desc}</span></div>`;
    }).join('');
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <details class="workblock"${item.open ? ' open' : ''}>
          <summary><span class="tw">▶</span>${item.summary}<span class="trace-link" data-trace="1">完整轨迹 ↗</span><button class="pin inline" data-note="11" aria-label="设计注解 11">11</button><span style="margin-left:auto;font-weight:400;font-size:10.5px;color:#A08D5F">仅你可见</span></summary>
          <div class="wsteps">${steps}</div>
        </details>
      </div></div>`;
  }

  if (item.type === 'confirm') {
    const fields = item.fields.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
    const approved = item.state === 'approved';
    const actions = approved
      ? `<div class="cc-done-note">✓ 已确认 · sheet 创建与 12 条记录写入已执行</div>`
      : `<div class="cc-actions">
           <button class="btn primary" data-cc="${item.id}" data-act="approve">确认执行</button>
           <button class="btn" data-cc="${item.id}" data-act="cancel">取消</button>
           <button class="btn" data-cc="${item.id}" data-act="context">查看上下文</button>
           <button class="btn" data-cc="${item.id}" data-act="edit">编辑参数</button>
         </div>`;
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="confirm-card${approved ? ' approved' : ''}" id="card-${item.id}">
          <div class="cc-head"><span class="cc-domain">sheet</span><span class="cc-title">${item.title}</span><span class="cc-risk">${item.risk}</span>${pinInline(item.pin)}</div>
          <div class="cc-fields">${fields}</div>
          <div class="cc-proj">同一审批对象的投影：<span class="pj">桌面卡（此处）</span> <span class="pj">云之家 DM 兜底（已推送，回复 1/2 可批）</span> —— 任一侧应答即全局生效</div>
          ${actions}
        </div>
        <div class="mfoot">审批对象 · 仅操作者可批</div>
      </div></div>`;
  }

  if (item.type === 'artifact') {
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="artifact" role="link" tabindex="0" data-artifact="1"${item.pv ? ` data-pv="${item.pv}"` : ''}>
          <span class="af-icon">${item.icon}</span>
          <span class="af-body"><span class="af-t">${item.title}${pinInline(item.pin)}</span><span class="af-m" style="display:block">${item.meta}</span></span>
          <span class="af-arrow">↗</span>
        </div>
        <div class="mfoot">工件已落云之家 · 群里回帖的是链接</div>
      </div></div>`;
  }

  if (item.type === 'accept') {
    const done = item.state === 'done';
    const rejected = item.state === 'rejected';
    let inner;
    /* v4.14 交付即出卡：终态回帖是可应答对象——验收/拒收动词长在交付上，带"等你验收"的脸 */
    if (done) inner = item.commit
      ? `<span class="lab">✓ 已验收 · 承诺终态（人工签发）· 已回写云之家真身</span>`
      : `<span class="lab">🗂 已验收归档 · 记忆已蒸馏</span>`;
    else if (rejected) inner = `<span class="lab" style="color:var(--amber)">↩ 已打回 · 返工第 ${item.round || 2} 轮 · 新旧交付 diff 已挂到任务</span>`;
    else inner = `<div class="aw-face">✋ 验收点 · 等你验收<span style="font-weight:400;color:var(--ink-3)">（可应答对象——与收件箱同一真身）</span></div>
          <span class="lab">交付物就在上方——边看边验（点工件可就地预览）</span>
          <button class="btn primary" data-accept="${item.id}">✓ 验收归档（/done）</button>
          <button class="btn" data-reject="${item.id}">↩ 打回重做</button>`;
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="acceptbar${done ? ' done-state' : ''}${(!done && !rejected) ? ' awaiting' : ''}" id="accept-${item.id}">
          ${inner}
          <span class="note">${rejected ? '拒收是显式对象：轮次可计数、diff 可对照、蒸馏已回滚' : '群内自然语言「收了」同样生效'}</span>
          ${pinInline(item.pin)}
        </div>
      </div></div>`;
  }

  if (item.type === 'file') {
    if (!item._id) item._id = ++MSG_UID;
    const f = FILES[item.file];
    const ic = { pdf: '📕', md: '📄', html: '🌐' }[f.kind];
    const excerpt = '[文件] ' + f.name;
    const isAgent = item.who === 'agent';
    const replyBtn = item.mine ? '' : `<button class="reply-btn" data-mid="${item._id}" data-who="${isAgent ? 'agent' : 'person'}" data-rname="${item.name}" data-rtext="${excerpt}">↩ 回复</button>${isAgent ? '' : `<button class="reply-btn at-agent" data-mid="${item._id}" data-who="person" data-atg="1" data-rname="${item.name}" data-rtext="${excerpt}">⚡ @云小助</button>`}`;
    return `<div class="msg msg--pub${item.mine ? ' mine' : ''} enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml(item.who)}<span class="name">${item.name}</span><span class="meta">${item.time}</span>${replyBtn}${pinInline(item.pin)}</div>
        <div class="artifact" style="cursor:default">
          <span class="af-icon">${ic}</span>
          <span class="af-body"><span class="af-t">${f.name}</span><span class="af-m" style="display:block">${f.meta}</span></span>
          <span style="display:flex;gap:5px;flex:none">
            <button class="btn" data-fpv="${item.file}" style="font-size:11px;padding:3px 11px">预览</button>
            <button class="btn" data-fpvdl="1" style="font-size:11px;padding:3px 11px" title="下载">⬇</button>
          </span>
        </div>
        <div class="mfoot">${isAgent ? '工件交付 · 真身已落云之家 · 预览是投影' : '云之家文件消息 · 文件即工件（人发布的出生血缘）'}</div>
      </div></div>`;
  }

  if (item.type === 'goalsign') {
    const body = item.state === 'ok'
      ? `<div class="cc-done-note">✓ 已签发落库 · 真身（含成功标准）写入云之家《目标表》· 出生血缘 → 本磨稿会话</div>`
      : `<div class="cc-actions"><button class="btn primary" data-gs="${item.id}">确认签发（登记目标）</button><button class="btn" data-gs2="${item.id}">再磨磨</button></div>`;
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="confirm-card${item.state === 'ok' ? ' approved' : ''}" id="gs-${item.id}">
          <div class="cc-head"><span class="cc-domain">立目标</span><span class="cc-title">${item.title}</span></div>
          <div style="font-size:11.5px;color:var(--ink-2);padding:2px 0 8px">成功标准（入真身正文 · 自由文本，不建 KR 结构）：${item.std}</div>
          ${body}
        </div>
        <div class="mfoot">磨目标 = 对话 + 可见域检索 + 登记动词——agent 磨稿，落库人签发（作者权 ≠ 思考伙伴）</div>
      </div></div>`;
  }

  if (item.type === 'goalprop') {
    const body = item.state === 'ok'
      ? `<div class="cc-done-note">✓ 已确认落库（人签发）· 真身已写入云之家《Q3 目标 · 产品组》表新行 · 图记 URI —— 见承诺板</div>`
      : item.state === 'no'
        ? `<div class="cc-done-note" style="color:var(--red)">✗ 已驳回 · 未落库 —— agent 不可作者目标，提案止于提案</div>`
        : `<div class="cc-actions">
             <button class="btn primary" data-gp="${item.id}:ok">确认落库</button>
             <button class="btn" data-gp="${item.id}:no">驳回</button>
           </div>`;
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="confirm-card${item.state === 'ok' ? ' approved' : ''}" id="gp-${item.id}">
          <div class="cc-head"><span class="cc-domain">目标提案</span><span class="cc-title">${item.title}</span>${pinInline(item.pin)}</div>
          <div style="font-size:11px;color:var(--ink-3);padding:2px 0 6px">${item.meta}</div>
          <div style="font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:8px;margin-bottom:8px">${item.ev}</div>
          ${body}
        </div>
        <div class="mfoot">AI 速记纪要 → 提案裁决（目标出生主产地 · 入口①）· 仅 owner 可批 · DM 兜底已推送</div>
      </div></div>`;
  }

  /* v4.20 交付推断：回执面第三个门（行为回执）——执行者甩文件不说话，agent 提议挂为交付回执 */
  if (item.type === 'dlvinfer') {
    const f = FILES[item.file];
    const body = item.state === 'ok'
      ? `<div class="cc-done-note">✓ 已挂为交付回执 · 以<b>张锐</b>名义回流登记场所（本群 · 上周五登记话语处）· 验收卡已出，等 Bruce 验收（交付即出卡）</div>`
      : item.state === 'no'
        ? `<div class="cc-done-note" style="color:var(--red)">✗ 已标注「不是交付」——保守推断亮出可纠，误报一次点掉，图不记错账（宁空勿错）</div>`
        : `<div class="cc-actions">
             <button class="btn primary" data-dlv="${item.id}:ok">挂为交付回执（以张锐名义回流）</button>
             <button class="btn" data-dlv="${item.id}:no">不是交付</button>
           </div>`;
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="confirm-card${item.state === 'ok' ? ' approved' : ''}" id="dv-${item.id}">
          <div class="cc-head"><span class="cc-domain">交付推断</span><span class="cc-title">这像是『${item.commit}』的交付</span>${pinInline(item.pin)}</div>
          <div style="font-size:11px;color:var(--ink-3);padding:2px 0 6px">张锐名下 · 昨天 18:00 到期 · 图内无回执——文件进了群，但没有回在登记话语下</div>
          <div style="font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:8px;margin-bottom:8px">识别依据：▤ ${f.name} × 张锐名下承诺（executor 侧可见域查询，§1.6 不破）· 保守推断，不自动挂</div>
          ${body}
        </div>
        <div class="mfoot">回执面三个门：话语（"发了"）/ <b>行为（甩文件）</b>/ 结构化（待办勾完成）——确认权在执行者张锐（demo 代演其视角），公示可纠</div>
      </div></div>`;
  }

  if (item.type === 'topiccard') {
    const t = sessions[item.target];
    const hot = ['running', 'confirm', 'review'].includes(t.status);
    const expanded = !!state.expandedTopics[item.target];
    let peek = '';
    if (expanded) {
      const rows = t.timeline.filter(i => i.type === 'im' || i.type === 'agent-pub').slice(-3)
        .map(i => `<div class="peek-row"><b>${i.type === 'im' ? i.name : '云小助'}</b>：${(i.text || '').replace(/<[^>]+>/g, '').slice(0, 42)}…</div>`).join('');
      peek = `<div class="tc-peek">${rows}
        <div style="margin-top:6px"><button class="btn" data-sess="${item.target}" style="font-size:11px;padding:4px 12px">进入话题 →</button>
        <span style="font-size:10px;color:var(--ink-3);margin-left:8px">就地展开 · 零导航 · 阅读位置不丢</span></div></div>`;
    }
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="topiccard${hot ? ' hot' : ''}" data-sess="${item.target}" role="link" tabindex="0">
          <span class="tc-ic">🧵</span>
          <span class="tc-body"><span class="tc-t">${t.title}${pinInline(item.pin)}</span><span class="tc-m" style="display:block">${item.meta}</span></span>
          <span class="tc-expand" data-tcx="${item.target}" role="button" tabindex="0">${expanded ? '⌃ 收起' : '⌄ 展开'}</span>
          ${badgeHtml(t)}<span class="tc-arrow">›</span>
        </div>${peek}
        <div class="mfoot">云之家话题 · 展开就地扫一眼，点击进入深工作${hot ? '（热卡 = 任务卡）' : '（冷卡 = 历史索引）'}</div>
      </div></div>`;
  }

  if (item.type === 'verdict') {
    item._anchorId = 'vcard-' + item.id;
    const rows = item.findings.map((f, i) => {
      const acts = f.decision === null
        ? `<span class="vd-acts">
            <button class="vd-btn" data-vd="${item.id}:${i}:ok">确认修正</button>
            <button class="vd-btn" data-vd="${item.id}:${i}:no">驳回</button>
            <button class="vd-btn" data-vd="${item.id}:${i}:hold">挂起</button></span>`
        : `<span class="vd-mark ${f.decision}">${{ ok: '✓ 已确认', no: '✗ 已驳回', hold: '⏸ 挂起' }[f.decision]}</span>`;
      return `<div class="vd-row"><span class="desc">${f.desc}<span class="ev">${f.ev}</span></span>${acts}</div>`;
    }).join('');
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="verdict-card" id="vcard-${item.id}">
          <div class="vd-head"><span class="cc-domain">裁决</span><span class="cc-title">3 处差异 · 逐条裁决</span><span class="cc-risk">发现物 · 不动原数据</span>${pinInline(item.pin)}</div>
          ${rows}
        </div>
        <div class="mfoot">裁决卡（第二种确认卡）· 面向"agent 发现的事" · 仅操作者可裁 · 挂起不阻塞其余</div>
      </div></div>`;
  }

  if (item.type === 'askcard') {
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="askcard">
          <div class="q">⚡ ${item.q}</div>
          <div class="a">${item.a}</div>
          <div class="src">${item.src}</div>
          ${item.cross ? `<div class="cross">跨场所读取 · 以你的可见域为界（你本就看得见销售群）· 本回答仅你可见${pinInline(20)}</div>` : ''}
        </div>

const CHEV_SVG = '<svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function groupAggBadge(keys) {

function renderGroupRows(g) {
  {
    /* 注意力租约：有 head 的组（群）下只挂活跃话题，终态退租；无 head 的组是场所/本地，常驻但归档不带徽标 */
    const visibleKeys = g.head

      : g.keys.slice();
    const isCollapsed = !!state.collapsed[g.label];
    /* 收起即全收（折叠 = 注意力的用户主权，租约是系统代理）；含当前会话的收起组以左缘示位线标注 */
    const showKeys = isCollapsed ? [] : visibleKeys;
    const holds = isCollapsed && (g.keys.includes(state.current) || g.head === state.current);
    const items = showKeys
      .sort((a, b) => STATUS_RANK[sessions[a].status] - STATUS_RANK[sessions[b].status])

    const chevOn = (withData) => `<span class="chev${isCollapsed ? ' closed' : ''}"${withData ? ` data-chev="${g.label}" role="button" tabindex="0" aria-label="折叠/展开"` : ''}>${CHEV_SVG}</span>`;

function appendItems(sessKey, items, delayBase = 0) {

/* v4.24 预填出处律：demo 的选中示例是演示装置——选中态 = "这段是示例，你来说"（打字即替换；真实产品空白委派无预填内容） */
function focusSelect(input, seg) {

let lastRegName = null;
/* v4.24 纠正循环 + 语气路由的共享检测——群主楼与 DM 双路同规则（返回 true = 已处理不再往下路由） */
function correctionOrRequest(text, sessKey, hasPerson) {
  /* 纠正：ack 公示可纠——"不对请说"必须真的有人说了会改 */
  if (lastRegName && /改成|不是.*[，,]?\s*是/.test(text) && /(下?周[一二三四五六日]|明天|今天)/.test(text)) {
    const rc = COMMITS.find(x => x.name === lastRegName);
    const m = text.match(/(下?周[一二三四五六日]前?|明天|今天)/);
    if (rc && m) rc.due = m[1].endsWith('前') ? m[1] : m[1] + '前';
    appendItems(sessKey, [{ type: 'agent-pub', time: nowStr(), kind: 'ack',
      text: `已纠正：<b>${lastRegName}</b> 期限 → <b>${rc ? rc.due : (m ? m[1] : '')}</b>（ack 公示可纠——解析错了说一句就改，内容提议同通道，登记消息的听众同步看到纠正）。` }], 800);
    renderSidebar(); renderHead();
    return true;
  }
  /* 语气路由：疑问/请求 ≠ 签发——先应后登（他没答应，账上不能欠）；人名不要求 @（请求常不带 @） */
  const mentionsPerson = hasPerson || /(李婷|王超|张三|小唐|张锐)/.test(text);
  if (mentionsPerson && /([吗么][？?]?\s*$|能不能|能帮|可以帮|方便.{0,4}[吗么]?)/.test(text)) {
    appendItems(sessKey, [{ type: 'agent-pub', time: nowStr(), kind: 'ack',
      text: `疑问语气 = 请求不是签发——<b>我不登记为承诺</b>（他没答应，账上不能欠）。已作为<b>待答询问</b>送达对方（可应答家族⑥ · 押采纳门样机）：他应了我再登记（<b>先应后登</b>，语气路由 v4.24）。` }], 900);
    return true;
  }
  return false;
}
/* v4.21+ 委派/登记的出生落库：话语解析（"登记承诺：X，谁负责，何时" / "X由谁负责"）——发送即入图 */
function parseRegister(text) {
  const t = text.replace(AGENT_ALIAS, '').replace(/^[\s,，]+/, '').trim();
  const m = t.match(/^登记(?:个)?承诺[：:，,\s]*(.+?)(?:由|[，,]\s*)([^\s，,]+?)负责[，,]?\s*(.*?)[。.\s]*$/);
  if (!m) return null;
  return { name: m[1].trim().replace(/[，,]$/, ''), who: m[2].trim(), due: (m[3] || '').trim() || '未定' };
}
function registerCommit(row) {
  COMMITS.push(row);
  lastRegName = row.name;
  renderSidebar(); renderHead();
}
function handleSend() {
  const input = $('input');
  const text = input.value.trim();
  if (!text) return;
  const sessKey = state.current;
  const sess = sessions[sessKey];
  if (sess.kind === 'board') return;

  /* v4：轻问——一次性投影，不产生任务 */
  if (state.ask) {
    input.value = '';
    const cross = /销售群|凯瑞/.test(text);
    const ans = cross
      ? { a: '凯瑞的最新口径：预算上限 ¥80 万，希望 Q4 内完成签约。', src: '来源：销售一群 · 8/15 讨论（3 条消息）', cross: true }
      : /回款|华南/.test(text)
        ? { a: '上月华南回款 ¥2,412,000，环比 +12%。', src: '来源：ERP 数据面（演示桩）' }
        : { a: '已即时汇总，详见来源。', src: '来源：知识库检索（演示桩）' };
    appendItems(sessKey, [{ type: 'askcard', q: text, time: nowStr(), ...ans }]);
    state.ask = false;
    syncAskUI();
    toast('轻问 = 一次性投影：问一个数得一个数，未创建任务（F-read）');
    return;
  }
  const chips = state.chips.slice();
  const chipNote = chips.length ? `<div class="mfoot">引用：${chips.join(' · ')}</div>` : '';
  input.value = '';
  state.chips = [];
  renderChips();
  updateVoiceHint();

  const hasAt = AGENT_ALIAS.test(text);
  const hasPerson = /@(李婷|王超|张三|小唐|张锐)/.test(text);
  const safe = text
    .replace(/@agent|@智能体|@云小助/gi, m => `<span class="at">${m}</span>`)
    .replace(/@(李婷|王超|张三|小唐|张锐)/g, '<span class="at">@$1</span>');

  if (state.voice === 'pub') {
    const quote = state.quote;
    state.quote = null;
    /* v4.7 受话规则：委派语义由「受话者含 agent」触发——@ 与回复 agent 的消息同为受话 */
    const toAgent = hasAt || (quote && quote.who === 'agent');

    if (sess.kind === 'groupview') {
      if (quote) { chainReply(quote, safe + chipNote, toAgent); renderQuoteBar(); return; }
      if (hasAt) { renderQuoteBar(); mainFloorDelegate(text, safe, chipNote, chips); return; }
      appendItems(sessKey, [{ type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, text: safe + chipNote }]);
      if (hasPerson) toast('已提及成员——对方将收到云之家通知（第七动词：作为同事说话）');
      renderQuoteBar();
      return;
    }

    appendItems(sessKey, [{ type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: toAgent, quote, text: safe + chipNote }]);
    if (quote && !toAgent) {
      toast(isDM(sess)
        ? '↩ 引述 · 落点不变——DM 流即界（§1.7），回复退化为纯指涉'
        : '↩ 回复 · 落点不变——已在话题内，链根未变（回复=挂链，落点=链根所在边界）');
    }
    if (hasPerson && !toAgent) toast('已提及成员——对方将收到云之家通知（第七动词：作为同事说话）');
    /* v4.24 登记话语穿透冷会话（冷 DM 里登记承诺不该被焐热流程吞掉——登记 ack 直接落时间线） */
    if (sess.kind === 'cold' && toAgent && !parseRegister(text)) { renderQuoteBar(); warmUp(sessKey); return; }
    if (toAgent) {
      /* v4.21+ 登记话语 → 登记 ack（公示可纠）+ 承诺上板——委派/登记一个动词，入口只是语境来源 */
      const reg = parseRegister(text);
      if (reg) {
        const ctx = state.delegCtx; state.delegCtx = null;
        const goalKept = ctx && ctx.goal && chips.some(ch => ch.startsWith('目标：'));
        registerCommit({ name: reg.name, exec: 'human', who: reg.who, due: reg.due, dueT: 'soon',
          state: '已登记', goal: goalKept ? ctx.goal : undefined,
          linked: goalKept ? '语境继承 · 委派传送门' : undefined,
          aud: isDM(sess) ? 'dm' : 'all', reg: sessKey });
        appendItems(sessKey, [{ type: 'agent-pub', time: nowStr(), kind: 'ack',
          text: `已登记承诺：<b>${reg.name}</b> · 执行者 <b>${reg.who}</b> · ${reg.due}${goalKept
            ? ` · 已挂目标<b>「${ctx.goalTitle}」</b>（语境继承——不对请说）`
            : ' · 未挂目标（chip 已移除——未挂是合法状态，/link 可补挂）'}。登记消息即听众集合${isDM(sess) ? `（本 DM：你与${reg.who}）` : '（本群全员）'}——承诺已上板，我会盯进度：观察与提醒，不代做。` }], 900);
        /* v4.24 受领三态样本：对方回应 = 受领证据自然发生（受领是证据不是义务——他不回也不催受领） */
        if (isDM(sess)) setTimeout(() => {
          appendItems(sessKey, [
            { type: 'im', who: { 张三: 'zhang', 李婷: 'liting' }[reg.who] || 'zhang', name: reg.who, time: nowStr(), text: `收到，${reg.due}给你。` },
            { type: 'agent-pub', time: nowStr(), kind: 'ack',
              text: `受领证据已记：<b>${reg.who}</b> 已回应——信号升级：已登记 → <b>有证据 · 本人已回应</b>。受领是证据不是义务：他不回我也不催受领（无回应不进留意层不老化——催的对象永远是交付，v4.24）。` },
          ]);
          const rc = COMMITS.find(x => x.name === reg.name && x.who === reg.who);
          if (rc) rc.received = `${reg.who}已回应 · 刚刚`;
          renderSidebar();
        }, 2600);
        renderQuoteBar();
        return;
      }
      /* v4.24 纠正循环 + 语气路由——共享检测（群主楼与 DM 双路同规则，勿再漏一路） */
      if (correctionOrRequest(text, sessKey, hasPerson)) { renderQuoteBar(); return; }
      appendItems(sessKey, [{ type: 'agent-pub', time: nowStr(), kind: 'ack',
        text: hasAt
          ? '已接收（并入当前话题队列，串行执行）。同话题多次 @ 同属本会话；要干净上下文用 /new。'
          : '收到——你回复了我的消息，即向我受话（无需再 @）。已并入当前任务上下文。' }], 900);
      if (!hasAt && quote) toast('受话者含 agent：回复 agent 的消息 = 追加指令，无需 @（v4.7 受话规则）');
    }
    renderQuoteBar();
  } else {
    state.quote = null; renderQuoteBar();
    appendItems(sessKey, [{ type: 'user-pri', time: nowStr(), text: safe + chipNote }]);
    if (sess.kind !== 'cold') {
      appendItems(sessKey, [{ type: 'agent-pri', time: nowStr(), text: '收到，已并入当前任务上下文。' }], 1000);
    }
  }
}

/* v4.7 冷链平铺，热链收纳（Bruce 裁决）：挂链是数据事实（replyRootMsgId），划界收纳是投影决策——
   人-人引用链平铺主楼（与云之家原生一致）；受话 agent 的瞬间 session 锚定链根，整条链收纳为热卡 */
let MSG_UID = 0;
let chainTopicCount = 0;
function chainReply(quote, bodyHtml, toAgent) {
  const floorKey = state.current;
  const floor = sessions[floorKey];
  const idx = floor.timeline.findIndex(i => i._id == quote.mid);
  if (idx < 0) return;
  /* 链根解析：回复的对象若本身是冷链成员，根 = 它的链根 */
  let rootIdx = idx;
  if (floor.timeline[idx].chainRoot != null) {
    const r = floor.timeline.findIndex(i => i._id == floor.timeline[idx].chainRoot);
    if (r >= 0) rootIdx = r;
  }
  const root = floor.timeline[rootIdx];

  if (!toAgent) {
    /* 冷链：平铺主楼带引用线——不划界不生卡（链是话题的胚胎） */
    appendItems(floorKey, [{ type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true,
      quote: { name: quote.name, text: quote.text }, chainRoot: root._id, text: bodyHtml }]);
    toast('冷链平铺：引用回复留在主楼（与云之家原生一致）——链已在数据里，受话 agent 时整条链才收纳为话题');
    return;
  }

  /* 点火收纳：受话 agent → session 锚定链根，链根+冷链成员整体迁入话题，主楼原位只留热卡 */
  chainTopicCount++;
  const key = 'chaintopic' + chainTopicCount;
  const members = floor.timeline.filter(i => i.chainRoot === root._id);
  sessions[key] = {
    group: floor.group, kind: 'topic', placeKey: floor.placeKey,
    title: (((root.text || '').replace(/<[^>]+>/g, '').slice(0, 10)) || '新话题') + '…',
    status: 'running',
    agentState: '处理话题内委派中',
    sid: `session-yzj-topic-c${chainTopicCount}a…`,
    icon: floor.icon,
    preview: '运行中：冷链点火收纳',
    voiceDefault: 'pub',
    objects: { artifacts: [], refs: [], events: [] },
    timeline: [
      { type: 'divider', text: '今天' },
      root, /* 真身唯一：链根与成员是迁移不是复制 */
      ...members,
      { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: true,
        quote: { name: quote.name, text: quote.text }, text: bodyHtml },
      { type: 'agent-pub', time: nowStr(), kind: 'ack',
        text: '已接收。session 锚定这条链的根——<b>回复链根 > 自成根</b>（A0），链上此前的对话已成为本话题的开场上下文。' },
    ],
  };
  floor.timeline[rootIdx] = { type: 'topiccard', target: key, meta: `${root.name} 的消息 · 链上 ${members.length + 2} 条收纳 · 刚刚` };
  floor.timeline = floor.timeline.filter(i => i.chainRoot !== root._id);
  const pg = GROUPS.find(x => x.head === floorKey);
  if (pg) pg.keys.push(key);
  renderTimeline(); renderSidebar(); renderHead();
  const card = timelineEl.querySelector(`.topiccard[data-sess="${key}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast('点火收纳：受话 agent → session 锚定链根，整条链收进热卡（冷链平铺，热链收纳）');
}

/* 主楼裸 @ → 原地长出新话题（A0 第③级规则可视化） */
let dynTopicCount = 0;
function mainFloorDelegate(rawText, safe, chipNote, chips) {
  const floorKey = state.current;
  const floor = sessions[floorKey];
  const ctx = state.delegCtx; state.delegCtx = null;
  const goalKept = ctx && ctx.goal && (chips || []).some(ch => ch.startsWith('目标：'));
  /* v4.24 纠正/请求检测（群主楼路——与 DM 路同一共享函数）：先落用户话语，再路由 */
  if (correctionOrRequest(rawText, floorKey, /@(李婷|王超|张三|小唐|张锐)/.test(rawText))) {
    floor.timeline.splice(floor.timeline.length, 0,
      { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, text: safe + (chipNote || '') });
    renderTimeline();
    return;
  }
  /* v4.21+ 登记话语走登记路，不开话题——登记的是他人的承诺，不是给 agent 的任务 */
  const reg = parseRegister(rawText);
  if (reg) {
    registerCommit({ name: reg.name, exec: 'human', who: reg.who, due: reg.due, dueT: 'soon',
      state: '已登记', goal: goalKept ? ctx.goal : undefined,
      linked: goalKept ? '语境继承 · 委派传送门' : undefined, aud: 'all', reg: floorKey });
    appendItems(floorKey, [
      { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: true, text: safe + (chipNote || '') },
      { type: 'agent-pub', time: nowStr(), kind: 'ack',
        text: `已登记承诺：<b>${reg.name}</b> · 执行者 <b>${reg.who}</b> · ${reg.due}${goalKept
          ? ` · 已挂目标<b>「${ctx.goalTitle}」</b>（语境继承——不对请说）`
          : ' · 未挂目标（未带语境——未挂是合法状态，/link 可补挂）'}。登记消息即听众集合（本群全员）——承诺已上板，我会盯进度：观察与提醒，不代做。${floorKey === 'prodgroup' && reg.who === '张三'
          ? '<br>⚠ <b>张三不在本群</b>：登记指针已 DM 补递——最小听众不变量：承诺边听众 ≥ {owner, executor}（修边非越境，v4.24）' : ''}` },
    ]);
    toast('登记必有呼吸（幽灵承诺禁令）：登记消息确立听众集合，承诺行已上承诺板');
    return;
  }
  dynTopicCount++;
  const key = 'dyntopic' + dynTopicCount;
  const label = rawText.replace(/@agent|@智能体|@云小助/gi, '').trim().slice(0, 12) || '新话题';
  sessions[key] = {
    group: floor.group, kind: 'topic', placeKey: floor.placeKey,
    title: label,
    status: 'running',
    agentState: '处理主楼委派中',
    sid: `session-yzj-topic-n${dynTopicCount}f…`,
    icon: floor.icon,
    preview: '运行中：Agent 已接收任务',
    voiceDefault: 'pri',
    objects: { artifacts: [], refs: [], events: [] },
    timeline: [
      { type: 'divider', text: '今天' },
      { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: true, text: safe + (chipNote || '') },
      { type: 'agent-pub', time: nowStr(), kind: 'ack', text: `已接收，<b>回复本条消息</b>可在此任务上继续。${goalKept ? `已挂到目标<b>「${ctx.goalTitle}」</b>（语境继承——chip 带入，不对请说）。` : ''}` },
    ],
  };
  /* v4.21+ 委派即承诺出生：agent 执行行落板（sess = 新话题，一跳可达） */
  const due = (rawText.match(/(本周[内五]?|下周[一二三四五六日]?前?|今天[^，。@]*前|明[天早][^，。@]*前|周[一二三四五六日]前?)/) || [])[1];
  registerCommit({ name: label, exec: 'agent', who: '云小助', due: due || '未定', dueT: due ? 'soon' : null,
    sess: key, goal: goalKept ? ctx.goal : undefined,
    linked: goalKept ? '语境继承 · 委派传送门' : undefined, aud: 'all' });
  const pg = GROUPS.find(x => x.head === floorKey);
  if (pg) pg.keys.push(key);
  setTimeout(() => {
    appendItems(floorKey, [
      { type: 'sys', text: '⚡ 主楼委派 → 自成话题根，新话题已创建（边界规则 A0③）' },
      { type: 'topiccard', target: key, meta: 'Bruce 发起 · 2 条 · 刚刚' },
    ]);
    renderSidebar(); renderHead();
    toast(goalKept ? '委派 = 承诺出生：话题卡原地长出，承诺行已挂进目标组（语境继承）——去承诺板看' : '裸 @ = 开新话题：话题卡原地长出，边界行为肉眼可见');
  }, 800);
}

/* 冷会话焐热 */
function warmUp(sessKey) {
  const sess = sessions[sessKey];
  appendItems(sessKey, [
    { type: 'sys', text: '⚡ 识别到公开委派 · 正在建立 Session（topic ↔ session 锚定）…' },
  ], 700);
  setTimeout(() => {
    Object.assign(sess, sess.warm, { status: 'running' });
    delete sess.unread;
    appendItems(sessKey, [
      { type: 'agent-pub', time: nowStr(), kind: 'ack', text: '已接收，正在处理。<b>回复本条消息</b>可在此任务上继续。' },
    ]);
    renderSidebar(); renderHead(); refreshVoiceAvail(); renderRight();
    toast('会话已焐热 → 持久 Session（话题即句柄：同话题的后续 @ 复用同一会话）');
  }, 1700);
}

/* 审批对象剧本 */
function handleCardAction(ccId, act) {
  const sess = sessions.competitor;
  const item = sess.timeline.find(i => i.type === 'confirm' && i.id === ccId);
  if (!item || item.state !== 'pending') return;

  if (act === 'edit') { toast('真实实现：把参数回填进 composer 供修改后重发'); return; }

      { st: 'done', tool: 'sheet table create', desc: '创建「协作能力对比」数据表' },

    ]},

    { type: 'artifact', icon: '🧾', title: '任务过程摘要 #7', meta: '云之家文档 · 做了什么 / 读写了什么，全组可查', pin: 9, pv: 'doc-summary' },
    { type: 'agent-pub', time: nowStr(), kind: 'done', text: '✅ 已完成：对比表与过程摘要已回帖，12 条记录、5 个维度。周一评审前需增删维度，直接在这里说。' },

      { icon: '▦', t: '竞品对比 · 评审表', m: '12 条记录 · 5 维度', pv: 'sheet-review' },
      { icon: '🧾', t: '任务过程摘要 #7', m: '文档 · 全组可查', pv: 'doc-summary' },
    );
    renderSidebar(); renderRight();
    if (state.current === 'competitor') renderHead();
    toast('交付完成：工件已沉淀到右栏「当前」—— 点它就地预览，验收不出屏');
  }, 3800);
}

/* 验收归档 → 记忆蒸馏 */
function handleAccept(acId) {
  /* v4.21 人类承诺的验收卡：验收 = 承诺终态，不归档所在会话（群主楼没有终态） */
  const commitCard = Object.values(sessions).flatMap(s => s.timeline).find(i => i.type === 'accept' && i.id === acId && i.commit);
  if (commitCard) {
    if (commitCard.state === 'done') return;
    commitCard.state = 'done';
    const c = COMMITS.find(x => x.name === commitCard.commit);
    if (c) { c.state = '已验收'; c.receipt = null; }
    renderTimeline(); renderHead(); renderSidebar();
    toast('验收通过 = 人工终态：回写云之家真身（生与死的回写）· 板行退出待决、hub 环行闭合——迟交但已清账');
    return;
  }
  const sessKey = acId.replace('ac-', '');
  const sess = sessions[sessKey];
  const item = sess.timeline.find(i => i.type === 'accept' && i.id === acId);
  if (!item || item.state === 'done') return;
  item.state = 'done';
  appendItems(sessKey, [
    { type: 'sys', text: '🗂 验收通过 · 会话已归档 · 收件箱已清位' },

  sess.status = 'archived';
  sess.preview = '已归档 · 记忆已蒸馏';

function openAgentPanel() {

  } else if (c.cold) {

  }
  $('apanel').innerHTML = `

function showNote(no, anchorRect) {
  const n = NOTES[no];

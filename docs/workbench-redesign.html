<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台重设计 · 原型 v1.1</title>
<style>
/* ───────────────────────── tokens ─────────────────────────
   两族语义色是承重的：蓝 = 别人听得见（公），纸 = 只有你和 agent（私）。
   其余颜色只给异常：琥珀 = 要你 / 不对劲，红 = 逾期/失败，绿 = 刚做完。运行中不是异常，用动效。
   墨 3 在白底与沉底上都 ≥ 4.5:1（12px 元信息也过 WCAG AA）。 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;

  --bg:#FFFFFF;--bg-sunk:#F6F7F9;--bg-hover:#F1F2F5;--bg-press:#E9EBEF;--bg-raised:#FFFFFF;
  --ink:#1D2129;--ink-2:#4E5969;--ink-3:#697180;--ink-4:#C2C7D0;
  --line:#E5E6EB;--line-2:#EFF0F3;
  --pub:#2E63D9;--pub-ink:#1E4FBD;--pub-tint:#EEF3FE;--pub-line:#C9DBFA;
  --pri-bg:#FBF7EE;--pri-rail:#E3D3AE;--pri-ink:#7A5E2E;--pri-line:#ECE2CB;
  --need:#E08A00;--need-ink:#A85A00;--need-bg:#FFF4E0;
  --late:#D92D20;--late-bg:#FDECEA;
  --ok:#12A150;--ok-bg:#E7F6EE;
  --shadow-1:0 1px 2px rgb(16 24 40/6%);
  --shadow-2:0 12px 32px rgb(16 24 40/16%),0 1px 3px rgb(16 24 40/8%);
  --demo:#14161A;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#18191C;--bg-sunk:#131417;--bg-hover:#222327;--bg-press:#2A2C31;--bg-raised:#1E1F23;
  --ink:#E8E9EC;--ink-2:#AEB2BB;--ink-3:#8A909B;--ink-4:#474B54;
  --line:#2B2D32;--line-2:#232529;
  --pub:#6E9BFF;--pub-ink:#9DBBFF;--pub-tint:rgb(110 155 255/12%);--pub-line:rgb(110 155 255/30%);
  --pri-bg:#211E17;--pri-rail:#5C4D2E;--pri-ink:#D8C08A;--pri-line:#3A3324;
  --need:#F5A524;--need-ink:#F7B955;--need-bg:rgb(245 165 36/13%);
  --late:#FF6B5E;--late-bg:rgb(255 107 94/13%);
  --ok:#3CCB7F;--ok-bg:rgb(60 203 127/13%);
  --shadow-2:0 12px 32px rgb(0 0 0/55%),0 0 0 1px #2B2D32;
  --demo:#0B0C0E;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-sunk);color:var(--ink);font:var(--fs-md)/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pub);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
kbd{font:500 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:var(--bg)}
.muted{color:var(--ink-3)}

/* ───────────── demo chrome（不是产品的一部分） ───────────── */
.demobar{height:48px;flex:none;background:var(--demo);color:#C9CDD4;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:var(--fs-sm);position:relative;z-index:55}
.demobar .tag{font:600 12px/1 var(--mono);color:#fff;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.demobar .tag em{font-style:normal;color:#8B93A3;font-weight:400}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.steps::-webkit-scrollbar{display:none}
.step{white-space:nowrap;padding:6px 10px;border-radius:999px;color:#AEB4BF;font-size:var(--fs-sm)}
.step b{font-weight:600;color:#6F7785;margin-right:4px}
.step:hover{background:#23262C;color:#fff}
.step.on{background:#fff;color:#14161A}
.step.on b{color:#14161A}
.demobar .tool{padding:6px 8px;border-radius:8px;color:#AEB4BF;display:flex;gap:6px;align-items:center;white-space:nowrap}
.demobar .tool:hover{background:#23262C;color:#fff}
.story{flex:none;background:#1C1F24;color:#E6E8EC;border-top:1px solid #2A2E35;padding:10px 16px 12px;font-size:var(--fs-md);line-height:1.65;display:flex;gap:14px;align-items:flex-start;position:relative;z-index:55}
.story[hidden]{display:none}
.story .sn{font:600 12px/23px var(--mono);color:#8B93A3;white-space:nowrap}
.story p{margin:0;flex:1;max-width:1100px}
.story p small{display:block;color:#9AA1AD;font-size:var(--fs-sm);margin-top:2px}
.story p small::before{content:"设计 · ";color:#6F7785}
.story .x{color:#8B93A3;padding:2px;align-self:center}
.story .x:hover{color:#fff}
.story .nx{white-space:nowrap;background:#fff;color:#14161A;border-radius:8px;padding:4px 10px;font-size:var(--fs-sm);font-weight:600;align-self:center;margin-left:auto}

/* ───────────── 宿主三栏几何（左 280 / 中 ≥640 / 右 360–520） ───────────── */
.app{position:relative;display:grid;grid-template-columns:280px minmax(0,1fr) var(--rw,360px);flex:1;min-height:0;transition:grid-template-columns .2s ease}
.app[data-right=off]{--rw:0px}
.app[data-right=wide]{--rw:500px}
.left{background:var(--bg-sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.host-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.wordmark{font:700 15px/1 var(--mono);letter-spacing:-.02em}
.wordmark i{font-style:normal;color:var(--pub)}
.host-btn{color:var(--ink-3);padding:4px;border-radius:6px}
.host-btn:hover{background:var(--bg-hover);color:var(--ink)}
.host-new{margin:0 12px 8px;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:var(--fs-sm);color:var(--ink-2)}
.host-new:hover{border-color:var(--ink-4);color:var(--ink)}
.host-foot{padding:10px 16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:var(--fs-sm);display:flex;gap:8px;align-items:center}
main{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.right{background:var(--bg);border-left:1px solid var(--line);min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.app[data-right=off] .right{border-left:0}

/* ───────────── 左栏 ───────────── */
.nav{flex:1;overflow:auto;padding:4px 8px 16px;min-height:0;scrollbar-width:thin}
.jump{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:8px;color:var(--ink-3);font-size:var(--fs-sm);margin-bottom:10px;background:var(--bg-hover)}
.jump:hover{color:var(--ink-2);background:var(--bg-press)}
.jump kbd{margin-left:auto}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;font-size:var(--fs-xs);color:var(--ink-3);font-weight:500}
.sec .n{font-variant-numeric:tabular-nums}
.sec.need{color:var(--need-ink)}
.sec.need .n{background:var(--need);color:#fff;border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-size:11px;font-weight:600}
.sec .kh{font-weight:400;color:var(--ink-3);display:flex;gap:4px;align-items:center}
.nrow{display:grid;grid-template-columns:14px 1fr;gap:2px 8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;align-items:center}
.nrow:hover{background:var(--bg-hover)}
.nrow.on{background:var(--bg-press)}
.nrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-sm)}
.nrow .t b{font-weight:600}
.nrow .m{grid-column:2;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.nrow .m.warn{color:var(--need-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.need{background:var(--need);box-shadow:0 0 0 3px var(--need-bg)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-4);border-top-color:var(--ink-2);display:inline-block;animation:sp 1s linear infinite;flex:none}
.spin.warn{border-color:color-mix(in srgb,var(--need) 35%,transparent);border-top-color:var(--need)}
@keyframes sp{to{transform:rotate(360deg)}}
.zero{display:flex;align-items:center;gap:8px;padding:8px 8px 2px;color:var(--ink-2);font-size:var(--fs-sm)}
.zero .ic{color:var(--ok)}
.autolink{display:block;text-align:left;padding:2px 8px 6px 32px;font-size:var(--fs-xs);color:var(--ink-3);width:100%}
.autolink:hover{color:var(--ink)}
.navlink{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:var(--fs-sm);color:var(--ink)}
.navlink:hover{background:var(--bg-hover)}
.navlink.on{background:var(--bg-press);font-weight:500}
.navlink .ic{color:var(--ink-3)}
.navlink .r{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.navlink .r.late{color:var(--late);font-weight:500}
.place{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;font-size:var(--fs-sm);text-align:left}
.place:hover{background:var(--bg-hover)}
.place.on{background:var(--bg-press);font-weight:500}
.place .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .r{display:flex;gap:6px;align-items:center;font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.gicon{width:22px;height:22px;border-radius:6px;background:var(--bg-press);color:var(--ink-2);display:grid;place-items:center;flex:none}
.gicon .ic{width:13px;height:13px}
.sub{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px 5px 40px;border-radius:8px;font-size:var(--fs-sm);color:var(--ink-2);text-align:left;position:relative}
.sub::before{content:"";position:absolute;left:19px;top:0;bottom:0;border-left:1px solid var(--line)}
.sub:hover{background:var(--bg-hover);color:var(--ink)}
.sub.on{background:var(--bg-press);color:var(--ink);font-weight:500}
.sub .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cold{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;font-size:var(--fs-sm);color:var(--ink-3)}
.cold:hover{background:var(--bg-hover);color:var(--ink-2)}
.cold .ic{margin-left:auto}
.unread{font-size:11px;color:var(--ink-3)}

.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none;letter-spacing:0}
.av.s{width:22px;height:22px;font-size:11px}
.av.xs{width:18px;height:18px;font-size:10px}
.av.ai{background:linear-gradient(135deg,#5B7CFA,#8E63F5)}
.av.ai .ic{width:60%;height:60%;stroke:#fff;fill:#fff;stroke-width:1}

/* ───────────── 中栏 ───────────── */
.mh{display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;border-bottom:1px solid var(--line-2);flex:none}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.crumb .up{color:var(--ink-3);font-size:var(--fs-md);white-space:nowrap}
.crumb .up:hover{color:var(--ink)}
.crumb .sl{color:var(--ink-4)}
.crumb h1{font-size:var(--fs-lg);font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sub2{font-size:var(--fs-sm);color:var(--ink-3);white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-3);padding:4px 6px 4px 2px;border-radius:6px;margin-left:-6px;white-space:nowrap}
.back:hover{background:var(--bg-hover);color:var(--ink)}
.status{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-2);padding:4px 8px;border-radius:8px;white-space:nowrap}
.status:hover{background:var(--bg-hover)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--bg-hover);color:var(--ink)}

.streamwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ptrpill{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 12px;border-radius:999px;background:var(--bg-raised);border:1px solid color-mix(in srgb,var(--need) 45%,var(--line));box-shadow:var(--shadow-2);font-size:var(--fs-sm);white-space:nowrap;max-width:80%}
.ptrpill[hidden]{display:none}
.ptrpill b{color:var(--need-ink);font-weight:600}
.ptrpill span{overflow:hidden;text-overflow:ellipsis}
.stream{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
.sw{max-width:760px;margin:0 auto;padding:12px 24px 40px}
.day{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:var(--fs-xs);margin:18px 0 6px}
.day::before,.day::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.msg{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:6px 8px;margin:0 -8px;border-radius:10px}
.msg.flash{animation:mfl 1.8s ease}
@keyframes mfl{0%,55%{background:var(--need-bg)}100%{background:transparent}}
.msg .who{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-sm)}
.msg .who b{font-weight:600}
.msg .who time{color:var(--ink-3);font-size:var(--fs-xs)}
.msg .who .aud{font-size:var(--fs-xs);color:var(--ink-3)}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.mention{color:var(--pub);font-weight:500}
.ack{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px 4px 6px;border-radius:8px;background:var(--bg-sunk);font-size:var(--fs-sm);color:var(--ink-2)}
.ack .ic{color:var(--ok)}
.ack button{color:var(--ink-3);margin-left:2px}
.ack button:hover{color:var(--pub)}
.band{margin:10px -14px;padding:6px 14px 8px;background:var(--pri-bg);border-radius:12px;box-shadow:inset 3px 0 0 var(--pri-rail)}
.band-h{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--pri-ink);padding:4px 0 2px;font-weight:500}
.work{margin:4px 0 4px 40px;border-radius:10px;font-size:var(--fs-sm)}
.work summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2);padding:4px 8px;margin-left:-8px;border-radius:8px;width:max-content;max-width:100%}
.work summary.warn{color:var(--need-ink);font-weight:500}
.work summary::-webkit-details-marker{display:none}
.work summary:hover{background:var(--bg-hover)}
.work summary .ic.chev{transition:transform .15s}
.work[open] summary .ic.chev{transform:rotate(90deg)}
.work ol{list-style:none;margin:4px 0 2px;padding:0 0 0 2px}
.work li{display:flex;align-items:center;gap:10px;padding:3px 0;color:var(--ink-2)}
.work li code{margin-left:auto;font:11.5px/1 var(--mono);color:var(--ink-3)}
.work li .ic{color:var(--ok)}
.work li.run{color:var(--ink)}
.work li.wait,.work li.stall{color:var(--need-ink)}
.work li.todo{color:var(--ink-3)}
.work .full{color:var(--ink-3);font-size:var(--fs-xs);margin:2px 0 0 0}
.work .full:hover{color:var(--pub)}
.stallbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 4px;padding:8px 10px;border-radius:8px;background:var(--need-bg);font-size:var(--fs-xs);color:var(--need-ink)}
.stallbar span{flex:1;min-width:160px}
.ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-4);flex:none}

.art{display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;max-width:440px;background:var(--bg-raised)}
.art .fi{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--pub-tint);color:var(--pub);flex:none}
.art .fi.sheet{background:var(--ok-bg);color:var(--ok)}
.art .an{flex:1;min-width:0}
.art .an b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .an span{font-size:var(--fs-xs);color:var(--ink-3)}
.art .acts{display:flex;gap:4px}

/* ───────────── 卡：一套语法 ───────────── */
.card{margin:10px 0 10px 40px;border:1px solid var(--line);border-radius:14px;background:var(--bg-raised);box-shadow:var(--shadow-1);overflow:hidden;scroll-margin:120px}
.card.open{border-color:color-mix(in srgb,var(--need) 45%,var(--line))}
.card.focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--need) 28%,transparent),var(--shadow-1)}
.card.flash{animation:fl 1.4s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 5px color-mix(in srgb,var(--need) 30%,transparent)}100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--need) 28%,transparent)}}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--need-ink);white-space:nowrap}
.ch .wait{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.ch .vis{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);display:flex;gap:4px;align-items:center;white-space:nowrap}
.ct{padding:6px 16px 0;font-size:var(--fs-lg);font-weight:600;line-height:1.45}
.cwhy{padding:4px 16px 0;color:var(--ink-2);font-size:var(--fs-sm)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 16px 0;padding:12px 14px;background:var(--bg-sunk);border-radius:10px;font-size:var(--fs-sm)}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0}
.cf{display:flex;align-items:center;gap:8px;padding:14px 16px;flex-wrap:wrap}
.cf .also{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:var(--fs-sm);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg-hover);border-color:var(--ink-4)}
.btn kbd{font-size:10.5px;padding:1px 4px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.btn.pri kbd{background:transparent;color:inherit;opacity:.6;border-color:currentColor}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--ink)}
.btn.danger{color:var(--late)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-xs)}
.btn[disabled]{opacity:.45;pointer-events:none}
.items{margin:12px 16px 0;border:1px solid var(--line-2);border-radius:10px}
.item{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item.focus{background:var(--bg-sunk)}
.item .num{font:600 12px/20px var(--mono);color:var(--ink-3)}
.item .it{font-weight:500}
.item .id{grid-column:2;font-size:var(--fs-sm);color:var(--ink-2)}
.item .opts{grid-column:2;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.opt{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:6px;background:var(--bg)}
.opt:hover{border-color:var(--ink-4)}
.opt kbd{font-size:10px;padding:0 3px;border-bottom-width:1px}
.opt.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.sel kbd{color:inherit;border-color:currentColor;background:transparent;opacity:.6}
.strip{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--need-bg);font-size:var(--fs-sm);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip p{margin:0;flex:1;min-width:200px}
.reason{margin:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.reason textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none}
.reason textarea:focus{border-color:var(--pub)}
.reason .rf{display:flex;gap:8px;align-items:center}
.reason .rf span{font-size:var(--fs-xs);color:var(--ink-3);margin-right:auto}
.lease{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:8px 12px;border-radius:10px;background:var(--pub-tint);font-size:var(--fs-sm);color:var(--ink-2);flex-wrap:wrap}
.lease .ic{color:var(--pub)}
.lease button{color:var(--pub);font-weight:600}
.leasebox{margin:12px 16px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--pub-line);font-size:var(--fs-sm)}
.leasebox p{margin:0 0 4px}
.leasebox small{display:block;color:var(--ink-3);font-size:var(--fs-xs);margin-bottom:10px}
.leasebox .rf{display:flex;gap:8px;justify-content:flex-end}
.absorbed{display:flex;align-items:center;gap:8px;margin:6px 0 6px 40px;padding:8px 12px;border-radius:10px;background:var(--bg-sunk);font-size:var(--fs-sm);color:var(--ink-2)}
.absorbed .ic{color:var(--ok)}
.absorbed b{font-weight:500;color:var(--ink)}
.absorbed time{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.absorbed.pending{border:1px dashed var(--ink-4)}
.absorbed .undo{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.absorbed .undo button{color:var(--pub);font-weight:600}
.nextbtn{display:flex;align-items:center;gap:8px;margin:0 0 8px 40px;padding:8px 12px;border-radius:10px;font-size:var(--fs-sm);color:var(--ink-2);width:calc(100% - 40px);text-align:left;border:1px solid var(--line-2);background:var(--bg)}
.nextbtn:hover{background:var(--need-bg);color:var(--ink)}
.nextbtn b{color:var(--need-ink);font-weight:600}
.nextbtn kbd{margin-left:auto}
.nextbtn.zero{color:var(--ink-3)}
.nextbtn.zero .ic{color:var(--ok)}

.tcard{display:flex;align-items:center;gap:12px;margin:8px 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;background:var(--bg-raised)}
.tcard:hover{border-color:var(--ink-4)}
.tcard .tn{flex:1;min-width:0}
.tcard .tn b{display:block;font-weight:500}
.tcard .tn span{font-size:var(--fs-xs);color:var(--ink-3)}
.tcard .tsig{font-size:var(--fs-xs);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
.tcard .tsig.need{color:var(--need-ink);font-weight:600}
.tcard .tsig.warn{color:var(--need-ink)}

/* ───────────── composer ───────────── */
.composer{flex:none;padding:0 24px 18px}
.cw{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);transition:border-color .15s,background .15s,box-shadow .15s}
.composer.pri .cw{background:var(--pri-bg);border-color:var(--pri-line)}
.composer.pri .cw:focus-within{border-color:var(--pri-rail);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri-rail) 30%,transparent)}
.composer.pub .cw{border-color:var(--pub-line)}
.composer.pub .cw:focus-within{border-color:var(--pub);box-shadow:0 0 0 3px var(--pub-tint)}
.composer.ask .cw{border-style:dashed}
.composer.risk .cw{border-color:color-mix(in srgb,var(--need) 60%,var(--line))}
.cchip{display:flex;align-items:center;gap:8px;margin:10px 12px 0;padding:6px 10px;border-radius:8px;background:var(--bg-sunk);font-size:var(--fs-sm);color:var(--ink-2)}
.cchip .ic{color:var(--ink-3)}
.cchip b{font-weight:500;color:var(--ink)}
.cchip .x{margin-left:auto;color:var(--ink-3)}
.cchip .x:hover{color:var(--ink)}
.cchip.reg .ic{color:var(--ok)}
.cchip.risk{background:var(--need-bg);color:var(--need-ink)}
.cchip.risk .ic{color:var(--need-ink)}
.cchip .go{margin-left:auto;color:var(--pub);font-weight:600;white-space:nowrap}
.cchip .fix{color:var(--ink-3);margin-left:4px}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:12px 14px 4px;min-height:52px;max-height:200px;line-height:1.6}
.composer textarea::placeholder{color:var(--ink-3)}
.cbar{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
.aud{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 9px;border-radius:999px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap}
.composer.pri .aud{background:color-mix(in srgb,var(--pri-rail) 35%,transparent);color:var(--pri-ink)}
.composer.pub .aud{background:var(--pub-tint);color:var(--pub-ink)}
.composer .aud.risk{background:var(--need-bg);color:var(--need-ink)}
.aud .ic.chev{width:12px;height:12px;opacity:.7}
.tog{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:999px;font-size:var(--fs-xs);color:var(--ink-3)}
.tog:hover{background:var(--bg-hover);color:var(--ink-2)}
.tog.on{background:var(--ink);color:var(--bg)}
.cbar .sp{flex:1}
.send{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.composer.pri .send{background:var(--pri-ink);color:var(--pri-bg)}
.composer.pub .send{background:var(--pub);color:#fff}
.send[disabled]{opacity:.4;cursor:default}
.audmenu{position:absolute;z-index:30;width:320px;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px}
.audmenu button{display:grid;grid-template-columns:20px 1fr auto;gap:2px 10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;align-items:center}
.audmenu button:hover,.audmenu button.on{background:var(--bg-hover)}
.audmenu b{font-weight:500;font-size:var(--fs-sm)}
.audmenu span{grid-column:2;font-size:var(--fs-xs);color:var(--ink-3)}
.audmenu .ic.ck{color:var(--pub)}

/* ───────────── 承诺 ───────────── */
.board .sw,.goalp .sw{max-width:960px}
.seg{display:inline-flex;padding:3px;background:var(--bg-hover);border-radius:10px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:var(--fs-sm);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1)}
.seg button.mine.on{background:var(--pri-bg);color:var(--pri-ink)}
.today{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.tchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--bg-sunk);font-size:var(--fs-sm);color:var(--ink-2)}
.tchip:hover{background:var(--bg-hover);color:var(--ink)}
.tchip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tchip.late b{color:var(--late)}
.tchip.need b{color:var(--need-ink)}
.grp{margin-top:28px}
.gh{display:flex;align-items:baseline;gap:12px;padding:0 8px 8px;border-bottom:1px solid var(--line-2)}
.gh .gt{font-size:var(--fs-lg);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.gh button.gt:hover{color:var(--pub)}
.gh .gm{font-size:var(--fs-sm);color:var(--ink-3)}
.gh .gc{margin-left:auto;font-size:var(--fs-sm);color:var(--ink-3);white-space:nowrap}
.gh .gc .late{color:var(--late)}
.crit{padding:8px 8px 4px;font-size:var(--fs-sm);color:var(--ink-2)}
.crit b{font-weight:500;color:var(--ink-3);margin-right:8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;cursor:pointer;position:relative}
.row:hover,.row.sel{background:var(--bg-hover)}
.row.sel{box-shadow:inset 3px 0 0 var(--ink)}
.row .rt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm .gtag{color:var(--ink-2)}
.sig{font-size:var(--fs-sm);white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sig.need{color:var(--need-ink);font-weight:600}
.sig.late{color:var(--late);font-weight:600}
.sig.stale,.sig.said{color:var(--need-ink)}
.sig.done{color:var(--ok)}
.sig.run{color:var(--ink-2)}
.row .verbs{display:none;gap:4px;align-items:center}
.row:hover .verbs{display:flex}
.row:hover .sig.hideable{display:none}
.fold{margin:6px 8px 0;font-size:var(--fs-sm);color:var(--ink-3);display:inline-flex;gap:4px;align-items:center;margin-right:14px}
.fold:hover{color:var(--ink)}
.row.done .rt{color:var(--ink-3);font-weight:400}
.whohead{display:flex;align-items:center;gap:10px;padding:0 8px 8px;border-bottom:1px solid var(--line-2)}
.whohead b{font-size:var(--fs-lg);font-weight:600}
.whohead span{font-size:var(--fs-sm);color:var(--ink-3)}

.hero{padding:24px 0 8px}
.eyebrow{font-size:var(--fs-sm);color:var(--ink-3);display:flex;gap:8px;align-items:center}
.hero h1{font-size:var(--fs-2xl);margin:6px 0 10px;font-weight:650;letter-spacing:-.01em}
.hero .crit2{font-size:var(--fs-md);color:var(--ink);padding:12px 14px;background:var(--bg-sunk);border-radius:10px}
.hero .crit2 b{color:var(--ink-3);font-weight:500;margin-right:10px;font-size:var(--fs-sm)}
.gfacts{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.gfacts span b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.gfacts .late b{color:var(--late)}
.gfacts a{color:var(--pub);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.alert{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--need-bg);font-size:var(--fs-sm)}
.alert .ic{color:var(--need-ink)}
.alert p{margin:0;flex:1}
.gacts{display:flex;gap:8px;margin-top:16px}
.h3{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);margin:28px 0 6px;padding:0 8px;display:flex;gap:8px;align-items:center}
.h3 .n{color:var(--ink-3);font-weight:400}
.ptrrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;width:100%;text-align:left}
.ptrrow:hover{background:var(--need-bg)}
.ptrrow b{font-weight:600;color:var(--need-ink)}
.ptrrow .pm{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3)}

.judg{background:var(--pri-bg)}
.judg .mh{border-color:var(--pri-line)}
.jnote{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--pri-ink);margin:16px 0 0}
.jg{margin-top:26px}
.jg h4{margin:0 0 4px;font-size:var(--fs-md);font-weight:600}
.jg .line{font-size:var(--fs-sm);color:var(--ink-2)}
.jg .line b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pledge{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--pri-line)}
.pledge q{quotes:"「" "」";font-weight:500}
.pledge .pm{font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px}
.pledge .ps{margin-left:auto;font-size:var(--fs-xs);color:var(--pri-ink);white-space:nowrap}

/* ───────────── 右栏 ───────────── */
.rh{display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;border-bottom:1px solid var(--line-2);flex:none}
.rh h2{font-size:var(--fs-md);font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px}
.tabs button{height:28px;padding:0 10px;border-radius:7px;font-size:var(--fs-sm);color:var(--ink-3)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--bg-hover);color:var(--ink);font-weight:500}
.rb{flex:1;overflow:auto;padding:12px 16px 24px;min-height:0}
.olist{display:flex;flex-direction:column;gap:2px}
.orow{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;text-align:left;width:100%}
.orow:hover{background:var(--bg-hover)}
.orow .fi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--pub-tint);color:var(--pub);flex:none}
.orow .fi.sheet{background:var(--ok-bg);color:var(--ok)}
.orow .on2{flex:1;min-width:0}
.orow .on2 b{display:block;font-weight:500;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .on2 span{display:block;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .go{color:var(--ink-4)}
.mem{padding:10px 8px;border-radius:10px;display:flex;gap:10px}
.mem:hover{background:var(--bg-hover)}
.mem p{margin:0;font-size:var(--fs-sm);flex:1}
.mem span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px}
.mem button{color:var(--ink-3);align-self:flex-start}
.mem button:hover{color:var(--late)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);font-size:var(--fs-sm)}
.empty .ic{width:22px;height:22px;color:var(--ink-4);margin-bottom:6px}
.empty .eg{margin:12px auto 0;max-width:240px;text-align:left;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:var(--fs-xs)}
.insp-h{display:flex;gap:12px;align-items:flex-start;padding:4px 0 14px}
.insp-h .it{font-size:var(--fs-lg);font-weight:600;line-height:1.4}
.insp-h .im{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.insp-h .im .late{color:var(--late);font-weight:600}
.insp-h .im .warn{color:var(--need-ink);font-weight:500}
.isec{padding:14px 0;border-top:1px solid var(--line-2)}
.isec h4{margin:0 0 8px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-3)}
.quote{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg-sunk);font-size:var(--fs-sm)}
.quote cite{display:block;font-style:normal;font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px}
.inote{font-size:var(--fs-xs);color:var(--ink-3);margin-top:8px}
.inote button{color:var(--pub)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 10px 18px;font-size:var(--fs-sm);color:var(--ink-2)}
.tl li::before{content:"";position:absolute;left:3px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.tl li::after{content:"";position:absolute;left:6px;top:16px;bottom:0;border-left:1px solid var(--line)}
.tl li:last-child::after{display:none}
.tl li.late::before{background:var(--late)}
.tl li.warn::before{background:var(--need)}
.tl li.ev::before{background:var(--ok)}
.tl li time{color:var(--ink-3);margin-right:6px;font-variant-numeric:tabular-nums}
.evbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.iacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;border-top:1px solid var(--line-2)}
.linkrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);padding:6px 0}
.linkrow button{color:var(--pub)}
.prov{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line-2);font-size:var(--fs-xs);color:var(--ink-3);flex:none}
.prov .ic{color:var(--ink-3)}
.prov button{color:var(--pub);text-align:left}
.pv{flex:1;overflow:auto;padding:24px 28px 40px;min-height:0;background:var(--bg)}
.pv h1{font-size:20px;margin:0 0 4px}
.pv h2{font-size:15px;margin:22px 0 6px}
.pv p,.pv li{font-size:14px;color:var(--ink-2);line-height:1.75}
.pv .meta{font-size:var(--fs-xs);color:var(--ink-3)}
.pvbar{display:flex;gap:6px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2);flex:none;background:var(--bg)}
.pvbar span{font-size:var(--fs-xs);color:var(--ink-3);margin-right:auto}

/* ───────────── overlays ───────────── */
.scrim{position:fixed;inset:0;background:rgb(10 12 16/35%);z-index:50;display:grid;place-items:start center;padding-top:calc(var(--apptop,48px) + 6vh)}
.pal{width:min(620px,calc(100vw - 32px));background:var(--bg-raised);border-radius:16px;box-shadow:var(--shadow-2);overflow:hidden;border:1px solid var(--line)}
.pal input{width:100%;border:0;outline:none;background:transparent;padding:16px 18px;font-size:var(--fs-lg);border-bottom:1px solid var(--line-2)}
.pal .pl{max-height:420px;overflow:auto;padding:6px}
.pal .pg{font-size:var(--fs-xs);color:var(--ink-3);padding:10px 12px 4px;font-weight:500}
.pal .pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:9px;text-align:left;font-size:var(--fs-sm)}
.pal .pi .ic{color:var(--ink-3)}
.pal .pi .pr{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.pal .pi.on{background:var(--bg-hover)}
.pal .pf{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line-2);font-size:var(--fs-xs);color:var(--ink-3)}
.modal{width:min(560px,calc(100vw - 32px));background:var(--bg-raised);border-radius:16px;box-shadow:var(--shadow-2);border:1px solid var(--line);max-height:76vh;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.modal header h2{margin:0;font-size:var(--fs-lg);font-weight:600;flex:1}
.modal header p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--ink-3);font-weight:400}
.modal .mb{overflow:auto;padding:6px 20px 18px}
.rule{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line-2);font-size:var(--fs-sm)}
.rule:first-child{border-top:0}
.rule dt{color:var(--ink-3)}
.rule dd{margin:0}
.rule dd .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:var(--fs-xs);font-weight:600}
.rule ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.rule details summary{color:var(--ink-3);font-size:var(--fs-xs);cursor:pointer;margin-top:6px}
.rule code{font:11.5px var(--mono);color:var(--ink-3)}
.lease-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line-2);font-size:var(--fs-sm);align-items:start}
.arow:first-child{border-top:0}
.arow time{color:var(--ink-3);font-variant-numeric:tabular-nums}
.arow .ar{font-size:var(--fs-xs);color:var(--ink-3);grid-column:2;margin-top:2px}
.arow .btn{grid-row:1/3;grid-column:3}
.menu{position:absolute;z-index:30;min-width:220px;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;font-size:var(--fs-sm);text-align:left}
.menu button:hover{background:var(--bg-hover)}
.menu button .ic{color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.toast{position:fixed;left:50%;top:calc(var(--apptop,48px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:var(--fs-sm);box-shadow:var(--shadow-2);z-index:60;display:flex;gap:12px;align-items:center;animation:tin .18s ease}
.toast button{color:inherit;opacity:.75;font-weight:600}
.toast button:hover{opacity:1}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}}

let D = seed()
const S0 = () => ({view:{kind:'topic', id:'t-compete'}, back:[], focus:null, itemFocus:0, sel:null, lens:'all',
  aud:'pri', ask:false, draft:'', drafted:null, preview:null, rtab:'out', viewed:{}, strip:{}, reason:{}, open:{}, leaseOpen:false, lastDone:null, stepIdx:-1})

const placeName = id => { const p = D.places[id]; return p.kind === 'dm' ? PEOPLE[p.person].name : p.name }
const placeShort = id => D.places[id].kind === 'dm' ? '私聊' : D.places[id].name
const topicPlace = tid => D.topics[tid].place
const openCards = () => Object.entries(D.cards).filter(([,c]) => c.state === 'open').sort((a,b) => a[1].rank - b[1].rank).map(([id]) => id)
const running = () => Object.entries(D.topics).filter(([,t]) => t.running).map(([id]) => id)
const topicNeeds = tid => openCards().filter(c => D.cards[c].topic === tid)
const placeNeeds = pid => openCards().filter(c => topicPlace(D.cards[c].topic) === pid)
const lateCount = () => D.commits.filter(k => k.st === 'late').length
const waitLine = c => `${PEOPLE[c.wait.who].name}等你 ${c.wait.since}${c.wait.for ? ' · '+c.wait.for : ''}`

function renderNav(){
  const v = S.view, needs = openCards(), run = running()
  let h = `<button class="jump" data-act="palette">${ic('search')}跳到…<kbd>⌘K</kbd></button>`
  h += `<div class="sec need"><span>要你</span>${needs.length ? `<span class="kh"><kbd>N</kbd><span class="n">${needs.length}</span></span>` : ''}</div>`
  if (!needs.length){
    h += `<div class="zero">${ic('check')}都处理完了</div><button class="autolink" data-act="auto">今天云小助按你的规矩自己办了 ${D.auto.length} 件 ›</button>`
  }
  for (const cid of needs){
    const c = D.cards[cid], on = (v.kind==='topic' && v.id===c.topic && S.focus===cid) ? ' on' : ''
    h += `<button class="nrow${on}" data-card="${cid}" title="${esc(c.wait.text)}"><span class="dot need"></span><span class="t"><b>${c.verb}</b>　${esc(c.short)}</span><span class="m">${esc(waitLine(c))}</span></button>`
  }
  if (run.length){
    h += `<div class="sec"><span>运行中</span><span class="n">${run.length}</span></div>`
    for (const tid of run){
      const t = D.topics[tid], on = v.kind==='topic' && v.id===tid ? ' on' : ''
      h += `<button class="nrow${on}" data-topic="${tid}"><span class="spin${t.stall?' warn':''}"></span><span class="t">${esc(t.title)}</span><span class="m${t.stall?' warn':''}">${t.stall ? `第 3 步 · ${t.stall}` : `${esc(placeName(t.place))} · 第 3 步，共 4 步`}</span></button>`
    }
  }
  h += `<div style="height:10px"></div>`
  const late = lateCount()
  h += `<button class="navlink${['board','goal'].includes(v.kind)?' on':''}" data-go="board">${ic('ledger')}承诺<span class="r${late?' late':''}">${late?late+' 逾期':''}</span></button>`
  h += `<div class="sec"><span>云之家</span></div>`
  for (const pid of D.order){
    const p = D.places[pid], pn = placeNeeds(pid).length
    const active = (v.kind==='place' && v.id===pid) || (p.direct && v.kind==='topic' && v.id===p.direct)
    const icon = p.kind==='dm' ? av(p.person,'s') : `<span class="gicon">${ic('hash')}</span>`
    const right = pn ? `<span class="dot need" title="${pn} 件要你"></span>` : (p.unread ? `<span class="unread">${p.unread}</span>` : '')
    h += `<button class="place${active?' on':''}" data-place="${pid}">${icon}<span class="nm">${esc(placeName(pid))}</span><span class="r">${right}</span></button>`
    for (const tid of (p.topics||[])){
      const t = D.topics[tid], tn = topicNeeds(tid).length
      if (!tn && !t.running && !(v.kind==='topic' && v.id===tid)) continue
      const on = v.kind==='topic' && v.id===tid
      const r = tn ? `<span class="dot need"></span>` : t.running ? `<span class="spin${t.stall?' warn':''}"></span>` : ''
      h += `<button class="sub${on?' on':''}" data-topic="${tid}"><span class="nm">${esc(t.title)}</span>${r}</button>`
    }
  }
  h += `<button class="cold" data-act="cold"><span class="gicon" style="opacity:.6">${ic('hash')}</span>${D.cold} 个群未接入${ic('chevR','sm')}</button>`
  h += `<div class="sec"><span>本地</span></div>`
  h += `<button class="place" data-act="local"><span class="gicon">${ic('folder')}</span><span class="nm">dsh-yzj</span></button>`
  $('#nav').innerHTML = h
}

const textHtml = t => esc(t).replace(/@云小助/g,'<span class="mention">@云小助</span>')
function msgHtml(m){
  const p = PEOPLE[m.by]
  let h = `<div class="msg"${m.id?` id="msg-${m.id}"`:''}>${av(m.by)}<div><div class="who"><b>${esc(p.name)}</b><time>${esc(m.at)}</time></div><div class="tx">${textHtml(m.text)}</div>`

  if (m.ack) h += `<div class="ack">${ic('check','sm')}${esc(m.ack)}<button data-act="ackfix">改</button></div>`
  return h + `</div></div>`
}
function artHtml(aid){
  const a = D.arts[aid]
  return `<div class="art"><span class="fi ${a.kind}">${ic(a.kind)}</span><div class="an"><b>${esc(a.title)}</b><span>${esc(artMeta(aid, a))}</span></div><div class="acts"><button class="btn sm" data-preview="${aid}">${ic('cols','sm')}并排看</button><button class="iconbtn" title="在云之家打开">${ic('ext','sm')}</button></div></div>`
}
function workHtml(w){
  const n = w.steps.length, done = w.steps.filter(s => s.s==='ok').length
  const head = w.running
    ? (w.stall ? `<span class="spin warn"></span>云小助在做 · 第 ${done+1} 步，${w.stall}` : `<span class="spin"></span>云小助在做 · 第 ${done+1} 步，共 ${n} 步 <span class="muted">· ${w.dur}</span>`)
    : `${av('ai','xs')}云小助做了 ${n} 步 <span class="muted">· ${w.dur}</span>`
  const li = w.steps.map(s => {
    const mark = s.s==='ok' ? ic('check','sm') : s.s==='run' ? '<span class="spin"></span>' : s.s==='stall' ? '<span class="spin warn"></span>' : s.s==='wait' ? '<span class="dot need"></span>' : '<span class="ring"></span>'
    return `<li class="${s.s}">${mark}<span>${esc(s.text)}</span>${s.tool?`<code>${esc(s.tool)}</code>`:''}</li>`
  }).join('')
  const stall = w.stall ? `<div class="stallbar">${ic('clock','sm')}<span>不是要你拍板——但它可能卡住了。</span><button class="btn sm" data-act="retry">让它重试这一步</button><button class="btn sm ghost" data-act="stop">停下</button></div>` : ''
  return `<details class="work"${w.running?' open':''}><summary class="${w.stall?'warn':''}">${head}${ic('chevR','sm chev')}</summary><ol>${li}</ol>${stall}<button class="full" data-act="trace">看完整过程 ›</button></details>`
}
function absorbedHtml(cid){
  const c = D.cards[cid]
  if (c.state === 'pending'){
    const left = Math.max(1, Math.ceil((pending.until - Date.now())/1000))
    var h = `<div class="absorbed pending">${ic('check')}<span>${c.result}</span><span class="undo"><span class="cd">${left}</span> 秒后生效<button data-act="undo">撤回</button><kbd>Z</kbd></span></div>`
  } else var h = `<div class="absorbed">${ic('check')}<span>${c.result}</span><time>${c.doneAt||'刚刚'}</time></div>`
  if (S.lastDone === cid){
    const nx = openCards()[0]
    h += nx ? `<button class="nextbtn" data-card="${nx}">下一件：<b>${D.cards[nx].verb}</b>${esc(D.cards[nx].short)}<span class="muted">· ${esc(waitLine(D.cards[nx]))}</span><kbd>N</kbd></button>`
            : `<div class="nextbtn zero">${ic('check')}要你的都处理完了</div>`
  }
  return h
}
function cardHtml(cid){
  const c = D.cards[cid]
  if (c.state !== 'open') return absorbedHtml(cid)
  const f = S.focus === cid ? ' focus' : ''
  let h = `<article class="card open${f}" id="card-${cid}" data-cardbox="${cid}">`
  h += `<div class="ch"><span class="ctag"><span class="dot need"></span>要你${c.verb}</span><span class="wait">${esc(c.wait.text)} · ${esc(c.wait.since)}</span>`
  h += `<span class="vis">${ic('lock','sm')}只有你看得到</span></div>`
  h += `<div class="ct">${esc(c.title)}</div><div class="cwhy">${esc(c.why)}</div>`
  if (c.facts) h += `<dl class="facts">${c.facts.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`
  if (c.kind === 'accept') h += `<div style="padding:0 16px">${artHtml(c.art)}</div>`
  if (c.kind === 'decide'){
    h += `<div class="items">${c.items.map((it,i) => `<div class="item${S.focus===cid && S.itemFocus===i?' focus':''}"><span class="num">${i+1}</span><span class="it">${esc(it.t)}</span><span class="id">${esc(it.d)}</span><span class="opts">${it.opts.map((o,j) => `<button class="opt${it.pick===j?' sel':''}" data-pick="${cid}:${i}:${j}"><kbd>${j+1}</kbd>${esc(o)}</button>`).join('')}</span></div>`).join('')}</div>`
  }
  if (c.streak && !D.rules.some(r => r.card===cid)){
    h += S.leaseOpen
      ? `<div class="leasebox"><p>签一条规矩：在「产品讨论群」，往云小助自己新建的表格里写记录，<b>不用再问你</b>。</p><small>30 天后自动到期；删除、覆盖、建群仍然每次都问。随时可以在规则里收回。</small><div class="rf"><button class="btn sm ghost" data-act="leasecancel">算了</button><button class="btn sm pri" data-act="leasesign">${ic('stamp','sm')}签下</button></div></div>`
      : `<div class="lease">${ic('spark','sm')}<span>这类写入你已经连续确认 ${c.streak} 次，一次没撤回。</span><button data-act="leaseopen">以后同类不用问 ›</button></div>`
  }
  if (S.strip[cid]) h += `<div class="strip">${ic('eye')}<p>你还没打开过这份交付。验收前看一眼？</p><button class="btn sm" data-preview="${c.art}">并排看 <kbd>V</kbd></button><button class="btn sm ghost" data-ans="${cid}:force">不看，直接通过</button></div>`
  if (S.reason[cid] !== undefined){
    h += `<div class="reason"><textarea id="reason-${cid}" placeholder="哪里要改？说具体些，${PEOPLE[c.from].name}会照着改。">${esc(S.reason[cid])}</textarea><div class="rf"><span>5 秒后以你的名义发给${PEOPLE[c.from].name}，之前可撤回</span><button class="btn sm ghost" data-ans="${cid}:cancelreason">算了</button><button class="btn sm pri" data-ans="${cid}:sendreason">打回</button></div></div>`
  }
  h += `<div class="cf">`
  if (c.kind === 'confirm'){
    h += c.opts.map(o => `<button class="btn${o.pri?' pri':''}" data-ans="${cid}:${o.k}"><kbd>${o.k}</kbd>${esc(o.label)}</button>`).join('')
    h += `<button class="btn ghost" data-act="params">看参数</button><span class="also">云之家里回 1 / 2 也行</span>`
  } else if (c.kind === 'accept'){
    const seen = S.viewed[c.art]
    if (!seen) h += `<button class="btn pri" data-preview="${c.art}">${ic('cols','sm')}先并排看<kbd>V</kbd></button>`
    h += `<button class="btn${seen?' pri':''}" data-ans="${cid}:1"><kbd>1</kbd>通过验收</button><button class="btn" data-ans="${cid}:2"><kbd>2</kbd>打回…</button>`
    h += `<span class="also">云之家里回「验收」或「打回 原因」也行</span>`
  } else if (c.kind === 'decide'){
    const n = c.items.filter(i => i.pick !== null).length
    h += `<button class="btn pri" data-ans="${cid}:submit"${n<c.items.length?' disabled':''}>定下这 ${c.items.length} 处<kbd>⏎</kbd></button>`
    h += `<span class="muted" style="font-size:12px">${n}/${c.items.length} 已选 · 数字键选，自动跳下一条</span><span class="also">云之家里按顺序回几个数字也行</span>`
  }
  return h + `</div></article>`
}
function streamHtml(items, inPlace){
  let h = '', band = []
  const flush = () => { if (band.length){ h += `<div class="band"><div class="band-h">${ic('lock','sm')}只有你和云小助</div>${band.join('')}</div>`; band = [] } }
  for (const it of items){
    let x
    if (it.t === 'day'){ flush(); h += `<div class="day">${esc(it.text)}</div>`; continue }
    if (it.t === 'msg') x = msgHtml(it)
    else if (it.t === 'work') x = workHtml(it)
    else if (it.t === 'card') x = cardHtml(it.id)
    else if (it.t === 'topic') x = topicCardHtml(it.id)
    const pri = it.aud === 'pri' || it.t === 'card'
    if (pri && !inPlace) band.push(x); else { flush(); h += x }
  }
  flush()
  return h
}
function topicCardHtml(tid){
  const t = D.topics[tid], n = topicNeeds(tid)
  const sig = n.length ? `<span class="tsig need"><span class="dot need"></span>要你${D.cards[n[0]].verb}</span>`
    : t.running ? `<span class="tsig${t.stall?' warn':''}"><span class="spin${t.stall?' warn':''}"></span>${t.stall?'云小助卡住了':'云小助在做'}</span>` : `<span class="tsig">${ic('check','sm')}办完了</span>`
  const count = t.stream.filter(i => i.t==='msg').length
  return `<div class="msg">${av(t.by)}<div><div class="who"><b>${esc(PEOPLE[t.by].name)}</b><time>${esc(t.at.split(' ').pop())}</time><span class="aud">开了一个话题</span></div>
    <button class="tcard" data-topic="${tid}"><span class="gicon">${ic('list')}</span><span class="tn"><b>${esc(t.title)}</b><span>${count} 条 · ${esc(t.at)}</span></span>${sig}${ic('chevR','sm')}</button></div></div>`
}

/* ═════════════════════ composer ═════════════════════ */
let composerCtx = null
const effAud = () => composerCtx?.forcePub ? 'pub' : S.aud
function detectReg(text){
  const who = NAMES.find(n => text.includes(n)); if (!who) return null
  const m = text.match(/(今天|明天|后天|下?周[一二三四五六日天]|\d{1,2}\s*[号日]|\d{1,2}\/\d{1,2})/)
  return m ? {who, due:m[1]} : null
}
function risk(){
  if (S.drafted || S.ask) return null
  const r = detectReg(S.draft); if (!r) return null
  const aud = effAud(), o = composerCtx
  if (aud === 'pri') return {...r, fix: o.kind==='group' ? `改为发到群里` : o.kind==='dm' && PEOPLE[o.person].name===r.who ? `改为发给${r.who}` : null}
  if (o.kind === 'dm' && PEOPLE[o.person].name !== r.who) return {...r, fix:null, dm:true}
  return null
}
function cprevHtml(){
  if (S.drafted){
    const k = D.commits.find(x => x.id===S.drafted)
    return `<div class="cchip">${ic('spark','sm')}<span><b>云小助拟的稿</b> · 改成你的话再发。这是在催「${esc(k.what)}」，不会另记一条。</span><button class="x" data-act="undraft" title="不用这个稿">${ic('x','sm')}</button></div>`
  }
  const rk = risk()
  if (rk) return `<div class="cchip risk">${ic('alert','sm')}<span><b>${rk.who}听不见这句</b>——${rk.dm ? '这是另一个人的私聊' : '只有你和云小助看得见'}，这件事不会算到${rk.who}头上。</span>${rk.fix?`<button class="go" data-act="topub">${rk.fix}</button>`:''}</div>`
  const r = !S.ask && detectReg(S.draft)
  if (r) return `<div class="cchip reg">${ic('check','sm')}<span>发出后会记下：<b>${r.who}负责 · 原话「${esc(r.due)}」</b></span><button class="fix" data-act="ackfix">改</button></div>`
  return ''
}
function cbarHtml(){
  const o = composerCtx, aud = effAud(), rk = risk()
  const label = rk && aud==='pri' ? `仅你和云小助 · ${rk.who}听不见` : aud==='pri' ? (S.ask ? '只问不办 · 仅你和云小助' : '仅你和云小助') : o.pub
  const icon = rk && aud==='pri' ? 'alert' : aud==='pri' ? 'lock' : 'users'
  const send = aud==='pri' ? (S.ask ? '问' : rk ? '仍只发给云小助' : '发给云小助') : o.send
  let h = `<button class="aud${rk&&aud==='pri'?' risk':''}" data-act="aud" title="谁听得见（⌘.）">${ic(icon,'sm')}${esc(label)}${o.forcePub?'':ic('chevD','chev')}</button>`
  h += `<button class="iconbtn" title="提到某人" style="width:28px;height:28px">${ic('at','sm')}</button>`
  if (!o.forcePub) h += `<button class="tog${S.ask?' on':''}" data-act="ask" title="只问不办：云小助只读，不开任务、不动任何东西">${ic('zap','sm')}快问</button>`
  h += `<span class="sp"></span><button class="send" data-act="send"${S.draft.trim()?'':' disabled'}>${esc(send)}<span style="opacity:.6;font-weight:400">⏎</span></button>`
  return h
}
function composerHtml(o){
  composerCtx = o
  const aud = effAud()
  const ph = S.ask ? '问一个数，云小助只读、不动手…' : aud==='pri' ? '对云小助说…' : o.forcePub ? `在${o.place}说点什么…  @云小助 可以叫上它` : o.kind==='dm' ? `对${PEOPLE[o.person].name}说…` : '在群里说点什么…  @云小助 可以叫上它'
  return `<div class="composer" id="composer"><div class="cw"><div id="cprev"></div><textarea id="ta" rows="2" placeholder="${esc(ph)}">${esc(S.draft)}</textarea><div class="cbar" id="cbar"></div></div></div>`
}
function paintComposer(){
  const el = $('#composer'); if (!el) return
  const aud = effAud(), rk = risk()
  el.className = `composer ${S.ask && aud==='pri' ? 'pri ask' : aud}${rk?' risk':''}`
  $('#cprev').innerHTML = cprevHtml()
  $('#cbar').innerHTML = cbarHtml()
}
function wireComposer(){
  const ta = $('#ta'); if (!ta) return
  paintComposer()
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200)+'px' }
  fit()
  ta.addEventListener('input', () => { S.draft = ta.value; fit(); paintComposer() })
  ta.addEventListener('keydown', e => {
    if (e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send() }
    if (e.key==='.' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); toggleAud() }
    if (e.key==='Escape') ta.blur()
  })
}
function toggleAud(){
  if (composerCtx?.forcePub) return
  S.aud = S.aud==='pri' ? 'pub' : 'pri'; S.ask = false
  paintComposer(); $('#ta')?.focus()
}
function send(){
  const text = S.draft.trim(); if (!text) return
  const v = S.view, aud = effAud(), reg = !S.drafted && !S.ask && aud==='pub' && !risk() ? detectReg(text) : null
  const stream = v.kind==='topic' ? D.topics[v.id].stream : D.places[v.id].stream
  stream.push({t:'msg', by:'me', aud, at:'09:21', text, ack: reg ? `记下了：${reg.who}负责 · 原话「${reg.due}」` : undefined})
  if (reg){
    D.commits.push({id:'k'+Date.now(), goal:null, who:pidOf(reg.who), to:'me', what:text.replace(reg.who,'').replace(/[，,。]/g,' ').trim().slice(0,16), dueSaid:reg.due, st:'ok', sig:'', place: v.kind==='topic'?topicPlace(v.id):v.id, topic: v.kind==='topic'?v.id:undefined,
      born:{quote:text, by:'me', at:'刚刚', where:placeName(v.kind==='topic'?topicPlace(v.id):v.id)}, after:[]})
  }
  const wasDraft = S.drafted, ask = S.ask
  S.draft = ''; S.drafted = null
  if (aud==='pri'){
    setTimeout(() => {
      stream.push({t:'msg', by:'ai', aud:'pri', at:'09:21', text: ask ? '目前 12 条里 4 条有价格，另外 8 条等张锐补。（只读，没有动任何东西）' : /^以后/.test(text) ? '记下了，以后在这个群里都照这个来。右边「记忆」里能看到、能删。' : '好的，我照这个来。'})
      render()
    }, 700)
  }
  if (wasDraft){ const k = D.commits.find(x => x.id===wasDraft); k.after.push({at:'刚刚', text:'你催了一次'}); toast(`已发给${PEOPLE[k.who].name}`) }
  else if (aud==='pub') toast(reg ? `已发出 · 记下了：${reg.who}负责` : composerCtx.send.replace('发到','已发到').replace('发给','已发给'))
  render()
}

/* ═════════════════════ 承诺 ═════════════════════ */
const EXC = ['late','need','said','stale','soon','run']
const ORDER = {late:0, need:1, said:2, stale:3, soon:4, run:5, ok:6, done:7}
const sortRows = rs => [...rs].sort((a,b) => ORDER[a.st]-ORDER[b.st])

function foldHtml(key, ok, done){

function sigHtml(k){

/* 决断指针只在卡不在视野里时出现——看得见目标，就不必再指一遍。 */
let io = null
function watchPointer(){
  io?.disconnect()
  const pill = $('#ptrpill'), st = $('#stream'); if (!pill || !st) return
  const ids = S.view.kind==='topic' ? topicNeeds(S.view.id) : []
  if (!ids.length){ pill.hidden = true; return }
  const vis = {}
  io = new IntersectionObserver(es => {
    for (const e of es) vis[e.target.dataset.cardbox] = { seen: e.intersectionRatio > 0.25, above: e.boundingClientRect.top < e.rootBounds.top }
    const off = ids.filter(id => vis[id] && !vis[id].seen)
    if (!off.length){ pill.hidden = true; return }
    const c = D.cards[off[0]]
    pill.hidden = false
    pill.dataset.scroll = off[0]
    pill.innerHTML = `<span class="dot need"></span><b>要你${c.verb}</b><span>${esc(c.short)}</span>${ic(vis[off[0]].above ? 'chevL' : 'chevD','sm')}`
    pill.querySelector('svg:last-child').style.transform = vis[off[0]].above ? 'rotate(90deg)' : ''
  }, {root: st, threshold:[0, .25, 1]})
  ids.forEach(id => { const el = document.getElementById('card-'+id); if (el) io.observe(el) })
}

/* ═════════════════════ answering · 5 秒撤回窗 ═════════════════════
   键盘一按就生效、又收不回，和「主权时刻要稳」相冲。所以每个回答先进 5 秒的待生效：
   卡立刻收成一行（要你立刻少一件），Z 撤回；5 秒后才真的落账、才投到云之家。 */
function stage(cid, summary, toastText, effect){
  if (pending) commitPending()
  const c = D.cards[cid]
  c.state = 'pending'; c.result = summary
  pending = {cid, until: Date.now() + 5000, effect}
  S.lastDone = cid
  if (S.focus === cid) S.focus = null
  toast(toastText + ' · 5 秒内可撤回', true)
  render()
}
function commitPending(){
  const p = pending; pending = null; if (!p) return
  const c = D.cards[p.cid]; c.state = 'done'; c.doneAt = '刚刚'
  p.effect?.()
}
function undo(){
  if (!pending) return
  const cid = pending.cid; pending = null
  const c = D.cards[cid]; c.state = 'open'; c.result = null
  S.focus = cid; S.lastDone = null
  toast('撤回了，卡还在等你')
  render()
  requestAnimationFrame(() => document.getElementById('card-'+cid)?.scrollIntoView({block:'center'}))
}
setInterval(() => {
  if (!pending) return
  const left = Math.ceil((pending.until - Date.now())/1000)
  if (left <= 0){ commitPending(); render() }
  else document.querySelectorAll('.cd').forEach(e => e.textContent = left)
}, 250)

function answer(cid, a){
  const c = D.cards[cid]
  if (c.state !== 'open') return
  if (c.kind === 'confirm'){
    if (a==='1') stage(cid, `你确认了写入 · <b>12 条进「竞品对比 · 评审表」</b>`, '已确认', () => {
      const k = D.commits.find(k => k.id==='k2'); k.st='run'; k.sig='在写'
      D.arts['a-table'].meta = '云小助 · 在写 12 条'
      setTimeout(() => {
        Object.assign(D.arts['a-table'], {meta:'云小助 · 12 条 · 刚刚'})
        D.topics['t-compete'].stream.push({t:'msg', by:'ai', aud:'pub', at:'09:15', text:'写好了：12 条已进「竞品对比 · 评审表」，价格列标了来源日期。', file:'a-table'})
        k.st='ok'; k.sig='交了 · 有文件'
        render()
      }, 1200)
    })
    else if (a==='2') stage(cid, '你选了先不写 · 云小助等你下一句', '先不写')
  }
  if (c.kind === 'accept'){
    if (a==='1' && !S.viewed[c.art]){ S.strip[cid] = true; S.focus = cid; return render() }
    if (a==='1' || a==='force'){
      delete S.strip[cid]
      if (S.preview===c.art) S.preview = null
      stage(cid, `你通过了验收 · <b>Q3 复盘材料初稿</b>`, '已验收', () => {
        const k = D.commits.find(k => k.id==='k7'); k.st='done'; k.sig='验收了'
        D.topics['t-review'].stream.push({t:'msg', by:'ai', aud:'pub', at:'09:20', text:'Bruce 验收通过了 Q3 复盘材料初稿。'})
      })
    }
    if (a==='2'){ S.reason[cid] = ''; delete S.strip[cid]; S.focus = cid; if (S.preview===c.art) S.preview = null; render(); setTimeout(() => $('#reason-'+cid)?.focus(), 30) }
    if (a==='cancelreason'){ delete S.reason[cid]; render() }
    if (a==='sendreason'){
      const r = ($('#reason-'+cid)?.value || '').trim()
      if (!r){ $('#reason-'+cid)?.focus(); return }
      delete S.reason[cid]
      stage(cid, `你打回了 · <b>${esc(r)}</b>`, '已打回', () => {
        D.topics[c.topic].stream.push({t:'msg', by:'me', aud:'pub', at:'09:20', text:`打回：${r}`})
        const k = D.commits.find(k => k.id==='k7'); k.st='ok'; k.sig='打回重做'
      })
    }
  }
  if (c.kind === 'decide' && a==='submit'){
    if (c.items.some(i => i.pick===null)) return
    const sum = {}; c.items.forEach(i => { const p = i.opts[i.pick]; sum[p] = (sum[p]||0) + 1 })
    stage(cid, `你定了 3 处差异 · <b>${Object.entries(sum).map(([k,v]) => `${v} 处${k}`).join('，')}</b>`, '已定', () => {
      const k = D.commits.find(k => k.id==='k5'); k.st='ok'; k.sig='按你定的在改'
    })
  }
}

  const c = D.cards[cid]; c.items[i].pick = j
  S.focus = cid
  const next = c.items.findIndex(x => x.pick===null)
  S.itemFocus = next >= 0 ? next : i
  render()
}

}

  $('#layer').innerHTML = `<div class="scrim" data-act="scrim"><div class="modal" role="dialog"><header><h2>键盘</h2><button class="iconbtn" data-act="close">${ic('x')}</button></header><div class="mb"><dl class="keys">

function showAudMenu(btn){
  const r = btn.getBoundingClientRect(), o = composerCtx
  const isOn = k => k==='ask' ? S.ask : (!S.ask && S.aud===k)
  const opt = (k, icon, title, sub) => `<button class="${isOn(k)?'on':''}" data-setaud="${k}">${ic(icon)}<b>${esc(title)}</b>${isOn(k)?ic('check','sm ck'):'<i></i>'}<span>${esc(sub)}</span></button>`
  $('#layer').innerHTML = `<div style="position:fixed;inset:0;z-index:29" data-act="close"></div><div class="audmenu" style="left:${r.left}px;bottom:${innerHeight-r.top+8}px">
    ${opt('pri','lock','仅你和云小助','群里看不到。云小助照你的话去做。')}
    ${opt('pub','users',o.pub, o.kind==='dm' ? `${PEOPLE[o.person].name}能看见。` : '以你的名义发出。@云小助 才会叫上它。')}

}
function showTrace(){

function saveTheme(){ try { localStorage.setItem('wr-theme', theme) } catch {} }

/* ═════════════════════ 剧本 ═════════════════════ */
const STEPS = [
  {t:'09:12 打开', s:'周三早上，Bruce 打开工作台。左上角「要你」三件事，每一行写着是什么、谁在等他、等了多久：云小助停在写表格前等了 5 分钟（明天评审会要用），李婷等验收结论 13 个小时，郑慧的月结等他定对账口径。底下「运行中」那条是琥珀色——云小助替王超整理路线图，第 3 步 6 分钟没进展。',

    d:'键盘一按就生效太危险，所以每个回答先进 5 秒撤回窗；连续同意同一类事，卡就提议一条由你签的、会到期的规矩——每一次判断都让下一次更少。', run(){ reset(); landOnCard('c-write') }},
  {t:'验收李婷的初稿', s:'李婷昨晚交了 Q3 复盘初稿。验收是 Bruce 的主权时刻：先按 V 并排看，中栏的对话不离场；没看就点「通过」，会多问一句。预览顶上写着这份东西是从哪儿长出来的——点一下回到上周五他让李婷做的那句话。',
    d:'摩擦只留在主权时刻，而且是设计过的：提醒你没看，不是禁止。每个产出都带出处，回答「这东西从哪次讨论长出来」。', run(){ reset(); landOnCard('c-accept') }},
  {t:'对账：谁没动静', s:'打开「承诺」。最上面张锐的价格页数据逾期一天；郑慧说议程「发群里了」，可群里没找到——标成「说交了，没见到东西」。正常的事都收进「其余 2 件正常」。点张锐那一行，右边是原话、谁说的、在哪说的；「催」把 Bruce 送到和张锐的私聊，云小助拟好稿，他改成自己的话再发。',
    d:'板默认只摊开不对劲的；完成要分证据：说了 / 有东西 / 平台记了。区分「做完了」和「只是聊过了」。', run(){ reset(); go({kind:'board'}, {push:false}); S.back=[]; S.sel='k1'; render(false) }},
  {t:'开口前知道谁听得见', s:'回到竞品对比表，Bruce 在私下语态里打了一句「张锐周五前把价格页补上」。还没发，标签就变成琥珀色：张锐听不见这句，这件事不会算到他头上。点「改为发到群里」，提示变成「发出后会记下：张锐负责 · 原话「周五前」」——发出前就看到会记成什么。',
    d:'委派是说一句话就成立的，所以登记要在发出前亮出来、听众风险要在发出前拦下；最小听众律在键盘上兑现。', run(){ reset(); go({kind:'topic', id:'t-compete'}, {push:false}); S.back=[]; S.draft='张锐周五前把价格页补上'; render(false); setTimeout(() => { const ta=$('#ta'); ta?.focus(); ta?.setSelectionRange(ta.value.length, ta.value.length) }, 50) }},
  {t:'清零之后', s:'三件都答完，「要你」清零。清零不是一片空白：它告诉 Bruce 今天云小助按他签过的规矩自己办了 4 件——每件都写着凭哪条规矩，哪件不该自己办，点一下规矩就收紧。',
    d:'复利要看得见：规矩是一次次判断攒下的，所以要你的事会越来越少；而每件「没问你」的事都摊开、可纠正。', run(){ reset(); ['c-write','c-accept','c-recon'].forEach(id => { D.cards[id].state='done'; D.cards[id].result = {'c-write':'你确认了写入 · <b>12 条进「竞品对比 · 评审表」</b>','c-accept':'你通过了验收 · <b>Q3 复盘材料初稿</b>','c-recon':'你定了 3 处差异'}[id]; D.cards[id].doneAt='09:16' }); D.arts['a-table'].meta='云小助 · 12 条 · 09:16'; S.lastDone='c-write'; go({kind:'topic', id:'t-compete'}, {push:false}); S.back=[]; render(false); setTimeout(showAuto, 60) }},
  {t:'⌘K', s:'任何东西——群、人、一个文件、一条承诺、一个目标、一个动作——⌘K 打两个字就到。搜「复盘」，连文件带它从哪儿来的一起出来。',
    d:'不增加入口：⌘K 只是到已有地方的捷径；产出也在里面，回答「结果散落各处，没法归集」。', run(){ closeLayer(); openPalette('复盘') }},
]
function renderSteps(){ $('#steps').innerHTML = STEPS.map((s,i) => `<button class="step${S.stepIdx===i?' on':''}" data-step="${i}"><b>${i+1}</b>${esc(s.t)}</button>`).join('') }
function showStory(i){
  const s = STEPS[i], el = $('#story')
  el.hidden = false
  el.innerHTML = `<span class="sn">${i+1}/${STEPS.length}</span><p>${esc(s.s)}<small>${esc(s.d)}</small></p>${i<STEPS.length-1?`<button class="nx" data-step="${i+1}">下一步</button>`:''}<button class="x" data-act="hidestory" title="收起">${ic('x')}</button>`
}
function runStep(i){ closeLayer(); S.stepIdx = i; showStory(i); syncTop(); STEPS[i].run(); S.stepIdx = i; renderSteps(); syncTop() }
function reset(){ const keep = theme, step = S.stepIdx; pending = null; D = seed(); S = S0(); S.stepIdx = step; theme = keep }

/* ═════════════════════ events ═════════════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-card],[data-topic],[data-place],[data-go],[data-goal],[data-ans],[data-pick],[data-preview],[data-scroll],[data-lens],[data-row],[data-nudge],[data-goto],[data-rtab],[data-step],[data-pi],[data-setaud],[data-fold],[data-jump],[data-prov]')
  if (!t) return
  const d = t.dataset
  if (d.step !== undefined) return runStep(+d.step)
  if (d.pi !== undefined){ const x = palette.items[+d.pi]; closeLayer(); x.run(); return }
  if (d.setaud){ closeLayer(); if (d.setaud==='ask'){ S.ask = true; S.aud = 'pri' } else { S.ask = false; S.aud = d.setaud } paintComposer(); $('#ta')?.focus(); return }
  if (d.card) return landOnCard(d.card)
  if (d.topic) return go({kind:'topic', id:d.topic})
  if (d.place) return openPlace(d.place)
  if (d.go) return go({kind:d.go})
  if (d.goal) return go({kind:'goal', id:d.goal})
  if (d.prov) return openProv(d.prov)
  if (d.ans){ const [cid, a] = d.ans.split(':'); return answer(cid, a) }
  if (d.pick){ const [cid,i,j] = d.pick.split(':'); return pick(cid, +i, +j) }
  if (d.preview){ S.preview = d.preview; S.viewed[d.preview] = true; Object.keys(S.strip).forEach(k => delete S.strip[k]); return render() }
  if (d.scroll){ S.focus = d.scroll; render(); flashEl(document.getElementById('card-'+d.scroll), 'flash'); return }
  if (d.lens){ S.lens = d.lens; S.sel = null; return render(false) }
  if (d.nudge){ e.stopPropagation(); return nudge(d.nudge) }
  if (d.goto){ e.stopPropagation(); return gotoCommit(d.goto) }
  if (d.row){ S.sel = S.sel===d.row ? null : d.row; return render() }
  if (d.rtab){ S.rtab = d.rtab; return renderRight() }
  if (d.fold){ S.open[d.fold] = true; return render() }
  if (d.jump){ const k = D.commits.find(k => k.st===d.jump); if (k){ S.sel = k.id; render(); document.getElementById('row-'+k.id)?.scrollIntoView({block:'center'}) } return }
  switch (d.act){
    case 'palette': return openPalette()
    case 'theme': theme = theme==='dark'?'light':'dark'; saveTheme(); return render()
    case 'reset': reset(); S.stepIdx=-1; $('#story').hidden = true; return render(false)
    case 'keys': return showKeys()
    case 'back': return goBack()
    case 'aud': return showAudMenu(t)
    case 'ask': S.ask = !S.ask; if (S.ask) S.aud='pri'; paintComposer(); $('#ta')?.focus(); return
    case 'topub': S.aud = 'pub'; S.ask = false; paintComposer(); $('#ta')?.focus(); return
    case 'send': return send()
    case 'undraft': S.drafted = null; S.draft = ''; return renderMain()
    case 'undo': return undo()
    case 'closepv': S.preview = null; return render()
    case 'unsel': S.sel = null; return render()
    case 'rules': closeLayer(); return showRules()
    case 'auto': return showAuto()
    case 'trace': closeLayer(); return showTrace()
    case 'menu': return showMenu(t)
    case 'scrim': if (e.target === t) closeLayer(); return
    case 'close': return closeLayer()
    case 'hidestory': $('#story').hidden = true; syncTop(); return
    case 'leaseopen': S.leaseOpen = true; return render()
    case 'leasecancel': S.leaseOpen = false; return render()
    case 'leasesign': S.leaseOpen = false; D.rules.push({text:'在产品讨论群，往云小助新建的表格写记录，不用问', by:'你刚签的', left:'30 天后到期', card:'c-write', saved:0}); toast('签好了 · 30 天后到期 · 这一张还要你答'); return render()
    case 'tighten': t.outerHTML = `<span class="muted" style="grid-row:1/3;grid-column:3;font-size:12px">已收紧，下次先问你</span>`; return
    case 'findev': return toast('（原型）云小助去群里和文件里找议程；找到就挂成证据，找不到就问郑慧要')
    case 'takesaid': return toast('（原型）你认了这句话就算交付——记作「话语回执 · 你认可」')
    case 'retry': return toast('（原型）云小助重试第 3 步')
    case 'stop': return toast('（原型）停下，并在群里说明停在哪一步')
    case 'cold': return toast('（原型）51 个没接入云小助的群，按最近活动列出；接入在群规则里一键完成')
    case 'local': return toast('（原型）本地工作夹：和今天一样，只是换了这套样式')
    case 'meeting': return toast('（原型）右栏打开这场会：材料就绪度、关联的承诺、「为这场会准备」')
    case 'newgoal': return toast('（原型）新目标：先说一句话，云小助起草要件，你签发')
    case 'ackfix': return toast('（原型）就地改：谁负责、原话里的时间、挂哪个目标')
    case 'params': return toast('（原型）展开工具参数原文')
  }
})
document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA/.test(document.activeElement?.tagName)
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); return palette ? closeLayer() : (closeLayer(), openPalette()) }
  if (palette){
    if (e.key==='Escape'){ closeLayer(); return }
    if (e.key==='ArrowDown'){ e.preventDefault(); palette.i = Math.min(palette.i+1, palette.items.length-1); drawPal() }
    if (e.key==='ArrowUp'){ e.preventDefault(); palette.i = Math.max(palette.i-1, 0); drawPal() }
    if (e.key==='Enter'){ e.preventDefault(); const x = palette.items[palette.i]; closeLayer(); x?.run() }
    return
  }
  if (e.key==='Escape' && $('#layer').innerHTML){ closeLayer(); return }
  if (inField){ if (e.key==='Escape') document.activeElement.blur(); return }
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const v = S.view, key = e.key.toLowerCase()
  if (e.key==='Escape'){ if (S.preview){ S.preview=null; return render() } if (S.sel){ S.sel=null; return render() } return goBack() }
  if (e.key==='/'){ e.preventDefault(); $('#ta')?.focus(); return }
  if (e.key==='?') return showKeys()
  if (key==='n') return nextNeed()
  if (key==='z') return undo()
  if (v.kind==='topic'){
    const cards = topicNeeds(v.id)
    if (!S.focus && cards.length===1) S.focus = cards[0]
    const fc = S.focus && D.cards[S.focus]?.state==='open' ? D.cards[S.focus] : null
    if (key==='v' && fc?.art){ S.preview = fc.art; S.viewed[fc.art] = true; delete S.strip[S.focus]; return render() }
    if ((key==='j' || key==='k') && fc?.kind==='decide'){ S.itemFocus = Math.max(0, Math.min(fc.items.length-1, S.itemFocus + (key==='j'?1:-1))); return render() }
    if ((key==='j' || key==='k') && cards.length){
      const i = cards.indexOf(S.focus), n = key==='j' ? Math.min(cards.length-1, i+1) : Math.max(0, i-1)
      S.focus = cards[n<0?0:n]; S.itemFocus = 0; render(); document.getElementById('card-'+S.focus)?.scrollIntoView({block:'center'}); return
    }
    if (/^[1-3]$/.test(e.key) && fc){
      if (fc.kind==='decide'){ const it = fc.items[S.itemFocus]; if (+e.key <= it.opts.length) pick(S.focus, S.itemFocus, +e.key-1); return }
      if (+e.key <= 2) answer(S.focus, e.key)
    }
    if (e.key==='Enter' && fc?.kind==='decide') answer(S.focus, 'submit')
  }
  if (v.kind==='board' || v.kind==='goal'){
    const rows = [...document.querySelectorAll('.row[data-row]')].map(x => x.dataset.row)
    if (key==='j' || key==='k'){
      const i = rows.indexOf(S.sel), n = key==='j' ? Math.min(rows.length-1, i+1) : Math.max(0, i-1)
      S.sel = rows[n<0?0:n]; render(); document.getElementById('row-'+S.sel)?.scrollIntoView({block:'nearest'}); return
    }
    if (e.key==='Enter' && S.sel){ const k = D.commits.find(x => x.id===S.sel); return k.st==='need' ? landOnCard(k.card) : gotoCommit(k.id) }
  }
})

render(false)
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云之家 × DSH · 终极形态 v5 —— P–agent–P′：复利开双账（决策 #60 · v4.25r）</title>
<style>
/* ============================================================
   终极形态 v5 · P–agent–P′ 完整串联沙盘（决策 #60 + v4.25r 七收紧）
   目的：不是演示新功能，而是演示第二本账如何长在第一本账的既有
   节点上——收件箱（逐级兑付+三不入负样本）、群（验收卡）、财务群
   （条尾租约入口→两读分岔）、私语域（既有域承载新对象）、金库
   （四区+换挡台三档位）、承诺板（负样本）。三视角查看者样本。
   ============================================================ */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --ink: #20242C;
  --ink-2: #5A6272;
  --ink-3: #8B93A3;
  --line: #E2E5EA;

  --pub: #2E63D9;
  --pub-deep: #1E4FBD;
  --pub-tint: #EEF4FF;
  --pub-line: #C9DBFA;

  --paper: #FAF6EC;
  --paper-line: #E9DFC8;
  --paper-ink: #6B5A36;
  --paper-deep: #8A6D3B;

  --vault: #F7F3E7;
  --vault-line: #E0D5B8;
  --vault-ink: #5C4A22;

  --amber: #B45309;
  --amber-bg: #FDF1E0;
  --amber-line: #F0D9B4;
  --green: #15803D;
  --green-bg: #E8F6EE;
  --green-line: #C4E6D1;
  --red: #B91C1C;
  --red-bg: #FCECEC;
  --red-line: #F2CBCB;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(24,30,42,.05), 0 4px 16px rgba(24,30,42,.06);
  --shadow-pop: 0 6px 32px rgba(24,30,42,.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13.5px; color: var(--ink); background: var(--bg);
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--pub); outline-offset: 2px; border-radius: 4px; }

/* ---------- 顶栏 ---------- */
.topbar { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #171B22; color: #E8EAEF; }
.wordmark { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
.wordmark em { font-style: normal; color: #7FA7F5; }
.topbar .crumb { font-size: 12.5px; color: #9AA3B5; }
.topbar .crumb b { color: #D5DAE4; font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar a.xlink { font-size: 11.5px; color: #9AA3B5; text-decoration: none; padding: 4px 9px; border: 1px solid #333B48; border-radius: 8px; }
.topbar a.xlink:hover { color: #E8EEFF; border-color: #3E5AA6; }
.viewer-switch { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #9AA3B5; }
.viewer-switch button { padding: 4px 10px; border: 1px solid #333B48; border-radius: 8px; color: #C4CAD6; font-size: 11.5px; }
.viewer-switch button.on { background: #24304A; border-color: #3E5AA6; color: #E8EEFF; }
.annotate-toggle { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #C4CAD6; padding: 5px 10px; border-radius: 8px; border: 1px solid #333B48; }
.annotate-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: #4A5364; }
body.annotate .annotate-toggle { background: #24304A; border-color: #3E5AA6; color: #E8EEFF; }
body.annotate .annotate-toggle .dot { background: #7FA7F5; }

/* ---------- 剧本条 ---------- */
.hintbar { display: flex; align-items: center; gap: 8px; padding: 7px 16px; background: #FFFDF5; border-bottom: 1px solid #EFE8D2; font-size: 11.5px; color: #6B5A36; overflow-x: auto; white-space: nowrap; }
.hintbar .step { padding: 3px 8px; border-radius: 999px; border: 1px solid #E9DFC8; background: #FBF8EE; color: #8A7A50; }
.hintbar .step.on { background: #6B5A36; border-color: #6B5A36; color: #FFFDF5; font-weight: 600; }
.hintbar .step.done { color: #A79B77; text-decoration: line-through; text-decoration-thickness: 1px; }
.hintbar .advance { margin-left: auto; padding: 4px 12px; border-radius: 8px; background: #B45309; color: #fff; font-weight: 600; font-size: 12px; }
.hintbar .advance[disabled] { background: #D9CFAF; cursor: not-allowed; }

/* ---------- 三列布局 ---------- */
.layout { display: flex; height: calc(100% - 46px - 32px); }

/* 侧栏 */
.sidebar { width: 224px; flex: none; background: #F5F6F8; border-right: 1px solid var(--line); padding: 10px 0; overflow-y: auto; }
.sb-sect { padding: 8px 12px 3px; font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); font-weight: 700; }
.sb-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px 7px 16px; font-size: 13px; color: var(--ink-2); text-align: left; border-left: 3px solid transparent; position: relative; }
.sb-row:hover { background: #ECEEF2; }
.sb-row.on { background: #E7EDFB; border-left-color: var(--pub); color: var(--ink); font-weight: 600; }
.sb-row .ava { width: 22px; height: 22px; border-radius: 6px; background: var(--pub-tint); color: var(--pub-deep); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }
.sb-row .ava.pri { background: var(--paper); color: var(--paper-deep); border: 1px solid var(--paper-line); }
.sb-row .ava.att { background: #FDF1E0; color: var(--amber); border: 1px solid var(--amber-line); }
.sb-row .meta { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 400; margin-top: 1px; }
.sb-row .badge-n { margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--amber); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sb-row .badge-n.soft { background: #A8B0C0; }
.sb-note { margin: 10px 14px 0; padding: 8px 10px; border: 1px dashed var(--paper-line); border-radius: 8px; background: #FBF9F1; font-size: 11px; color: var(--paper-deep); line-height: 1.55; }

/* 中栏 */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); position: relative; }
.chead { min-height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chead .t { font-weight: 700; font-size: 14px; }
.chead .sub { font-size: 11.5px; color: var(--ink-3); }
.chead .lock { font-size: 10.5px; color: var(--paper-deep); border: 1px solid var(--paper-line); background: var(--paper); padding: 2px 8px; border-radius: 999px; }
.timeline { flex: 1; overflow-y: auto; padding: 16px 18px 20px; }
.timeline.pri { background: var(--paper); }

/* 消息 */
.msg { display: flex; gap: 10px; margin-bottom: 14px; max-width: 740px; position: relative; }
.msg .ava { width: 30px; height: 30px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #E5E8EE; color: #5A6272; }
.msg .ava.agent { background: #1F2733; color: #7FA7F5; }
.msg .ava.me { background: #E0E9FB; color: var(--pub-deep); }
.msg .body { min-width: 0; flex: 1; }
.msg .who { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; }
.msg .bubble { background: #F3F5F8; border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; line-height: 1.6; font-size: 13px; position: relative; }
.timeline.pri .bubble { background: #FFFDF6; border-color: var(--paper-line); }
.msg .time { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.sysline { text-align: center; font-size: 11px; color: var(--ink-3); margin: 16px 0 14px; }
.sysline b { color: var(--paper-deep); }

/* 卡片 */
.card { border: 1px solid var(--pub-line); background: var(--pub-tint); border-radius: var(--radius); padding: 11px 13px; margin-top: 7px; position: relative; }
.card.paper { border-color: var(--paper-line); background: #FFFDF6; }
.card .chdr { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--pub-deep); font-weight: 700; letter-spacing: .04em; margin-bottom: 6px; flex-wrap: wrap; }
.card.paper .chdr { color: var(--paper-deep); }
.card .ct { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.card .cline { font-size: 12px; color: var(--ink-2); line-height: 1.65; }
.card .provenance { font-size: 11px; color: var(--ink-3); margin: 4px 0 7px; padding-left: 8px; border-left: 2px solid var(--paper-line); }
.privtag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--paper); border: 1px solid var(--paper-line); color: var(--paper-deep); font-weight: 600; }
.anchor { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; padding: 5px 8px; border-radius: 7px; margin-top: 4px; background: rgba(255,255,255,.6); border: 1px solid transparent; line-height: 1.5; }
.anchor .ic { flex: none; font-weight: 700; }
.anchor.ok .ic { color: var(--green); }
.anchor.warn { background: var(--amber-bg); border-color: var(--amber-line); }
.anchor.warn .ic { color: var(--amber); }
.anchor .src { color: var(--ink-3); font-size: 11px; }
.anchor .src a, .jump { color: var(--pub); text-decoration: none; cursor: pointer; }
.cactions { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.btn { padding: 5px 13px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; color: var(--ink-2); }
.btn:hover { border-color: var(--pub); color: var(--pub-deep); }
.btn.primary { background: var(--pub); border-color: var(--pub); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--pub-deep); color: #fff; }
.btn.gold { background: var(--paper-deep); border-color: var(--paper-deep); color: #fff; font-weight: 600; }
.btn.quiet { border-style: dashed; }
.done-strip { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green); font-size: 12px; font-weight: 600; }
.done-strip .sub { display: block; font-weight: 400; color: #3E6B50; font-size: 11px; margin-top: 2px; }
.muted-strip { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: #F4F1E7; border: 1px dashed var(--paper-line); color: var(--paper-deep); font-size: 12px; }
.tail-entry { margin-top: 7px; font-size: 11.5px; }
.tail-entry button { color: var(--paper-deep); border-bottom: 1px dashed var(--paper-line); padding-bottom: 1px; }
@keyframes flashbg { 0% { box-shadow: 0 0 0 3px rgba(180,83,9,.55); } 100% { box-shadow: 0 0 0 3px rgba(180,83,9,0); } }
.flash { animation: flashbg 1.8s ease-out 2; }

/* 预期输入 */
.expect-input { margin-top: 9px; }
.expect-input textarea { width: 100%; min-height: 54px; resize: vertical; border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 12.5px; background: #fff; color: var(--ink); }
.expect-input textarea:focus { outline: 2px solid var(--paper-deep); outline-offset: 1px; }
.chiprow { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.samplechip { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px dashed var(--paper-line); background: #FBF8EE; color: var(--paper-deep); }
.samplechip b { font-weight: 700; }

/* 归因四格 */
.quadgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
.quad { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12px; text-align: left; line-height: 1.4; }
.quad small { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.quad:hover { border-color: var(--paper-deep); }
.qtag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.qtag.q1 { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.qtag.q2 { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }
.qtag.q3 { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-line); }
.qtag.q4 { background: #EDF0F5; color: var(--ink-2); border: 1px solid var(--line); }

/* 收件箱 */
.inbox-wrap { flex: 1; overflow-y: auto; padding: 18px 22px 26px; background: #FAFBFC; }
.ib-head { max-width: 720px; margin: 0 auto 12px; font-size: 12px; color: var(--ink-3); line-height: 1.7; position: relative; }
.ib-head h2 { font-size: 16px; color: var(--ink); margin-bottom: 3px; }
.ib-row { max-width: 720px; margin: 0 auto 9px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 11px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 12.5px; }
.ib-row:hover { border-color: var(--pub-line); }
.ib-row .kind { font-size: 10.5px; font-weight: 700; color: var(--pub-deep); background: var(--pub-tint); border: 1px solid var(--pub-line); padding: 2px 8px; border-radius: 999px; flex: none; }
.ib-row .go { margin-left: auto; color: var(--ink-3); flex: none; font-size: 11.5px; }
.ib-row .src { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.ib-empty { max-width: 720px; margin: 0 auto; padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius); background: #fff; font-size: 12.5px; color: var(--ink-2); line-height: 1.8; position: relative; }

/* 金库 */
.vault-wrap { flex: 1; overflow-y: auto; background: var(--vault); padding: 18px 22px 26px; }
.vault-head { max-width: 780px; margin: 0 auto 14px; }
.vault-head h2 { font-size: 17px; display: flex; align-items: center; gap: 9px; }
.contract-chips { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.cchip { font-size: 10.5px; padding: 2px 9px; border-radius: 999px; background: #EFE8D2; border: 1px solid var(--vault-line); color: var(--vault-ink); font-weight: 600; }
.vsect { max-width: 780px; margin: 0 auto 14px; background: #FFFDF6; border: 1px solid var(--vault-line); border-radius: var(--radius); box-shadow: var(--shadow); }
.vsect .vh { padding: 9px 14px; border-bottom: 1px solid #EFE8D2; font-size: 12px; font-weight: 700; color: var(--vault-ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vsect .vh .n { font-weight: 400; color: var(--ink-3); font-size: 11px; }
.vrow { padding: 9px 14px; border-bottom: 1px solid #F4EEDC; font-size: 12.5px; line-height: 1.6; display: flex; gap: 9px; align-items: flex-start; }
.vrow:last-child { border-bottom: none; }
.vrow .vmeta { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.numdoor { color: var(--pub); text-decoration: none; cursor: pointer; font-weight: 600; background: none; border-bottom: 1px dashed var(--pub-line); }
.vempty { padding: 14px; font-size: 12px; color: var(--paper-deep); line-height: 1.7; }
.refuse-block { max-width: 780px; margin: 0 auto 14px; padding: 12px 14px; border: 1px dashed var(--vault-line); border-radius: var(--radius); background: #FBF8EE; font-size: 12px; color: var(--vault-ink); line-height: 1.75; position: relative; }
.refuse-block b { color: #4A3A16; }
.gearset { display: inline-flex; border: 1px solid var(--vault-line); border-radius: 999px; overflow: hidden; margin-left: auto; flex: none; }
.gearset button { font-size: 10.5px; padding: 3px 10px; color: var(--ink-3); background: #FBF8EE; }
.gearset button + button { border-left: 1px solid var(--vault-line); }
.gearset button.on { background: var(--paper-deep); color: #fff; font-weight: 700; }

/* 承诺板 */
.board-wrap { flex: 1; overflow-y: auto; padding: 18px 22px 26px; background: #F7F8FA; }
.bd-head { max-width: 780px; margin: 0 auto 12px; position: relative; }
.bd-head h2 { font-size: 16px; margin-bottom: 7px; }
.lens-chips { display: flex; gap: 6px; }
.lens-chips button { font-size: 11.5px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); }
.lens-chips button.on { background: var(--pub); border-color: var(--pub); color: #fff; font-weight: 600; }
.bd-group { max-width: 780px; margin: 0 auto 12px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.bd-group .gh { padding: 8px 14px; border-bottom: 1px solid #F0F2F5; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.bd-row { padding: 9px 14px; border-bottom: 1px solid #F5F6F8; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bd-row:last-child { border-bottom: none; }
.bd-row .st { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; flex: none; }
.st.wait { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }
.st.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.st.run { background: var(--pub-tint); color: var(--pub-deep); border: 1px solid var(--pub-line); }
.st.none { background: #F1F3F6; color: var(--ink-3); border: 1px solid var(--line); }
.bd-row .src { flex-basis: 100%; font-size: 10.5px; color: var(--ink-3); }
.bd-row .gchip { font-size: 10.5px; color: var(--pub-deep); background: var(--pub-tint); border: 1px solid var(--pub-line); border-radius: 999px; padding: 1px 8px; }
.bd-row .mine { font-size: 10.5px; color: var(--paper-deep); background: var(--paper); border: 1px solid var(--paper-line); border-radius: 999px; padding: 1px 8px; }
.bd-empty { max-width: 780px; margin: 0 auto; padding: 14px; border: 1px dashed var(--line); border-radius: var(--radius); background: #fff; font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }

/* 右栏 */
.rpanel { width: 300px; flex: none; border-left: 1px solid var(--line); background: #FAFBFC; overflow-y: auto; padding: 14px; }
.rp-title { font-size: 11px; letter-spacing: .1em; font-weight: 700; color: var(--ink-3); margin-bottom: 9px; }
.rp-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; margin-bottom: 11px; font-size: 12px; line-height: 1.65; position: relative; }
.rp-card.paper { background: #FFFDF6; border-color: var(--paper-line); }
.rp-card h4 { font-size: 12.5px; margin-bottom: 6px; }
.cm-row { padding: 6px 0; border-bottom: 1px solid #F0F2F5; font-size: 12px; line-height: 1.5; }
.cm-row:last-child { border-bottom: none; }
.cm-row .src { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.flowline { font-size: 11.5px; color: var(--vault-ink); background: #FBF8EE; border: 1px dashed var(--vault-line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; line-height: 1.8; text-align: center; }

/* 注解 pin */
.pin { display: none; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #B45309; color: #fff; font-size: 10.5px; font-weight: 700; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); z-index: 5; }
.pin.inline { position: static; display: none; width: 17px; height: 17px; vertical-align: 2px; margin-left: 4px; }
body.annotate .pin { display: flex; }
body.annotate .pin.inline { display: inline-flex; }

/* 弹层 */
.popover-mask { display: none; position: fixed; inset: 0; background: rgba(20,24,32,.32); z-index: 40; }
.popover { display: none; position: fixed; z-index: 41; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(580px, 92vw); max-height: 76vh; overflow-y: auto; background: #fff; border-radius: 14px; box-shadow: var(--shadow-pop); padding: 18px 20px; }
body.pop .popover-mask, body.pop .popover { display: block; }
.popover .pno { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: #B45309; color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; margin-right: 8px; }
.popover h3 { font-size: 15px; display: flex; align-items: center; margin-bottom: 10px; }
.popover .pbody { font-size: 13px; line-height: 1.85; color: var(--ink-2); }
.popover .pbody b { color: var(--ink); }
.popover .pclose { position: absolute; top: 12px; right: 14px; font-size: 18px; color: var(--ink-3); }
.caselist .ci { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.6; }
.caselist .ci .m { color: var(--ink-3); font-size: 11px; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(90px); background: #20242C; color: #F2F4F8; font-size: 12.5px; padding: 9px 16px; border-radius: 10px; box-shadow: var(--shadow-pop); transition: transform .25s; z-index: 60; max-width: 82vw; line-height: 1.6; }
#toast.show { transform: translateX(-50%) translateY(0); }

<script>

const S = {

  view: 'inbox',            // inbox | group | fin | dm | vault | board
  accepted: false,
  offer: 'pending',         // pending | input | born | declined
  expectText: null,
  refused: false,
  declined: false,

  tailOpen: false,          // 条尾两读卡展开
  gearBx: 'default',        // 报销族档位
  gearHt: 'default',        // 供应商合同族档位
  gearBreak: 'default',     // 目标拆解族档位
  thursday: false,
  attribution: null,
  zrAttr: null,
  dmUnread: 0,              // 私语未读（消息层：读即清——v4.25r 三不入）
  zrDmUnread: 1,
  boardLens: 'all',
  flashCard: null,
};
const VIEWER = { me: 'Bruce', zhangrui: '张锐', lizong: '李总' };
const QLBL = { q1: '对了·因判断', q2: '对了·因运气', q3: '错了·因判断', q4: '错了·因世界' };

/* ================= 设计注解 ================= */
const NOTES = {
  1: { title: '判别式：增量落在谁身上——不是参与，不是主权',
       body: 'agent–P–agent′ 与 P–agent–P′ 两个回路元素相同、动作相同：人都参与，人都握着批准键。唯一可观察的判据是<b>回路终点谁带着增量归来</b>（C–M–C′ 与 M–C–M′ 的判别法）。此前复利四载体（记忆/工件/流程/信任）全在系统侧——设计给了人<b>不变薄的护栏</b>（三主权时刻、社交摩擦不碰、反剧场），没给<b>变厚的回路</b>。v5 演示的不是新功能，是那条回路如何长在第一本账的既有节点上：验收卡（既有）→ 私语域（既有）→ 条尾租约入口（既有）→ 金库（唯一新面，且住在私语侧）。' },
  2: { title: '温水剧场：P′ 不是人文附加，是可信度的承重墙',
       body: '反剧场推到底：<b>主权时刻的质量依赖主权者的厚度</b>。提案质量越高 → 驳回率越低 → 裁决信息量越低 → 人越不细看 → 三主权时刻退化为三剧场时刻——"可信地完成"自塌。透明救不了：现代圈养不用铁栏用玻璃，轨迹、回执、审计让人<b>观看</b>，观看不是练习。' },
  3: { title: '产婆术条款：agent 只接生，不能代产',
       body: '凡构成判断力的表达——委派内容、成功标准、催办话语、<b>预期与归因</b>、裁决本身——agent 可以提问、结构化、备料、举证，<b>不能代写</b>。它是既有裁决的公分母：磨目标"作者权≠思考伙伴"、预填出处律"内容由人说"、催=拟稿亲发、差距简报"判断由你下"。边界：<b>难度长在真实决断里，不长在仪式里</b>——强制写验收理由=亲手制造对齐表演。试试「帮我写」。' },
  4: { title: '给人修回程律',
       body: '回程律：每条边都有出生与余生。把 P 当图上的节点看——人不断发出裁决边，却没有任何东西回流到人身上：按图自己的记账法，这就是 agent–P–agent′ 的<b>拓扑学定义</b>。<b>校准回执 = 当时裁决 × 后来事实</b>，原料图已天然生产（裁决留痕 × 终态回流），机制近零新增：它只是一个落在私语域的可应答对象（单答家族复用）。' },
  5: { title: '预期 = 对话式立约 · 不可回填 · 疲劳治理',
       body: '预期是<b>可选</b>的一句可证伪的赌注——说出来的，不是表单里填的。<b>不可回填</b>：预期只在裁决时刻出生。agent 只在有出处时开口问一次，不立即按下不表、绝不追问——追问即索要，索要即剧场；<b>连续不立即降频停问</b>（人用脚投票就是应答），重新打开的入口在金库（v4.25r 邀约疲劳治理）。示例句明标"演示装置"（v4.24 出处律）。另注意：<b>不立预期，周四的回执照样会来</b>——裁决本身就是隐式预期。' },
  6: { title: '归因四格：人自己下 · 候选措辞只许证据不许判词',
       body: '归因由<b>人自己下</b>——agent 代归因是产婆术违规。四格防两种自欺：把运气当实力（②被伪装成①）、把误判赖给世界（③被伪装成④）。v4.25r 显示层收紧：候选格的辅助文字只能是<b>证据与假设</b>（"简报③当时已在卡上"），不得是心理判词（"没当回事"=替人写好的归因，违规——本 demo 初版犯过，已改）。' },

  8: { title: '条尾入口 → 两读分岔：既有语法的语义扩员',
       body: '「这类裁决还需要你吗›」就是 v4.15 的条尾租约入口——<b>零新入口</b>，只是分岔从一个出口（租约）扩成两个：连续 23 次通过、中位停留 1.4 秒，两种可能——这类裁决<b>不再需要你</b>（无信息量→租约），或它<b>需要你更多</b>（你不再细看→负重：摆开证据、不预选、无一键通过）。系统只摆证据，两个出口同权，选择在人。注意两读卡是<b>仅你可见的操作者层</b>（证据来自你的私账），不是群消息——组织侧没人知道你在换挡。' },
  9: { title: '金库明拒：无分数、无排名、无画像',
       body: '金库五不做：<b>无分数、无排名、无画像、无建议倾向、无团队视图</b>。金库只陈列判例与对表，结论你自己下。v4.25r 补：<b>P′ 四资产里只有"判断"被机制化</b>——品味与志向的量化明拒（"品味 72 分"是教练剧场，机制化即其死亡）。' },
  10: { title: '验收句：拿走系统的那一天，人比第一天更强',
       body: '杠铃与拐杖的分界：同样是"辅助"，杠铃练厚肌肉，拐杖养出萎缩。<b>搬运的肌肉不值得保留</b>（那是老茧——损耗性摩擦归零是对的）；判断、表达、关系的肌肉萎缩即圈养。可观测版（检验标准⑥）：第六个月的人，敢裁第一天不敢裁的事——"模式"区最后一行就是这句话的证据形态。' },

  12: { title: '摩擦第四类：成长性摩擦（构成性难度）',
       body: '损耗归零、主权保留、社交不碰之外的第四类：<b>难度即内容</b>的事——想清"可验收"、判断交付好坏、开口催人。消灭这类难度，等于消灭它本该生产的那个人。摩擦检验句的第三个答案：有些难度保护的不是主权、不是社交，是<b>人的未来</b>。' },
  13: { title: '私账三不入（v4.25r）——负样本是硬合同的唯一可见证明',
       body: '校准回执/立约邀约/两读卡<b>不进收件箱、不进决断条、不进任何可应答聚合徽标</b>。收件箱是组织的账的唯一聚合处；私账对象的在场方式=私语域<b>未读</b>（消息层语义，读即清——不是"未答数"）与金库本身。未答回执<b>不老化、不可催、不成欠账</b>——这本账的债主是你自己，回执是邀约不是待办。你现在看到的这个空收件箱，就是硬合同的证明：周四回流之后，回执去了私语域，<b>这里没有多出任何一行</b>。' },
  14: { title: '持镜人条款：镜子只能被本人照',
       body: 'agent 只能在<b>人发起</b>的对表/回看/换挡时刻引用金库内容（备料举证），<b>不得把金库模式静默转化为组织侧行为变更</b>——不得因你的误判史替你加门、挡你裁决、调整提案策略。"以帮你成长之名采集行为喂系统"是判别式最阴险的违反形态。本人行为事实（停留时长等）可入私账作镜子的证据，但永不进入组织侧通道与模型调优。agent 是持镜人，不是整容师——所以验收卡不会因为你常跳锚而变严，除非<b>你自己</b>换到负重档。' },
  15: { title: '三档位定律：温水剧场的另一半在生成侧',
       body: '初版两读只守了<b>裁决侧</b>（审批疲劳）。温水的另一半是<b>生成侧萎缩</b>：拆解提案越来越好，人就不再练拆解。所以租约与负重是一根轴的两端：<b>租约</b>（全自动）← <b>默认</b>（agent 提案、人裁决）→ <b>负重</b>（人先手、agent 补充——"我先拆，你再补"，产婆术的可调节形态）。<b>每个提案族都有三档</b>，档位是人的私有设置，金库证据辅助换挡。这不是配置项，是你与系统之间的训练强度旋钮。' },
  16: { title: '收件箱：组织账的唯一聚合处 · 逐级兑付',
       body: '收件箱聚合的是<b>组织侧阻塞待答对象</b>（验收卡、确认卡、裁决卡……），先答先赢、指针投影非复制落座——点行跳回对象原位（语境在场），答完即溶、跨投影生效。它与金库是两本账的两个聚合处：<b>等你裁决的在这里，你裁决过的（与事实的对表）在金库</b>。两处永不混流。' },

       body: '往上翻：磨目标（8/12——注意成功标准②"附竞品对比"正是你亲笔磨出来的，也正是你后来跳过的那条锚——出生故事闭环）、轻问（一次性投影）本来就住在这里。立约邀约与校准回执只是这个域里的两位新住客，<b>零新 surface</b>。' },
  18: { title: '板上零私账：承诺板只对组织的账负责',

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pin(no, style) { return `<button class="pin" data-note="${no}" style="${style}" aria-label="设计注解 ${no}">${no}</button>`; }
function pinIn(no) { return `<button class="pin inline" data-note="${no}" aria-label="设计注解 ${no}">${no}</button>`; }
let toastT = null;
function toast(msg) {
  const t = $('toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200);
}
function openPop(title, bodyHtml, no) {
  $('popTitle').textContent = title; $('popBody').innerHTML = bodyHtml;
  const n = $('popNo');
  if (no) { n.style.display = 'inline-flex'; n.textContent = no; } else n.style.display = 'none';
  document.body.classList.add('pop');
}

/* ================= 剧本条 ================= */
function stepState() {
  if (!S.accepted && !S.bxApproved) return 0;
  if (!S.accepted) return 1;
  if (S.offer === 'pending' || S.offer === 'input') return 2;
  if (!S.bxApproved) return 3;
  if (!S.thursday) return 3;
  if (S.attribution === null) return 4;
  return 5;
}
function renderHintbar() {
  const cur = stepState();
  const steps = [
    '① 收件箱：两件等你（逐级兑付）',
    '② 产品群：验收（跳过一条未消解差距）',
    '③ 私语域：立预期——或不立',
    '④ 财务群：第 24 次确认 → 条尾分岔',
    '⑤ 归因入账 → 金库换挡台',
    '⑥ 承诺板与三视角（负样本）',
  ];
  const advReady = S.accepted && (S.offer === 'born' || S.offer === 'declined') && !S.thursday;
  $('hintbar').innerHTML = steps.map((s, i) =>
    `<span class="step ${i === cur ? 'on' : i < cur ? 'done' : ''}">${s}</span>`).join('') +
    (S.thursday || S.viewAs !== 'me' ? '' :
      `<button class="advance" id="advanceBtn" ${advReady ? '' : 'disabled'}
        title="${advReady ? '推进到周四：评审结果回流' : '先验收，并对预期邀约作出答复（立或不立都行）'}">▸ 到周四 · 评审结果回来</button>`);
  const b = $('advanceBtn');
  if (b) b.onclick = () => {
    if (!advReady) { toast('先完成 ①②③：验收，并对预期邀约作出答复（立或不立都行——回执不依赖预期）。'); return; }
    S.thursday = true; S.dmUnread += 1;
    toast('周四到了：评审结果回流——组织侧登记新一轮；校准回执落在<b>私语域</b>。现在打开收件箱看看：那里没有多出任何一行（私账三不入）。');
    renderAll();
  };
}

/* ================= 收件箱数据 ================= */
function inboxItems() {
  if (S.viewAs !== 'me') return [];
  const items = [];
  if (!S.accepted) items.push({ kind: '验收卡', t: '《Q4 定价方案 v3》待验收 · 张锐的交付主张', src: '产品群 · 承诺「9/1 前给出 Q4 定价方案」', nav: 'group', flash: 'accCard' });
  if (!S.bxApproved) items.push({ kind: '确认卡', t: '报销入账 ¥3,240（王超）· agent 要写的参数', src: '财务群 · 流程「月度报销」实例 #24', nav: 'fin', flash: 'bxCard' });
  return items;
}

/* ================= 侧栏 ================= */
function renderSidebar() {
  const v = S.viewAs;
  const ibN = inboxItems().length;
  const unread = v === 'me' ? S.dmUnread : v === 'zhangrui' ? S.zrDmUnread : 0;
  const finRow = v === 'me' ? `
    <button class="sb-row ${S.view === 'fin' ? 'on' : ''}" data-nav="fin">
      <span class="ava">财</span>
      <span>财务群<span class="meta">主楼 · 流程「月度报销」</span></span>
    </button>` : '';
  $('sidebar').innerHTML = `
    <div class="sb-sect">◎ 注意力 ${pinIn(16)}</div>
    <button class="sb-row ${S.view === 'inbox' ? 'on' : ''}" data-nav="inbox">
      <span class="ava att">收</span>
      <span>收件箱<span class="meta">组织侧待答 · 唯一聚合处</span></span>
      ${ibN ? `<span class="badge-n">${ibN}</span>` : ''}
    </button>
    <div class="sb-sect" style="margin-top:8px">☁ 云之家</div>
    <button class="sb-row ${S.view === 'group' ? 'on' : ''}" data-nav="group">
      <span class="ava">产</span>
      <span>产品群<span class="meta">主楼 · 1 目标 · ${S.thursday ? 3 : 2} 承诺</span></span>
    </button>
    ${finRow}
    <div class="sb-sect" style="margin-top:8px">⌂ 本地 · 私语 ${pinIn(7)}</div>
    <button class="sb-row ${S.view === 'dm' ? 'on' : ''}" data-nav="dm">
      <span class="ava pri">私</span>
      <span>与 agent 私语<span class="meta">仅你可见</span></span>
      ${unread ? `<span class="badge-n soft" title="消息未读（读即清）——不是待答计数：私账不进任何可应答聚合">${unread}</span>` : ''}
    </button>
    <button class="sb-row ${S.view === 'vault' ? 'on' : ''}" data-nav="vault">
      <span class="ava pri">🔒</span>
      <span>我的判断（金库）<span class="meta">私账 · 不入组织图</span></span>
    </button>
    <div class="sb-sect" style="margin-top:8px">▦ 取景框</div>

        部署二值开关：组织可不启用金库，但"启用且组织可见"的中间态<b>明拒</b>。
      </div>
      <div class="rp-card">
        <h4>持镜人条款 ${pinIn(14)}</h4>
        agent 只在<b>你发起</b>的对表/回看/换挡时刻引用金库；不因你的误判史改组织侧任何行为。镜子只能被本人照。
      </div>`;
  } else {
    r.innerHTML = `
      <div class="rp-title">双螺旋 · 决策 #60 + v4.25r</div>
      <div class="rp-card paper">
        <h4>两条链互喂，谁也不吞谁 ${pinIn(1)}</h4>
        <b>agent′</b> 的增量来自你的话语与裁决（记忆、判例、信任）；<br>
        <b>P′</b> 的增量来自被扛走损耗后<b>保留且回喂</b>的判断。<br>
        逐环判据：同一次点击，反馈只流回系统是<b>萃取</b>，也流回人是<b>练习</b>。
      </div>
      <div class="rp-card paper">
        <h4>P′ 四资产 ${pinIn(9)}</h4>
        判断 = 金库回路（唯一新增机制）<br>
        表达 = 产婆术（命名既有）<br>
        品味 = 磨稿亲笔（既有）<br>
        志向 = 目标作者权（既有）<br>
        关系 = 社交摩擦不碰（既有）<br>
        <span style="color:var(--ink-3)">品味与志向的量化明拒——机制化即其死亡。</span>
      </div>
      <div class="rp-card">
        <h4>验收句 ${pinIn(10)}</h4>
        <b>拿走系统的那一天，人比第一天更强。</b><br>
        杠铃与拐杖的分界——搬运的肌肉不值得保留（老茧），判断/表达/关系的肌肉萎缩即圈养。
      </div>
      <div class="rp-card">
        <h4>机制账单（近零新增）${pinIn(4)}</h4>
        校准回执 = 可应答对象落私语域（单答家族复用）；<br>
        预期 = 登记动词的私语形态；<br>
        两读/三档位 = 条尾租约入口的语义扩员（零新入口）；<br>
        唯一新增的"面" = 本金库视图，且它住在私语侧。
      </div>`;
  }
}

/* ================= 判例弹层 ================= */
const CASES = {
  'cases-skip': { t: '模式判例：跳过未消解锚后被打回', items: [
    { d: '7/14', s: '《周报数据口径》——简报标"数据缺口未消解"，验收后被财务打回补数', m: '锚：差距简报② · 终态：返工 1 轮' },
    { d: '8/02', s: '《供货框架合同》——简报标"违约条款未消解"，验收后法务退回', m: '锚：差距简报① · 终态：返工 1 轮' },
    { d: '8/28', s: '《Q4 定价方案 v3》——简报标"竞品对比未消解"，周四评审打回', m: '锚：差距简报③ · 终态：新一轮（本沙盘主线）', needAttr: true },
  ]},
  'cases-zr': { t: '判例：张锐交付估期', items: [
    { d: '7/22', s: '「周五能交竞品调研」——实际下周二交（+2d）', m: '估期话语锚 × 交付时间' },
    { d: '8/08', s: '「明天给你口径表」——实际后天（+1d）', m: '估期话语锚 × 交付时间' },
    { d: '8/23', s: '「周三能交 v3」——实际周五（+2d）', m: '估期话语锚 × 交付时间（本回执）' },
  ]},
  'cases-zr-est': { t: '判例：你对张锐工期的预估（Bruce 的私账）', items: [
    { d: '7/22', s: '你按他说的周五排了评审——顺延一次', m: '你的排期裁决 × 实际交付' },
    { d: '8/08', s: '你留了 1 天余量——刚好够', m: '你的排期裁决 × 实际交付' },
    { d: '8/28', s: '你按 9/1 验收排了周四评审——被打回后重排', m: '你的排期裁决 × 实际交付' },
  ]},
};
function showCases(key) {
  const c = CASES[key]; if (!c) return;
  const items = c.items.filter(i => !i.needAttr || S.attribution === 'q3');
  openPop(c.t, `<div class="caselist">${items.map(i =>
    `<div class="ci"><b>${i.d}</b> · ${i.s}<div class="m">${i.m}</div></div>`).join('')}
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">每个数字是门（逐级兑付对私账同样适用）——判例可回锚，模式不可编造。</div>`);
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const noteBtn = e.target.closest('[data-note]');
  if (noteBtn) { const n = NOTES[noteBtn.dataset.note]; if (n) openPop(n.title, n.body, noteBtn.dataset.note); return; }
  const ib = e.target.closest('[data-ibnav]');
  if (ib) { S.view = ib.dataset.ibnav; S.flashCard = ib.dataset.flash; renderAll(); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'accept') {
    S.accepted = true; S.dmUnread += 1;
    toast('已验收（简报锚③未消解——跳过留痕）。收件箱该行答完即溶；私语域来了一条有出处的邀约（消息未读 +1）。');
    renderAll(); return;
  }
  if (a === 'reject' || a === 'wait') {
    toast(a === 'reject'
      ? '拒收 → 返工轮次与再协商回流：该路径在 v4 主线沙盘已完整演示，本沙盘聚焦验收后的私账回路。'
      : '继续等 → 不产生任何状态（等待可见由三值信号承担）——见 v4 主线。');
    return;
  }
  if (a === 'bx-approve') {
    S.bxApproved = true;
    toast('已确认入账（第 24 次连续通过）。注意条尾出现了「这类裁决还需要你吗›」——v4.15 既有租约入口，现在是两读分岔。');
    renderAll(); return;
  }
  if (a === 'bx-reject' || a === 'bx-hold') { toast('驳回/挂起路径见 v4 主线（财务对账裁决卡剧本）——本沙盘聚焦通过后的条尾分岔。'); return; }
  if (a === 'tail-open') { S.tailOpen = true; renderAll(); return; }
  if (a === 'tail-close') { S.tailOpen = false; toast('先不动——档位保持默认。换挡台在金库，证据一直在。'); renderAll(); return; }
  if (a === 'peek') { e.preventDefault(); toast('并排预览（工件三态）见 v4 主线——本沙盘不重演。'); return; }
  if (a === 'goto-grind') { e.preventDefault(); S.view = 'dm'; if (S.viewAs === 'me') S.dmUnread = 0; renderAll(); toast('这条成功标准是你 8/12 在私语域亲笔磨出来的——出生故事闭环。'); return; }
  if (a === 'offer-input') { S.offer = 'input'; renderAll(); setTimeout(() => { const ta = $('expectTa'); if (ta) ta.focus(); }, 30); return; }
  if (a === 'offer-decline') { S.offer = 'declined'; S.declined = true; toast('按下不表，这一单不再问；连续不立会整体降频（重开在金库）。周四的回执照样会来。'); renderAll(); return; }
  if (a === 'offer-sample') {
    const ta = $('expectTa'); if (ta) { ta.value = '周四评审一次过，不需要第二轮'; ta.focus(); }
    toast('示例是演示装置（v4.24 出处律）——真实产品里这句话由你说。'); return;
  }
  if (a === 'offer-ghost') {
    S.refused = true; const ta = $('expectTa'); const keep = ta ? ta.value : '';
    renderAll(); const ta2 = $('expectTa'); if (ta2) ta2.value = keep; return;
  }
  if (a === 'offer-send') {
    const ta = $('expectTa');
    const txt = ta ? ta.value.trim() : '';
    if (!txt) { toast('预期得有内容——一句可证伪的赌注，由你说（产婆术：agent 不代写）。'); return; }
    S.expectText = txt; S.offer = 'born';
    toast('🔒 预期已立，仅你可见。周四见分晓。');
    renderAll(); return;
  }
  if (a === 'attr') {
    const k = act.dataset.key; S[k] = act.dataset.q;
    toast(k === 'attribution'
      ? '已入对表。归因是你下的——agent 只备料举证，不代归因。'
      : '已入对表（张锐的私账）。');
    renderAll(); return;
  }
  if (a === 'gear') {
    S[act.dataset.k] = act.dataset.v; S.tailOpen = false;
    const lbl = { lease: '租约（全自动，90 天期到期重签）', default: '默认（agent 提案、你裁决）', weight: '负重（摆开证据 / 你先手、agent 再补）' }[act.dataset.v];
    toast(`换挡：${lbl}。档位是你的私有设置——组织侧无人知晓，agent 照办不揣测（持镜人条款）。`);
    renderAll(); return;
  }
  if (a === 'open-vault') { S.view = 'vault'; renderAll(); return; }
  if (a === 'goto-card') { e.preventDefault(); S.view = 'group'; S.flashCard = 'accCard'; renderAll(); toast('回到验收卡——判例可回锚（一跳指路）。'); return; }
  if (a.startsWith('cases-')) { showCases(a); return; }
});
$('popClose').addEventListener('click', () => document.body.classList.remove('pop'));
$('popMask').addEventListener('click', () => document.body.classList.remove('pop'));
$('annotateToggle').addEventListener('click', () => {
  document.body.classList.toggle('annotate');
  $('annotateToggle').setAttribute('aria-pressed', document.body.classList.contains('annotate'));
});
$('viewerSwitch').querySelectorAll('[data-viewer]').forEach(b =>
  b.addEventListener('click', () => {
    S.viewAs = b.dataset.viewer;
    if (S.view === 'fin' && S.viewAs !== 'me') S.view = 'group';  /* 可见域：张锐/李总不在财务群 */
    $('viewerSwitch').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    renderAll();
  }));

/* ================= 总渲染 ================= */
function renderAll() { renderHintbar(); renderSidebar(); renderCenter(); renderRpanel(); }
renderAll();
</script>
</body>
</html>

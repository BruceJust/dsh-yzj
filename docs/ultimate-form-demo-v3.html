<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云之家 × DSH · 终极形态 v3 —— 桌面端完整价值沙盘</title>
<style>
/* ============================================================
   终极形态 v3 · 桌面端完整价值沙盘
   一张会话图，任意投影：本页是它在桌面的全量投影（公+私）。
   云之家原生客户端只是其中"公"的部分（兼容投影）。
   ============================================================ */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --ink: #20242C;
  --ink-2: #5A6272;
  --ink-3: #8B93A3;
  --line: #E2E5EA;

  --pub: #2E63D9;
  --pub-deep: #1E4FBD;
  --pub-tint: #EEF4FF;
  --pub-line: #C9DBFA;
  --pub-rail: #D8E5FB;

  --paper: #FAF6EC;
  --paper-line: #E9DFC8;
  --paper-rail: #EFE6D0;
  --paper-ink: #6B5A36;

  --amber: #B45309;
  --amber-bg: #FDF1E0;
  --amber-line: #F0D9B4;
  --green: #15803D;
  --green-bg: #E8F6EE;
  --green-line: #C4E6D1;
  --red: #B91C1C;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(24,30,42,.05), 0 4px 16px rgba(24,30,42,.06);
  --shadow-pop: 0 6px 32px rgba(24,30,42,.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--bg);
}
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--pub); outline-offset: 2px; border-radius: 4px; }

/* ---------- 顶栏 ---------- */
.topbar {
  height: 46px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px;
  background: #171B22; color: #E8EAEF;
}
.wordmark { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
.wordmark em { font-style: normal; color: #7FA7F5; }
.topbar .crumb { font-size: 12.5px; color: #9AA3B5; }
.topbar .crumb b { color: #D5DAE4; font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar a.xlink {
  font-size: 11.5px; color: #9AA3B5; text-decoration: none;
  padding: 4px 9px; border: 1px solid #333B48; border-radius: 8px;
}
.topbar a.xlink:hover { color: #E8EEFF; border-color: #3E5AA6; }
.annotate-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #C4CAD6;
  padding: 5px 10px; border-radius: 8px;
  border: 1px solid #333B48;
  transition: background .15s, border-color .15s;
}
.annotate-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: #4A5364; transition: background .15s; }
body.annotate .annotate-toggle { background: #24304A; border-color: #3E5AA6; color: #E8EEFF; }
body.annotate .annotate-toggle .dot { background: #7FA7F5; }
.top-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #46536B, #2B3345);
  color: #DFE5F0; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- 引导条 ---------- */
.hintbar {
  height: 34px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  font-size: 12.5px; color: var(--ink-2);
  background: #F7F8FA;
  border-bottom: 1px solid var(--line);
}
.hintbar .k {
  font-size: 11.5px; padding: 2px 8px; border-radius: 20px;
  background: #EDF1F6; border: 1px solid var(--line); color: var(--ink-2);
}
.hintbar .close { margin-left: auto; color: var(--ink-3); font-size: 15px; padding: 2px 6px; }
.hintbar .close:hover { color: var(--ink); }

/* ---------- 三栏布局 ---------- */
.app {
  display: grid;
  grid-template-columns: 272px minmax(520px, 1fr) 296px;
  grid-template-rows: minmax(0, 1fr);
  height: calc(100vh - 80px);
}
body.no-hint .app { height: calc(100vh - 46px); }

/* ---------- 侧栏：统一收件箱 ---------- */
.sidebar {
  background: #F3F4F6;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.side-head {
  padding: 14px 14px 8px;
  display: flex; align-items: baseline; gap: 8px;
  position: relative;
}
.side-head h2 { font-size: 13px; font-weight: 700; }
.side-head .sub { font-size: 11px; color: var(--ink-3); }
.triage { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
.triage-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
  border: 1px solid transparent;
  transition: transform .12s;
}
.triage-chip:hover { transform: translateY(-1px); }
.triage-chip .n { font-weight: 700; }
.triage-chip.t-confirm { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
.triage-chip.t-review  { background: var(--green-bg); color: var(--green); border-color: var(--green-line); }
.triage-chip.t-running { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); }
.triage-chip[data-zero="1"] { opacity: .38; filter: grayscale(.4); }
.tree { padding: 2px 8px 20px; }
.tree-group {
  margin-top: 10px;
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  padding: 0 8px 4px; letter-spacing: .04em;
  display: flex; align-items: center; gap: 6px;
}
.tree-group .gline { flex: 1; height: 1px; background: var(--line); }
.item {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 9px; border-radius: 8px;
  text-align: left; position: relative;
  transition: background .12s;
}
.item:hover { background: #E9EBEF; }
.item.active { background: #FFFFFF; box-shadow: var(--shadow); }
.item .ic {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
}
.item .tcol { flex: 1; min-width: 0; }
.item .t1 { font-size: 12.8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t2 { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.badge { flex: none; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.badge.b-confirm { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }
.badge.b-review  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.badge.b-running { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); display: inline-flex; align-items: center; gap: 4px; }
.badge.b-unread  { background: #E5E8ED; color: var(--ink-2); }
.badge.b-done    { background: #E5E8ED; color: var(--ink-3); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--pub); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(.75);} }

/* ---------- 中栏：融合时间线 ---------- */
.main { display: flex; flex-direction: column; background: var(--surface); min-width: 0; min-height: 0; }
.sess-head { padding: 12px 20px 10px; border-bottom: 1px solid var(--line); position: relative; }
.sess-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sess-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; padding: 2.5px 8px; border-radius: 6px;
  background: #F1F3F6; color: var(--ink-2); border: 1px solid var(--line);
}
.chip.mono { font-size: 10.5px; }
.chip.agent-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: #1D2432; color: #DCE4F5; border-color: #1D2432;
}
.chip.agent-chip .pulse { background: #7FA7F5; }
.chip.agent-chip.off { background: #F1F3F6; color: var(--ink-3); border-color: var(--line); }
.timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0 18px; scroll-behavior: smooth; position: relative; }
@media (prefers-reduced-motion: reduce) {
  .timeline { scroll-behavior: auto; }
  .pulse { animation: none; }
  .msg.enter { animation: none !important; }
}
.divider { display: flex; align-items: center; gap: 10px; padding: 8px 20px; font-size: 11px; color: var(--ink-3); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider.unread { color: var(--red); font-weight: 600; }
.divider.unread::before, .divider.unread::after { background: #F3CBCB; }
.msg { display: grid; grid-template-columns: 40px 1fr; gap: 0 10px; padding: 5px 20px 5px 14px; position: relative; }
.msg.enter { animation: slidein .28s ease; }
@keyframes slidein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
.rail { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 3px; }
.rail-tag {
  font-size: 10px; font-weight: 700; line-height: 1;
  padding: 3.5px 6px; border-radius: 5px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.msg--pub .rail-tag { background: var(--pub-tint); color: var(--pub); border: 1px solid var(--pub-line); }
.msg--pri .rail-tag { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); }
.rail .rline { flex: 1; width: 2px; border-radius: 2px; }
.msg--pub .rline { background: var(--pub-rail); }
.msg--pri .rline { background: var(--paper-rail); }
.mbody { min-width: 0; max-width: 720px; position: relative; }
.mhead { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.avatar {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
}
.mhead .name { font-size: 12.5px; font-weight: 650; }
.mhead .name .state { color: var(--pub); font-weight: 600; }
.mhead .meta { font-size: 10.5px; color: var(--ink-3); }
.bubble {
  border-radius: var(--radius);
  padding: 9px 12px; line-height: 1.65;
  border: 1px solid var(--line); background: var(--surface);
  width: fit-content; max-width: 100%;
}
.msg--pub .bubble { border-color: var(--pub-line); background: #FDFEFF; }
.msg--pub.mine .bubble { background: var(--pub-tint); }
.msg--pri .bubble { background: var(--paper); border-color: var(--paper-line); }
.bubble.pause { border-left: 3px solid var(--amber); }
.mfoot { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
.msg--pri .mfoot { color: #A08D5F; }
.at { color: var(--pub); font-weight: 650; background: rgba(46,99,217,.09); padding: 0 3px; border-radius: 4px; }
.sysline { padding: 4px 20px 4px 64px; font-size: 11.5px; color: var(--ink-3); }
.sysline .inner {
  display: inline-flex; align-items: center; gap: 6px;
  background: #F6F7F9; border: 1px dashed var(--line);
  border-radius: 8px; padding: 5px 10px;
}

/* 私有工作块 */
.workblock {
  border-radius: var(--radius); border: 1px solid var(--paper-line); background: var(--paper);
  overflow: hidden; max-width: 100%; width: fit-content; min-width: 320px;
}
.workblock summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; font-size: 12px; color: var(--paper-ink); font-weight: 600;
}
.workblock summary::-webkit-details-marker { display: none; }
.workblock summary .tw { transition: transform .15s; font-size: 10px; }
.workblock[open] summary .tw { transform: rotate(90deg); }
.wsteps { padding: 2px 12px 10px 30px; display: flex; flex-direction: column; gap: 5px; }
.wstep { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 7px; align-items: baseline; }
.wstep .st { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; flex: none; width: 14px; }
.wstep.done .st { color: var(--green); }
.wstep.run .st { color: var(--pub); }
.wstep.wait .st { color: var(--amber); }
.wstep .tool { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--ink-3); background: #F2EDDF; padding: 1px 5px; border-radius: 4px; }
.wstep.mem .tool { background: #E3ECFB; color: var(--pub-deep); }

/* 审批对象卡 */
.confirm-card {
  border-radius: 12px;
  border: 1px solid var(--amber-line); border-top: 3px solid var(--amber);
  background: #FFFDF8;
  box-shadow: var(--shadow);
  max-width: 560px; overflow: hidden;
  transition: border-color .3s;
}
.confirm-card.approved { border-color: var(--green-line); border-top-color: var(--green); background: #FCFFFD; }
.cc-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px 9px; }
.cc-domain {
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
  padding: 2.5px 7px; border-radius: 5px;
  background: var(--amber-bg); color: var(--amber);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.confirm-card.approved .cc-domain { background: var(--green-bg); color: var(--green); }
.cc-title { font-size: 13px; font-weight: 700; flex: 1; }
.cc-risk { font-size: 10.5px; color: var(--amber); background: var(--amber-bg); padding: 2px 7px; border-radius: 20px; border: 1px solid var(--amber-line); }
.cc-fields { padding: 0 14px 10px; display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 12px; }
.cc-fields .k { color: var(--ink-3); }
.cc-fields .v b { font-weight: 650; }
.cc-proj {
  margin: 0 14px 10px; padding: 7px 10px;
  border: 1px dashed var(--line); border-radius: 8px;
  font-size: 11px; color: var(--ink-2); line-height: 1.6;
  background: #FAFBFC;
}
.cc-proj .pj { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--pub-deep); background: #E3ECFB; padding: 1px 5px; border-radius: 4px; }
.cc-actions { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #F4EBDB; }
.confirm-card.approved .cc-actions { border-top-color: #E2F2E8; }
.btn {
  font-size: 12.5px; font-weight: 600;
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff; color: var(--ink-2);
  transition: transform .1s, box-shadow .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.cc-done-note { display: flex; align-items: center; gap: 7px; padding: 10px 14px 12px; font-size: 12.5px; color: var(--green); font-weight: 600; }

/* 工件卡 */
.artifact {
  display: flex; align-items: center; gap: 12px;
  border-radius: 12px;
  border: 1px solid var(--pub-line);
  background: linear-gradient(160deg, #FDFEFF, #F4F8FF);
  padding: 12px 14px; max-width: 480px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .12s, box-shadow .15s;
}
.artifact:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(46,99,217,.15); }
.af-icon {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  background: var(--pub); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.af-body { flex: 1; min-width: 0; }
.af-t { font-size: 13px; font-weight: 700; }
.af-m { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.af-arrow { color: var(--pub); font-size: 15px; }

/* 验收条 */
.acceptbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border: 1px solid var(--green-line); border-radius: 12px;
  background: linear-gradient(160deg, #FDFFFE, #F1FAF4);
  padding: 10px 14px; max-width: 560px;
  box-shadow: var(--shadow);
  position: relative;
}
.acceptbar .lab { font-size: 12.5px; font-weight: 650; color: var(--green); }
.acceptbar .note { font-size: 10.5px; color: var(--ink-3); }
.acceptbar.done-state { border-color: var(--line); background: #F7F8FA; }
.acceptbar.done-state .lab { color: var(--ink-3); }

/* 冷会话空态 */
.coldhint {
  margin: 14px 20px 6px 64px; max-width: 560px;
  border: 1px dashed #C9CFDA; border-radius: 12px;
  background: #FAFBFC; padding: 14px 16px;
  font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
  position: relative;
}
.coldhint b { color: var(--ink); }

/* ---------- 话题卡（群视图内联） ---------- */
.topiccard {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-left: 3px solid #C9D4E8;
  border-radius: 12px; background: #FBFCFE;
  padding: 10px 13px; max-width: 480px;
  cursor: pointer; box-shadow: var(--shadow);
  transition: transform .12s, box-shadow .15s;
  position: relative;
}
.topiccard:hover { transform: translateY(-2px); box-shadow: 0 4px 18px rgba(24,30,42,.12); }
.topiccard.hot { border-left-color: var(--pub); background: linear-gradient(160deg, #FDFEFF, #F6F9FF); }
.tc-ic { font-size: 16px; flex: none; }
.tc-body { flex: 1; min-width: 0; }
.tc-t { font-size: 13px; font-weight: 700; }
.tc-m { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.tc-arrow { color: var(--ink-3); font-size: 15px; flex: none; }
.crumb-btn { color: var(--ink-3); font-weight: 600; font-size: 15px; padding: 0; }
.crumb-btn:hover { color: var(--pub); text-decoration: underline; }
.crumb-sep { color: var(--ink-3); font-weight: 400; }
button.tree-group.tg-head { cursor: pointer; width: 100%; text-align: left; }
button.tree-group.tg-head:hover { color: var(--pub); }
button.tree-group.tg-head.active { color: var(--pub); }

/* ---------- Agent 场所合同面板 ---------- */
.apanel-mask {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(23,27,34,.35);
  display: none; align-items: center; justify-content: center;
}
.apanel-mask.show { display: flex; }
.apanel {
  width: 580px; max-height: 84vh; overflow-y: auto;
  background: #fff; border-radius: 16px;
  box-shadow: var(--shadow-pop);
  position: relative;
  animation: popin .18s ease;
}
.ap-head {
  display: flex; align-items: center; gap: 11px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.ap-ava {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  background: #171B22; color: #fff; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.ap-title { font-size: 15px; font-weight: 750; }
.ap-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.ap-close { margin-left: auto; font-size: 17px; color: var(--ink-3); padding: 4px 8px; }
.ap-close:hover { color: var(--ink); }
.ap-sec { padding: 12px 18px 2px; }
.ap-sec-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 750; padding-bottom: 7px; }
.ap-badge { font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.ap-badge.hard { background: #FBEAEA; color: #B91C1C; border: 1px solid #F0CACA; }
.ap-badge.soft { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
.ap-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 0; font-size: 12.5px;
  border-bottom: 1px dashed #F0F2F5;
}
.ap-row .k { color: var(--ink-3); width: 100px; flex: none; }
.ap-row .v { flex: 1; }
.ap-inherit {
  font-size: 9.5px; color: var(--ink-3);
  background: #F1F3F6; border: 1px solid var(--line);
  padding: 1px 6px; border-radius: 20px; flex: none;
}
.ap-inherit.ovr { background: var(--pub-tint); color: var(--pub); border-color: var(--pub-line); }
.ap-note { font-size: 10.5px; color: var(--ink-3); padding: 7px 0 10px; line-height: 1.65; }
.ap-actions { padding: 8px 18px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ap-trace { font-size: 12px; color: var(--pub); font-weight: 650; cursor: pointer; }
.ap-trace:hover { text-decoration: underline; }
.trace-link { margin-left: 8px; font-size: 10.5px; color: var(--pub); font-weight: 650; cursor: pointer; flex: none; }
.trace-link:hover { text-decoration: underline; }
.chip.agent-chip[data-apanel] { cursor: pointer; }
.chip.agent-chip[data-apanel]:hover { box-shadow: 0 2px 8px rgba(23,27,34,.35); }
.chip.gfilter { cursor: pointer; transition: background .15s, color .15s; }

const $ = (id) => document.getElementById(id);
const timelineEl = $('timeline');

function avatarHtml(who) {
  const a = AV[who];
  return `<span class="avatar" style="background:${a.c}">${a.t}</span>`;
}
function pinInline(no) {
  return no ? `<button class="pin inline" data-note="${no}" aria-label="设计注解 ${no}">${no}</button>` : '';
}

/* ---------- 时间线渲染 ---------- */
function renderItem(item, sess) {
  if (item.type === 'divider')
    return `<div class="divider${item.unread ? ' unread' : ''}">${item.text}</div>`;

  if (item.type === 'im') {
    const mine = item.mine ? ' mine' : '';
    const foot = item.delegate
      ? `<div class="mfoot">公开委派 · 经 gateway · ${sess.kind === 'dm' || sess.placeKey === '李婷' ? '对方' : '群内所有人'}可见</div>`
      : `<div class="mfoot">云之家 · ${sess.group}</div>`;
    return `<div class="msg msg--pub${mine} enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml(item.who)}<span class="name">${item.name}</span><span class="meta">${item.time}</span>${pinInline(item.pin)}</div>
        <div class="bubble">${item.text}</div>${foot}
      </div></div>`;
  }

  if (item.type === 'agent-pub') {
    const stateName = sess.agentState ? ` <span class="state">[${sess.agentState}]</span>` : '';
    const kindFoot = { ack: '经 gateway 回帖 · 群内可见', progress: 'checkpoint · 群内可见（上限 5 条）', done: '终态回帖 · 群内可见', pause: '等待状态 · 群内可见' }[item.kind];
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('agent')}<span class="name">云小助${stateName}</span><span class="meta">${item.time}</span>${pinInline(item.pin)}</div>
        <div class="bubble${item.kind === 'pause' ? ' pause' : ''}">${item.text}</div>
        <div class="mfoot">${kindFoot}</div>
      </div></div>`;
  }

  if (item.type === 'agent-pri') {
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('agent')}<span class="name">云小助</span><span class="meta">${item.time}</span></div>
        <div class="bubble">${item.text}</div>
        <div class="mfoot">仅你可见 · 桌面投影</div>
      </div></div>`;
  }

  if (item.type === 'user-pri') {
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="mhead">${avatarHtml('me')}<span class="name">Bruce（我）</span><span class="meta">${item.time}</span></div>
        <div class="bubble">${item.text}</div>
        <div class="mfoot">本地 followup · 即时 · 群内不可见</div>
      </div></div>`;
  }

  if (item.type === 'work') {
    const steps = item.steps.map(s => {
      const mark = { done: '✓', run: '◐', wait: '⏸' }[s.st];
      return `<div class="wstep ${s.st}${s.mem ? ' mem' : ''}"><span class="st">${mark}</span><span class="tool">${s.tool}</span><span>${s.desc}</span></div>`;
    }).join('');
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <details class="workblock"${item.open ? ' open' : ''}>
          <summary><span class="tw">▶</span>${item.summary}<span class="trace-link" data-trace="1">完整轨迹 ↗</span><button class="pin inline" data-note="11" aria-label="设计注解 11">11</button><span style="margin-left:auto;font-weight:400;font-size:10.5px;color:#A08D5F">仅你可见</span></summary>
          <div class="wsteps">${steps}</div>
        </details>
      </div></div>`;
  }

  if (item.type === 'confirm') {
    const fields = item.fields.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
    const approved = item.state === 'approved';
    const actions = approved
      ? `<div class="cc-done-note">✓ 已确认 · sheet 创建与 12 条记录写入已执行</div>`
      : `<div class="cc-actions">
           <button class="btn primary" data-cc="${item.id}" data-act="approve">确认执行</button>
           <button class="btn" data-cc="${item.id}" data-act="cancel">取消</button>
           <button class="btn" data-cc="${item.id}" data-act="context">查看上下文</button>
           <button class="btn" data-cc="${item.id}" data-act="edit">编辑参数</button>
         </div>`;
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="confirm-card${approved ? ' approved' : ''}" id="card-${item.id}">
          <div class="cc-head"><span class="cc-domain">sheet</span><span class="cc-title">${item.title}</span><span class="cc-risk">${item.risk}</span>${pinInline(item.pin)}</div>
          <div class="cc-fields">${fields}</div>
          <div class="cc-proj">同一审批对象的投影：<span class="pj">桌面卡（此处）</span> <span class="pj">云之家 DM 兜底（已推送，回复 1/2 可批）</span> —— 任一侧应答即全局生效</div>
          ${actions}
        </div>
        <div class="mfoot">审批对象 · 仅操作者可批</div>
      </div></div>`;
  }

  if (item.type === 'artifact') {
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="artifact" role="link" tabindex="0" data-artifact="1"${item.pv ? ` data-pv="${item.pv}"` : ''}>
          <span class="af-icon">${item.icon}</span>
          <span class="af-body"><span class="af-t">${item.title}${pinInline(item.pin)}</span><span class="af-m" style="display:block">${item.meta}</span></span>
          <span class="af-arrow">↗</span>
        </div>
        <div class="mfoot">工件已落云之家 · 群里回帖的是链接</div>
      </div></div>`;
  }

  if (item.type === 'accept') {
    const done = item.state === 'done';
    return `<div class="msg msg--pri enter">
      <div class="rail"><span class="rail-tag">私</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="acceptbar${done ? ' done-state' : ''}">
          <span class="lab">${done ? '🗂 已验收归档 · 记忆已蒸馏' : '任务已交付，等待验收'}</span>
          ${done ? '' : `<button class="btn primary" data-accept="${item.id}">✓ 验收归档（/done）</button>`}
          <span class="note">群内自然语言「收了」同样生效</span>
          ${pinInline(item.pin)}
        </div>
      </div></div>`;
  }

  if (item.type === 'topiccard') {
    const t = sessions[item.target];
    const hot = ['running', 'confirm', 'review'].includes(t.status);
    return `<div class="msg msg--pub enter">
      <div class="rail"><span class="rail-tag">公</span><span class="rline"></span></div>
      <div class="mbody">
        <div class="topiccard${hot ? ' hot' : ''}" data-sess="${item.target}" role="link" tabindex="0">
          <span class="tc-ic">🧵</span>
          <span class="tc-body"><span class="tc-t">${t.title}${pinInline(item.pin)}</span><span class="tc-m" style="display:block">${item.meta}</span></span>
          ${badgeHtml(t)}<span class="tc-arrow">›</span>
        </div>
        <div class="mfoot">云之家话题 · 点击进入话题会话${hot ? '（热卡 = 任务卡）' : '（冷卡 = 历史索引）'}</div>
      </div></div>`;
  }

  if (item.type === 'coldhint') {
    const pinH = item.pin ? `<button class="pin" data-note="${item.pin}" style="right:-9px;top:-9px" aria-label="设计注解 ${item.pin}">${item.pin}</button>` : '';
    return `<div class="coldhint enter">${item.html}${pinH}</div>`;
  }

  if (item.type === 'sys') {
    return `<div class="sysline enter"><span class="inner">${item.text}</span></div>`;
  }
  return '';
}

function renderTimeline() {
  const sess = sessions[state.current];
  let items = sess.timeline;
  if (sess.kind === 'groupview' && state.groupFilter === 'topics') items = items.filter(i => i.type === 'topiccard');
  timelineEl.innerHTML =
    `<button class="pin" data-note="3" style="right:26px;top:10px;position:sticky;float:right;margin-right:6px" aria-label="设计注解 3">3</button>` +
    items.map(i => renderItem(i, sess)).join('');
  timelineEl.scrollTop = timelineEl.scrollHeight;
}

/* ---------- 会话头 ---------- */
function renderHead() {
  const sess = sessions[state.current];
  let kindChip = '';
  if (sess.kind === 'groupview') kindChip = `<span class="chip">群视图 · 主楼</span><span class="chip">${GROUPS[0].keys.length} 个话题</span><span class="chip gfilter${state.groupFilter === 'all' ? ' on' : ''}" data-gfilter="all" role="button" tabindex="0">全部</span><span class="chip gfilter${state.groupFilter === 'topics' ? ' on' : ''}" data-gfilter="topics" role="button" tabindex="0">只看话题</span>`;
  else if (sess.kind === 'topic') kindChip = `<span class="chip">群 · ${sess.group}</span><span class="chip">话题</span>`;
  else if (sess.kind === 'dm') kindChip = `<span class="chip">私聊</span>`;
  else if (sess.kind === 'cold') kindChip = `<span class="chip">${sess.group === '私聊' ? '私聊' : '云之家群'} · 未接入</span>`;
  else kindChip = `<span class="chip">本地会话</span>`;
  let titleHtml = sess.title;
  if (sess.kind === 'topic' && sess.group === '产品讨论群') {
    titleHtml = `<button class="crumb-btn" data-sess="prodgroup">产品讨论群</button><span class="crumb-sep"> › </span><span>${sess.title}</span>`;
  }
  const sidChip = sess.sid ? `<span class="chip mono">${sess.sid}</span>` : '';
  let agentChip;
  const AP = 'data-apanel="1" role="button" tabindex="0" title="查看 Agent 场所合同"';
  if (sess.agentState) agentChip = `<span class="chip agent-chip" ${AP}><span class="pulse"></span>云小助 · ${sess.agentState}</span>`;
  else if (sess.kind === 'groupview') agentChip = `<span class="chip agent-chip off" ${AP}>云小助 · 本群在岗（场所合同）</span>`;
  else if (sess.kind === 'cold') agentChip = `<span class="chip agent-chip off" ${AP}>未接入 Agent —— @云小助 即可开始</span>`;
  else if (sess.status === 'review') agentChip = `<span class="chip agent-chip off" ${AP}>云小助 · 空闲（等待验收）</span>`;
  else if (sess.status === 'archived') agentChip = `<span class="chip agent-chip off" ${AP}>云小助 · 已归档</span>`;
  else agentChip = `<span class="chip agent-chip off" ${AP}>云小助 · 本地会话（Web 语义）</span>`;
  $('sessHead').innerHTML = `
    <div class="sess-title">${titleHtml}${agentChip}</div>
    <div class="sess-meta">${kindChip}${sidChip}</div>`;
}

/* ---------- 侧栏 ---------- */
const STATUS_RANK = { confirm: 0, review: 1, running: 2, unread: 3, archived: 4, idle: 5 };
function badgeHtml(sess) {
  switch (sess.status) {
    case 'confirm': return `<span class="badge b-confirm">待确认</span>`;
    case 'review':  return `<span class="badge b-review">待验收</span>`;
    case 'running': return `<span class="badge b-running"><span class="pulse"></span>运行中</span>`;
    case 'unread':  return `<span class="badge b-unread">${sess.unread}</span>`;
    case 'archived':return `<span class="badge b-done">已归档</span>`;
    default: return '';
  }
}
const GROUPS = [
  { label: '产品讨论群', head: 'prodgroup', keys: ['competitor', 'roadmap'] },
  { label: '私聊', keys: ['zhangsan', 'litingdm'] },
  { label: '其他群', keys: ['designreview'] },
  { label: '本地', keys: ['local'] },
];
function groupAggBadge(keys) {
  const order = ['confirm', 'review', 'running'];
  const best = keys.map(k => sessions[k].status).filter(s => order.includes(s))
    .sort((a, b) => order.indexOf(a) - order.indexOf(b))[0];
  if (!best) return '';
  return { confirm: `<span class="badge b-confirm">待确认</span>`,
           review: `<span class="badge b-review">待验收</span>`,
           running: `<span class="badge b-running"><span class="pulse"></span></span>` }[best];
}
const ACTIVE_STATUSES = ['confirm', 'review', 'running'];
function renderSidebar() {
  $('tree').innerHTML = GROUPS.map(g => {
    /* 注意力租约：有 head 的组（群）下只挂活跃话题，终态退租；无 head 的组是场所/本地，常驻但归档不带徽标 */
    const visibleKeys = g.head
      ? g.keys.filter(k => ACTIVE_STATUSES.includes(sessions[k].status))
      : g.keys.slice();
    const items = visibleKeys
      .sort((a, b) => STATUS_RANK[sessions[a].status] - STATUS_RANK[sessions[b].status])
      .map(k => {
        const s = sessions[k];
        const badge = s.status === 'archived' ? '' : badgeHtml(s);
        return `<button class="item${k === state.current ? ' active' : ''}" data-sess="${k}">
          <span class="ic" style="background:${s.icon.c}">${s.icon.t}</span>
          <span class="tcol"><span class="t1">${s.title}</span><span class="t2">${s.preview}</span></span>
          ${badge}
        </button>`;
      }).join('');
    const head = g.head
      ? `<button class="tree-group tg-head${g.head === state.current ? ' active' : ''}" data-sess="${g.head}" title="打开群视图（主楼）">${g.label}<span class="gline"></span>${groupAggBadge(g.keys)}</button>`
      : `<div class="tree-group">${g.label}<span class="gline"></span></div>`;
    return head + items;
  }).join('');

  const counts = { confirm: 0, review: 0, running: 0 };
  Object.values(sessions).forEach(s => { if (counts[s.status] !== undefined) counts[s.status]++; });
  $('triage').innerHTML = `
    <button class="triage-chip t-confirm" data-goto="confirm" data-zero="${counts.confirm ? 0 : 1}">✋ <span class="n">${counts.confirm}</span> 待确认</button>
    <button class="triage-chip t-review" data-goto="review" data-zero="${counts.review ? 0 : 1}">✓ <span class="n">${counts.review}</span> 待验收</button>
    <button class="triage-chip t-running" data-goto="running" data-zero="${counts.running ? 0 : 1}">● <span class="n">${counts.running}</span> 运行中</button>`;
  $('fbAmber').textContent = counts.confirm;
  $('fbAmber').dataset.zero = counts.confirm ? 0 : 1;
  $('fbGreen').textContent = counts.review;
  $('fbGreen').dataset.zero = counts.review ? 0 : 1;
}

/* ---------- Composer ---------- */
function setVoice(v, opts = {}) {
  state.voice = v;
  const c = $('composer');
  c.classList.toggle('v-pri', v === 'pri');
  c.classList.toggle('v-pub', v === 'pub');
  updateVoiceHint();
  if (!opts.silent) $('input').focus();
}
function updateVoiceHint() {
  const sess = sessions[state.current];
  const input = $('input');
  const hint = $('voiceHint');
  const hasAt = AGENT_ALIAS.test(input.value);
  if (state.voice === 'pri') {
    hint.textContent = '即时 · 仅本会话可见 · 写操作需确认卡';
    hint.className = 'voice-hint';
    input.placeholder = '对 Agent 说点什么（群里不可见）…';
  } else if (sess.kind === 'groupview') {
    hint.textContent = hasAt
      ? '将在主楼开一个新话题（自成话题根 · 边界规则 A0③）'
      : '以 Bruce 的身份发到主楼 · 群内所有人可见';
    hint.className = 'voice-hint' + (hasAt ? ' delegate' : '');
    input.placeholder = '发到主楼 · 含 @云小助 即开新话题…';
  } else {
    hint.textContent = hasAt
      ? '将发起公开委派（gateway 授权：本 turn 预授权标准写）'
      : `以 Bruce 的身份发言 · ${sess.kind === 'dm' || sess.placeKey === '李婷' || sess.placeKey === '张三' ? '对方' : '群内所有人'}可见`;
    hint.className = 'voice-hint' + (hasAt ? ' delegate' : '');
    input.placeholder = '发到群里（所有人可见）· 含 @云小助 即公开委派…';
  }
}
function refreshVoiceAvail() {
  const sess = sessions[state.current];
  const pri = $('voicePri'), pub = $('voicePub');
  pri.disabled = sess.kind === 'cold' || sess.kind === 'groupview';
  pub.disabled = sess.kind === 'local';
  pri.title = sess.kind === 'groupview' ? '主楼无单一 Session —— @云小助 开新话题，或进入某个话题'
    : (pri.disabled ? '尚无 Session —— 先 @云小助 建立' : '');
  pub.title = pub.disabled ? '此会话未锚定外部通道（本地会话）' : '';
  setVoice((sess.kind === 'cold' || sess.kind === 'groupview') ? 'pub' : (sess.kind === 'local' ? 'pri' : sess.voiceDefault), { silent: true });
}
function nowStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function appendItems(sessKey, items, delayBase = 0) {
  const sess = sessions[sessKey];
  items.forEach((it, i) => {
    setTimeout(() => {
      sess.timeline.push(it);
      if (state.current === sessKey) {
        timelineEl.insertAdjacentHTML('beforeend', renderItem(it, sess));
        timelineEl.scrollTop = timelineEl.scrollHeight;
      }
    }, delayBase + i * 750);
  });
}

function handleSend() {
  const input = $('input');
  const text = input.value.trim();
  if (!text) return;
  const sessKey = state.current;
  const sess = sessions[sessKey];
  const chips = state.chips.slice();
  const chipNote = chips.length ? `<div class="mfoot">引用：${chips.join(' · ')}</div>` : '';
  input.value = '';
  state.chips = [];
  renderChips();
  updateVoiceHint();

  const hasAt = AGENT_ALIAS.test(text);
  const safe = text.replace(/@agent|@智能体|@云小助/gi, m => `<span class="at">${m}</span>`);

  if (state.voice === 'pub') {
    appendItems(sessKey, [{ type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: hasAt, text: safe + chipNote }]);
    if (sess.kind === 'groupview' && hasAt) { mainFloorDelegate(text, safe); return; }
    if (sess.kind === 'cold' && hasAt) { warmUp(sessKey); return; }
    if (hasAt) {
      appendItems(sessKey, [{ type: 'agent-pub', time: nowStr(), kind: 'ack', text: '已接收（并入当前话题队列，串行执行）。同话题多次 @ 同属本会话；要干净上下文用 /new。' }], 900);
    }
  } else {
    appendItems(sessKey, [{ type: 'user-pri', time: nowStr(), text: safe + chipNote }]);
    if (sess.kind !== 'cold') {
      appendItems(sessKey, [{ type: 'agent-pri', time: nowStr(), text: '收到，已并入当前任务上下文。' }], 1000);
    }
  }
}

/* 主楼裸 @ → 原地长出新话题（A0 第③级规则可视化） */
let dynTopicCount = 0;
function mainFloorDelegate(rawText, safe) {
  dynTopicCount++;
  const key = 'dyntopic' + dynTopicCount;
  const label = rawText.replace(/@agent|@智能体|@云小助/gi, '').trim().slice(0, 12) || '新话题';
  sessions[key] = {
    group: '产品讨论群', kind: 'topic', placeKey: '产品讨论群',
    title: label,
    status: 'running',
    agentState: '处理主楼委派中',
    sid: `session-yzj-topic-n${dynTopicCount}f…`,
    icon: { t: '产', c: '#2E63D9' },
    preview: '运行中：Agent 已接收任务',
    voiceDefault: 'pri',
    objects: { artifacts: [], refs: [], events: [] },
    timeline: [
      { type: 'divider', text: '今天' },
      { type: 'im', who: 'me', name: 'Bruce（我）', time: nowStr(), mine: true, delegate: true, text: safe },
      { type: 'agent-pub', time: nowStr(), kind: 'ack', text: '已接收，<b>回复本条消息</b>可在此任务上继续。' },
    ],
  };
  GROUPS[0].keys.push(key);
  setTimeout(() => {
    appendItems('prodgroup', [
      { type: 'sys', text: '⚡ 主楼委派 → 自成话题根，新话题已创建（边界规则 A0③）' },
      { type: 'topiccard', target: key, meta: 'Bruce 发起 · 2 条 · 刚刚' },
    ]);
    renderSidebar(); renderHead();
    toast('裸 @ = 开新话题：话题卡原地长出，边界行为肉眼可见');
  }, 800);
}

/* 冷会话焐热 */
function warmUp(sessKey) {
  const sess = sessions[sessKey];
  appendItems(sessKey, [
    { type: 'sys', text: '⚡ 识别到公开委派 · 正在建立 Session（topic ↔ session 锚定）…' },
  ], 700);
  setTimeout(() => {
    Object.assign(sess, sess.warm, { status: 'running' });
    delete sess.unread;
    appendItems(sessKey, [
      { type: 'agent-pub', time: nowStr(), kind: 'ack', text: '已接收，正在处理。<b>回复本条消息</b>可在此任务上继续。' },
    ]);
    renderSidebar(); renderHead(); refreshVoiceAvail(); renderRight();
    toast('会话已焐热 → 持久 Session（话题即句柄：同话题的后续 @ 复用同一会话）');
  }, 1700);
}

/* 审批对象剧本 */
function handleCardAction(ccId, act) {
  const sess = sessions.competitor;
  const item = sess.timeline.find(i => i.type === 'confirm' && i.id === ccId);
  if (!item || item.state !== 'pending') return;
  if (act === 'context') { toast('真实实现：锚定打开资源面板对应位置（工作区 · 产品组）'); return; }
  if (act === 'edit') { toast('真实实现：把参数回填进 composer 供修改后重发'); return; }
  if (act === 'cancel') { toast('已取消（demo 未实现取消分支——试试「确认执行」）'); return; }

  item.state = 'approved';
  const lastWork = sess.timeline.filter(i => i.type === 'work').pop();
  if (lastWork) lastWork.steps.forEach(s => s.st = 'done');
  renderTimeline();

  appendItems('competitor', [
    { type: 'work', time: nowStr(), summary: '执行确认后的写入 · 2 个步骤', open: true, steps: [
      { st: 'done', tool: 'sheet table create', desc: '创建「协作能力对比」数据表' },
      { st: 'done', tool: 'sheet record create', desc: '写入 12 条记录（3 家 × 4 组能力）' },
    ]},
    { type: 'artifact', icon: '▦', title: '竞品对比 · 评审表', meta: '云之家多维表格 · 产品组工作区 · 12 条记录 · 5 个维度', pv: 'sheet-review' },
    { type: 'artifact', icon: '🧾', title: '任务过程摘要 #7', meta: '云之家文档 · 做了什么 / 读写了什么，全组可查', pin: 9, pv: 'doc-summary' },
    { type: 'agent-pub', time: nowStr(), kind: 'done', text: '✅ 已完成：对比表与过程摘要已回帖，12 条记录、5 个维度。周一评审前需增删维度，直接在这里说。' },
    { type: 'accept', id: 'ac-competitor', state: 'pending', pin: 7 },
  ], 500);

  sess.status = 'running';

  }, 3800);
}

/* 验收归档 → 记忆蒸馏 */
function handleAccept(acId) {
  const sessKey = acId.replace('ac-', '');
  const sess = sessions[sessKey];
  const item = sess.timeline.find(i => i.type === 'accept' && i.id === acId);
  if (!item || item.state === 'done') return;
  item.state = 'done';
  appendItems(sessKey, [
    { type: 'sys', text: '🗂 验收通过 · 会话已归档 · 收件箱已清位' },
    { type: 'sys', text: `🧠 记忆蒸馏：${(sess.acceptMemory || []).length} 条结构化事实 → 「${sess.placeKey}」记忆（右栏可检视/纠正）` },
  ]);
  (sess.acceptMemory || []).forEach(m => MEM[sess.placeKey].push(m));
  sess.status = 'archived';
  sess.preview = '已归档 · 记忆已蒸馏';
  renderTimeline(); renderSidebar(); renderHead(); renderRight();
  toast('任务终态：归档 → 记忆蒸馏 → 侧栏租约到期退出。历史住址：群视图的话题卡（已冷却为归档索引）。');
}

  if (sess.kind === 'local') return { local: true };

  if (sess.placeKey === '产品讨论群') return {
    hard: [
      ['接单', '开启', '覆盖 · 本群'],
      ['触发者', '全部群成员', '继承 · 组织默认'],

      ['审批策略', '非操作者委派的写操作需操作者 ack', '覆盖 · 本群'],

function openAgentPanel() {

  } else if (c.cold) {

function renderRight() {

      body.innerHTML = `<div class="mem-empty">${sess.kind === 'cold'

      ? o.artifacts.map(a => objRow(a, '工件')).join('')

    body.innerHTML = `<div class="res-sec">本会话工件</div>${arts}${refs}${evs}`;

  }

  if (state.resTab === 'mem') {

    if (!sess.placeKey) {

  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3400);
}
function showNote(no, anchorRect) {
  const n = NOTES[no];
  if (!n) return;
  $('popNo').textContent = `注 ${no}`;
  $('popTitle').textContent = n.title;
  $('popBody').innerHTML = n.body;
  const pop = $('popover');
  pop.classList.add('show');
  const w = 330, pad = 12;
  let x = anchorRect.left + anchorRect.width / 2 - w / 2;
  x = Math.max(pad, Math.min(x, window.innerWidth - w - pad));
  let y = anchorRect.bottom + 10;
  if (y > window.innerHeight - 260) y = Math.max(pad, anchorRect.top - 10 - 240);
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
}

/* ---------- 切换会话 ---------- */
function openSession(key) {
  state.current = key;
  state.groupFilter = 'all';
  state.preview = null;
  renderSidebar(); renderHead(); renderTimeline(); refreshVoiceAvail(); renderRight();
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', (e) => {
  const pin = e.target.closest('.pin');
  if (pin) { e.preventDefault(); e.stopPropagation(); showNote(pin.dataset.note, pin.getBoundingClientRect()); return; }
  if (!e.target.closest('.popover')) $('popover').classList.remove('show');

  const trace = e.target.closest('[data-trace]');
  if (trace) {
    e.preventDefault();
    toast('打开 deepseek-harness 会话详情（轨迹沿用 harness 自身视图，不另造 viewer）· 群内仅可见过程摘要文档');
    return;
  }
  const apEdit = e.target.closest('[data-apedit]');
  if (apEdit) { toast('真实实现：跳转全局设置页 · 场所 × 能力矩阵（硬合同仅结构化编辑，模型与对话不可写）'); return; }
  if (e.target.closest('#apClose') || e.target === $('apanelMask')) {
    $('apanelMask').classList.remove('show');
    return;
  }
  const ap = e.target.closest('[data-apanel]');
  if (ap) { openAgentPanel(); return; }

  const gf = e.target.closest('[data-gfilter]');
  if (gf) { state.groupFilter = gf.dataset.gfilter; renderHead(); renderTimeline(); return; }

  const item = e.target.closest('[data-sess]');
  if (item) { openSession(item.dataset.sess); return; }

  const cc = e.target.closest('[data-cc]');
  if (cc) { handleCardAction(cc.dataset.cc, cc.dataset.act); return; }

  const ac = e.target.closest('[data-accept]');
  if (ac) { handleAccept(ac.dataset.accept); return; }

  const goto = e.target.closest('[data-goto]');
  if (goto) {
    const target = Object.keys(sessions).find(k => sessions[k].status === goto.dataset.goto);
    if (target) openSession(target);
    return;
  }

  const ref = e.target.closest('[data-ref]');
  if (ref) {
    if (!state.chips.includes(ref.dataset.ref)) state.chips.push(ref.dataset.ref);
    renderChips();
    toast('已加入引用 chip —— 发送时作为上下文喂给 Agent');
    $('input').focus();
    return;
  }
  const chipX = e.target.closest('[data-chip]');
  if (chipX) { state.chips.splice(+chipX.dataset.chip, 1); renderChips(); return; }

  const pback = e.target.closest('[data-pback]');
  if (pback) { state.preview = null; renderRight(); return; }
  const extopen = e.target.closest('[data-extopen]');
  if (extopen) { toast('真实实现：在云之家中打开该对象'); return; }
  const ressub = e.target.closest('[data-ressub]');
  if (ressub) { state.resSub = ressub.dataset.ressub; state.preview = null; renderRight(); return; }
  const restype = e.target.closest('[data-restype]');
  if (restype) { state.resType = restype.dataset.restype; renderRight(); return; }
  const evd = e.target.closest('[data-evdelegate]');
  if (evd) {
    const ev = EVENTS[evd.dataset.evdelegate];
    const chip = `${ev.title}（日程）`;
    if (!state.chips.includes(chip)) state.chips.push(chip);
    renderChips();
    if (!$('voicePub').disabled) setVoice('pub', { silent: true });
    const input = $('input');
    input.value = `@云小助 为「${ev.title}」`;
    input.dispatchEvent(new Event('input'));
    input.focus();
    toast('已预填委派并携带事件引用（生成边 · pull 版）——补上要准备什么，发送即可');
    return;
  }
  const pv = e.target.closest('[data-preview]');
  if (pv) { state.preview = pv.dataset.preview; renderRight(); return; }

  const memDel = e.target.closest('[data-mem]');
  if (memDel) {
    const sess = sessions[state.current];
    MEM[sess.placeKey].filter(m => !m.deleted)[+memDel.dataset.mem].deleted = true;
    renderRight();
    toast('记忆已删除 —— 纠正通道是一等功能：错误记忆比没有记忆更伤信任');
    return;
  }

  const art = e.target.closest('[data-artifact]');
  if (art) {
    const k = art.dataset.pv;
    if (k) {
      state.resTab = 'cur'; state.preview = k;
      document.querySelectorAll('.res-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'cur'));
      renderRight();
      toast('右栏就地预览（只读）—— 验收不出屏');
    } else toast('真实实现：在云之家中打开该对象');
    return;
  }

  const tab = e.target.closest('.res-tab');
  if (tab) {
    state.resTab = tab.dataset.tab;
    state.preview = null;
    document.querySelectorAll('.res-tab').forEach(t => t.classList.toggle('active', t === tab));
    renderRight();
    return;
  }
});

$('voicePri').addEventListener('click', () => !$('voicePri').disabled && setVoice('pri'));
$('voicePub').addEventListener('click', () => !$('voicePub').disabled && setVoice('pub'));
$('input').addEventListener('input', updateVoiceHint);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
$('send').addEventListener('click', handleSend);

$('annotateToggle').addEventListener('click', () => {
  const on = document.body.classList.toggle('annotate');
  $('annotateToggle').setAttribute('aria-pressed', on);
  if (!on) $('popover').classList.remove('show');
});
$('hintClose').addEventListener('click', () => {
  $('hintbar').remove();
  document.body.classList.add('no-hint');
});
$('popClose').addEventListener('click', () => $('popover').classList.remove('show'));
$('floatball').addEventListener('click', () => {
  const confirmKey = Object.keys(sessions).find(k => sessions[k].status === 'confirm');
  const reviewKey = Object.keys(sessions).find(k => sessions[k].status === 'review');
  const target = confirmKey || reviewKey;
  if (target) { openSession(target); toast('悬浮球 = 注意力汇总：优先跳到最需要你的会话'); }
});

/* ---------- 启动 ---------- */
renderSidebar(); renderHead(); renderTimeline(); renderRight(); refreshVoiceAvail();
</script>
</body>
</html>
